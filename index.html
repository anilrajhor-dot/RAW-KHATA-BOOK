    }
  }
  const cmaRatios = computeCmaRatios(cma, cust?cust.income.monthly:0, proposedEmi);

  const rec = {
    id: uid("apr"),
    customerId, leadId,
    collateralValue: Number(document.getElementById("af-collateral").value)||null,
    businessVerification: document.getElementById("af-biz-verify").value.trim(),
    residenceVerification: document.getElementById("af-res-verify").value.trim(),
    neighbourVerification: document.getElementById("af-nbr-verify").value.trim(),
    creditBureauReport: document.getElementById("af-bureau").value.trim(),
    incomeAssessment: document.getElementById("af-income-assess").value.trim(),
    cashFlowAssessment: document.getElementById("af-cashflow").value.trim(),
    householdExpenses: Number(document.getElementById("af-hh-expenses").value)||null,
    repaymentCapacity: Number(document.getElementById("af-repayment-capacity").value)||null,
    cma, cmaRatios,
    documentChecklist: Array.from(document.querySelectorAll(".af-doc-check")).map(el=>({name: el.dataset.doc, checked: el.checked})),
    riskRating: document.getElementById("af-risk").value,
    recommendation: document.getElementById("af-recommendation").value,
    photoBase64: appraisalDraft.photoBase64,
    gpsLat: appraisalDraft.gpsLat, gpsLng: appraisalDraft.gpsLng,
    officerName: document.getElementById("af-officer").value.trim(),
    appraisalDate: document.getElementById("af-date").value,
    status: "Submitted",
    createdAt: nowISO(), createdBy: session.user.name
  };
  await db.put("appraisals", rec);
  await logAudit(session.user.name, session.user.role, "Credit Appraisal Submitted", `${cust?cust.personal.name:customerId} — Risk: ${rec.riskRating}, Recommendation: ${rec.recommendation}`);

  let autoSanctionResult = null;
  if(leadId){
    const lead = await db.get("leads", leadId);
    if(lead){
      if(rec.recommendation==="Approve") lead.status="Eligible";
      else if(rec.recommendation==="Reject") lead.status="Rejected";
      else lead.status="Under Verification";
      await db.put("leads", lead);
      await logAudit(session.user.name, session.user.role, "Lead Status Changed (via Appraisal)", `${lead.applicantName}: → ${lead.status}`);

      if(rec.recommendation==="Approve" && cust && !lead.sanctionId){
        autoSanctionResult = await attemptAutoSanction(lead, cust, rec);
      }
    }
  }

  toast(autoSanctionResult && autoSanctionResult.sanctioned ? "Appraisal submitted — rule engine auto-sanctioned this loan." : "Appraisal submitted.");
  session.appraisalSubview = "list";
  render();
}

/* ---------------------------------------------------------------------
   Straight-Through Processing: auto-sanction (and auto-disburse if a
   payout provider is configured) when a product's rules all pass.
   --------------------------------------------------------------------- */
async function attemptAutoSanction(lead, customer, appraisal){
  const products = await db.getAll("products");
  const product = products.find(p=>p.name===lead.product);
  if(!product || !product.active || !product.autoSanctionEnabled) return { sanctioned:false };

  const estEmi = estimateMonthlyEmi(lead.amountRequested, product.interestRate, product.tenureMax);
  const cmaR = appraisal.cmaRatios || {};
  const context = {
    creditScore: customer.creditScore,
    monthlyIncome: customer.income.monthly,
    takeHomePay: appraisal.cma ? (appraisal.cma.takeHomePay || null) : null,
    riskCategoryScore: RISK_CATEGORY_SCORE[customer.riskCategory] || null,
    amountRequested: lead.amountRequested,
    foirPct: cmaR.foirPct!==undefined && cmaR.foirPct!==null ? cmaR.foirPct : (customer.income.monthly ? (estEmi/customer.income.monthly*100) : null),
    currentRatio: cmaR.currentRatio!==undefined ? cmaR.currentRatio : null,
    debtEquityRatio: cmaR.debtEquityRatio!==undefined ? cmaR.debtEquityRatio : null,
    dscr: cmaR.dscr!==undefined ? cmaR.dscr : null,
    netWorth: cmaR.netWorth!==undefined ? cmaR.netWorth : null,
  };
  const evalResult = evaluateProductRules(product, context);
  if(!evalResult.passed){
    await logAudit("System (Rule Engine)", "System", "Auto-Sanction Declined", `${customer.personal.name} — ${product.name} — one or more rules not met`);
    return { sanctioned:false, evalResult };
  }

  const fundPos = await computeFundPosition();
  if(lead.amountRequested > fundPos.available){
    await logAudit("System (Rule Engine)", "System", "Auto-Sanction Blocked", `${customer.personal.name} — insufficient available funds (${fmtINR(fundPos.available)} available, ${fmtINR(lead.amountRequested)} requested)`);
    return { sanctioned:false };
  }
  if(product.maxLoanAmount && lead.amountRequested > product.maxLoanAmount){
    await logAudit("System (Rule Engine)", "System", "Auto-Sanction Blocked", `${customer.personal.name} — exceeds product max ${fmtINR(product.maxLoanAmount)}`);
    return { sanctioned:false };
  }
  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const borrowerExp = await computeBorrowerExposure(customer.id, null);
  if(borrowerExp + lead.amountRequested > policy.exposure.maxBorrowerExposure){
    await logAudit("System (Rule Engine)", "System", "Auto-Sanction Blocked", `${customer.personal.name} — exceeds borrower exposure cap`);
    return { sanctioned:false };
  }

  const sanction = {
    id: uid("snc"), leadId: lead.id, customerId: customer.id, product: product.name,
    sanctionedAmount: lead.amountRequested, interestRate: product.interestRate, tenureMonths: product.tenureMax,
    proposedBy: "System (Rule Engine)", proposedByRole: "System", createdAt: nowISO(),
    status: "Approved", approvedBy: "System (Rule Engine)", approvedByRole: "System", approvedAt: nowISO(),
    disbursementId:null, loanAccountId:null, overrideUsed:false, overrideReason:"",
    autoSanctioned:true, ruleEvaluation: evalResult.results
  };
  await db.put("sanctions", sanction);
  lead.sanctionId = sanction.id;
  lead.status = "Converted into Loan Application";
  await db.put("leads", lead);
  await logAudit("System (Rule Engine)", "System", "Sanction Auto-Approved", `${customer.personal.name} — ${product.name} — ${fmtINR(lead.amountRequested)} — all configured rules passed (bypasses human Maker-Checker by product policy)`);

  // Only actually create the loan account / mark disbursed if a real payout
  // provider is configured AND the transfer succeeds. Otherwise the
  // sanction sits Approved & undisbursed in the normal manual queue.
  const fundAccounts = await db.getAll("fundAccounts");
  const fundAccount = fundAccounts[0] || null;
  let payoutResult = { ok:false, status:"Not Configured" };
  if(fundAccount){
    payoutResult = await attemptPayout(customer.personal.name, customer.bank.account, customer.bank.ifsc, sanction.sanctionedAmount, "Loan disbursement — auto-sanctioned");
  }

  if(payoutResult.ok){
    const loanAccount = {
      id: uid("loa"), sanctionId: sanction.id, customerId: customer.id, product: product.name,
      principal: sanction.sanctionedAmount, interestRate: sanction.interestRate, tenureMonths: sanction.tenureMonths,
      emiFrequency: product.emiFrequency, disbursedDate: todayStr(), status:"Active", createdAt: nowISO(), createdBy:"System (Rule Engine)",
      accountNumber: await generateLoanAccountNumber()
    };
    const gen = generateEmiSchedule(loanAccount);
    loanAccount.schedule = gen.schedule; loanAccount.emiAmount = gen.emiAmount; loanAccount.totalInstallments = gen.totalInstallments;
    loanAccount.principalOutstanding = loanAccount.principal;
    await db.put("loanAccounts", loanAccount);

    const disbursement = {
      id: uid("dsb"), sanctionId: sanction.id, customerId: customer.id, amount: sanction.sanctionedAmount,
      mode:"Auto Bank Transfer", date: todayStr(), utr: (payoutResult.raw && payoutResult.raw.utr) || "AUTO"+Date.now(),
      fundAccountId: fundAccount.id, fundAccountName: fundAccount.name,
      createdAt: nowISO(), createdBy:"System (Rule Engine)"
    };
    await db.put("disbursements", disbursement);
    fundAccount.balance -= sanction.sanctionedAmount;
    await db.put("fundAccounts", fundAccount);
    await postToGeneralLedger({
      date: todayStr(), voucherType: "Payment Voucher", narration: `Auto-Disbursement — ${sanction.product} — ${loanAccount.accountNumber}`,
      lineDefs: [
        { accountName: "Loan Portfolio — Principal Outstanding", side: "debit", amount: sanction.sanctionedAmount },
        { accountName: glAccountForMode("Bank"), side: "credit", amount: sanction.sanctionedAmount },
      ],
      actor: "System (Rule Engine)", actorRole: "System"
    });
    sanction.disbursementId = disbursement.id;
    sanction.loanAccountId = loanAccount.id;
    await db.put("sanctions", sanction);
    await logAudit("System (Rule Engine)", "System", "Loan Auto-Disbursed", `${customer.personal.name} — ${fmtINR(sanction.sanctionedAmount)} to A/c ${loanAccount.accountNumber} — ${payoutResult.status}`);
    session.remindersEnsuredThisSession = false; // a new schedule now exists — let Reminders pick it up next visit
    await accrueDsaCommission(lead.id, sanction, sanction.sanctionedAmount, "System (Rule Engine)");
    return { sanctioned:true, disbursed:true, sanction, loanAccount };
  } else {
    await logAudit("System (Rule Engine)", "System", "Auto-Disbursement Pending", `${customer.personal.name} — ${fmtINR(sanction.sanctionedAmount)} sanctioned but not transferred — no payout provider configured under Integrations. Complete the transfer manually from Sanction & Disbursement.`);
    return { sanctioned:true, disbursed:false, sanction };
  }
}

/* ---------------------------------------------------------------------
   Phase 4 handlers: Sanction
   --------------------------------------------------------------------- */
async function handleSubmitSanction(){
  const u = session.user;
  const leadId = document.getElementById("sf-lead").value;
  const lead = await db.get("leads", leadId);
  if(!lead){ toast("Select an application."); return; }
  const amount = Number(document.getElementById("sf-amount").value);
  const rate = Number(document.getElementById("sf-rate").value);
  const tenure = Number(document.getElementById("sf-tenure").value);
  if(!amount || amount<=0){ toast("Enter a valid sanctioned amount."); return; }

  const products = await db.getAll("products");
  const prod = products.find(p=>p.name===lead.product);
  if(prod && prod.maxLoanAmount && amount > prod.maxLoanAmount){
    toast(`Exceeds the ${lead.product} maximum of ${fmtINR(prod.maxLoanAmount)} set in Loan Products. Only Super Admin can raise that limit — this cannot be overridden here.`);
    return;
  }

  const fundPos = await computeFundPosition();
  const fundsOk = amount <= fundPos.available;
  const overrideBox = document.getElementById("sf-override");
  const overrideChecked = overrideBox ? overrideBox.checked : false;
  const overrideReason = overrideChecked ? document.getElementById("sf-override-reason").value.trim() : "";

  if(!fundsOk){
    const canOverride = u.role==="Super Admin" || u.role==="Managing Director";
    if(!canOverride){ toast("Insufficient available funds. Only Super Admin or Managing Director can override."); return; }
    if(!overrideChecked){ toast("Available funds are insufficient. Tick the override box and give a reason to proceed."); return; }
    if(!overrideReason){ toast("An override reason is required."); return; }
  }

  const sanction = {
    id: uid("snc"), leadId, customerId: lead.customerId, product: lead.product,
    sanctionedAmount: amount, interestRate: rate, tenureMonths: tenure,
    proposedBy: u.name, proposedByRole: u.role, createdAt: nowISO(),
    status: "Proposed", approvedBy:null, approvedAt:null, disbursementId:null, loanAccountId:null,
    overrideUsed: !fundsOk, overrideReason
  };
  await db.put("sanctions", sanction);
  lead.sanctionId = sanction.id;
  await db.put("leads", lead);
  await logAudit(u.name, u.role, "Sanction Proposed", `${lead.applicantName} — ${fmtINR(amount)}${sanction.overrideUsed ? " (fund override used: "+overrideReason+")" : ""}`);
  toast("Sanction proposed — awaiting approval from a different authorised officer.");
  session.sanctionSubview = "list";
  render();
}

async function handleApproveSanction(sanctionId){
  const u = session.user;
  const sanction = await db.get("sanctions", sanctionId);
  if(!sanction) return;
  if(sanction.proposedBy === u.name){ toast("Maker-Checker: you cannot approve your own proposal."); return; }
  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const limit = getDelegationLimitForRole(policy, u.role);
  if(u.role!=="Super Admin" && limit < sanction.sanctionedAmount){ toast("This amount exceeds your delegation limit."); return; }
  sanction.status = "Approved";
  sanction.approvedBy = u.name;
  sanction.approvedByRole = u.role;
  sanction.approvedAt = nowISO();
  await db.put("sanctions", sanction);
  await logAudit(u.name, u.role, "Sanction Approved", `${sanction.id} — ${fmtINR(sanction.sanctionedAmount)} (Maker: ${sanction.proposedBy})`);
  toast("Sanction approved.");
  render();
}

async function handleRejectSanction(sanctionId){
  const u = session.user;
  const sanction = await db.get("sanctions", sanctionId);
  if(!sanction) return;
  if(sanction.proposedBy === u.name){ toast("Maker-Checker: you cannot reject your own proposal."); return; }
  const reason = window.prompt("Reason for rejecting this sanction:", "");
  if(reason===null) return;
  sanction.status = "Rejected";
  sanction.rejectedBy = u.name;
  sanction.rejectedAt = nowISO();
  sanction.rejectionReason = reason;
  await db.put("sanctions", sanction);
  if(sanction.leadId){
    const lead = await db.get("leads", sanction.leadId);
    if(lead){ lead.sanctionId = null; lead.status = "Rejected"; await db.put("leads", lead); }
  }
  await logAudit(u.name, u.role, "Sanction Rejected", `${sanction.id} — ${reason||"no reason given"}`);
  toast("Sanction rejected.");
  render();
}

/* ---------------------------------------------------------------------
   Phase 4 handlers: Disbursement
   --------------------------------------------------------------------- */
async function handleConfirmDisbursement(sanctionId){
  const u = session.user;
  const sanction = await db.get("sanctions", sanctionId);
  if(!sanction){ toast("Sanction not found."); return; }
  const mode = document.getElementById("df-mode").value;
  const date = document.getElementById("df-date").value;
  const amount = Number(document.getElementById("df-amount").value);
  const utr = document.getElementById("df-utr").value.trim();
  const accountId = document.getElementById("df-account").value;
  if(!amount || amount<=0){ toast("Enter a valid disbursed amount."); return; }
  const account = await db.get("fundAccounts", accountId);
  if(!account){ toast("Select a source fund account."); return; }
  if(amount > account.balance){ toast("Disbursed amount exceeds the selected account's balance."); return; }

  const disbursement = {
    id: uid("dsb"), sanctionId, customerId: sanction.customerId, amount, mode, date, utr,
    fundAccountId: accountId, fundAccountName: account.name, createdAt: nowISO(), createdBy: u.name
  };
  await db.put("disbursements", disbursement);

  account.balance -= amount;
  await db.put("fundAccounts", account);

  const products = await db.getAll("products");
  const prod = products.find(p=>p.name===sanction.product);
  const loanAccount = {
    id: uid("loa"), sanctionId, customerId: sanction.customerId, product: sanction.product,
    principal: amount, interestRate: sanction.interestRate, tenureMonths: sanction.tenureMonths,
    emiFrequency: prod ? prod.emiFrequency : "Monthly", disbursedDate: date, status: "Active",
    createdAt: nowISO(), createdBy: u.name, accountNumber: await generateLoanAccountNumber()
  };
  const gen = generateEmiSchedule(loanAccount);
  loanAccount.schedule = gen.schedule;
  loanAccount.emiAmount = gen.emiAmount;
  loanAccount.totalInstallments = gen.totalInstallments;
  loanAccount.principalOutstanding = loanAccount.principal;
  await db.put("loanAccounts", loanAccount);

  sanction.disbursementId = disbursement.id;
  sanction.loanAccountId = loanAccount.id;
  await db.put("sanctions", sanction);

  await logAudit(u.name, u.role, "Loan Disbursed", `${sanction.product} — ${fmtINR(amount)} via ${mode} (UTR: ${utr||"—"})`);
  await logAudit(u.name, u.role, "Loan Account Created", `${loanAccount.id} for sanction ${sanction.id}`);
  await accrueDsaCommission(sanction.leadId, sanction, amount, u.name);

  await postToGeneralLedger({
    date, voucherType: "Payment Voucher", narration: `Disbursement — ${sanction.product} — ${loanAccount.accountNumber}`,
    lineDefs: [
      { accountName: "Loan Portfolio — Principal Outstanding", side: "debit", amount },
      { accountName: glAccountForMode(mode), side: "credit", amount },
    ],
    actor: u.name, actorRole: u.role
  });

  session.remindersEnsuredThisSession = false; // a new schedule now exists — let Reminders pick it up next visit
  toast("Disbursed. Loan account created.");
  session.sanctionSubview = "list";
  render();
}

async function handleSendSanctionLetter(sanctionId, channel){
  const u = session.user;

  const customer = await db.get("customers", sanction.customerId);
  const to = channel==="email" ? (customer?customer.personal.email:"") : (customer?customer.personal.mobile:"");
  if(!to){ toast("No "+(channel==="email"?"email address":"mobile number")+" on file for this customer."); return; }
  const message = `Dear ${customer.personal.name}, your ${sanction.product} of ${fmtINR(sanction.sanctionedAmount)} has been sanctioned at ${sanction.interestRate}% p.a. over ${sanction.tenureMonths} months. Please contact your branch for the full sanction letter and next steps.`;
  const result = await sendMessage(channel, to, "Loan Sanction Letter", message);
  await logAudit(u.name, u.role, "Sanction Letter Send Attempted", `${customer?customer.personal.name:sanctionId} — ${channel} — ${result.status}`);
  toast(result.ok ? "Sent via "+channel+": "+result.status : result.error);

async function handleConfirmCollection(loanId){
  const u = session.user;
  const acc = await db.get("loanAccounts", loanId);
  if(!acc){ toast("Loan account not found."); return; }
  const instIndex = Number(document.getElementById("cf-installment").value);
  const amount = Number(document.getElementById("cf-amount").value);
  const mode = document.getElementById("cf-mode").value;
  const date = document.getElementById("cf-date").value;
  const ref = document.getElementById("cf-ref").value.trim();
  const fundAccountId = document.getElementById("cf-account").value;
  if(!amount || amount<=0){ toast("Enter a valid collection amount."); return; }

  const inst = acc.schedule.find(i=>i.index===instIndex);
  if(!inst){ toast("Select an installment."); return; }

  const fundAccount = fundAccountId ? await db.get("fundAccounts", fundAccountId) : null;

  const payment = {
    id: uid("pay"), loanAccountId: acc.id, customerId: acc.customerId, installmentIndex: instIndex,
    amount, mode, date, referenceNumber: ref, collectedBy: u.name, createdAt: nowISO(),
    fundAccountId: fundAccountId||null, fundAccountName: fundAccount?fundAccount.name:null
  };
  await db.put("payments", payment);

  if(fundAccount){
    fundAccount.balance += amount;
    await db.put("fundAccounts", fundAccount);
  }

  inst.paidAmount = (inst.paidAmount||0) + amount;
  if(inst.paidAmount >= inst.emiAmount){ inst.status = "Paid"; inst.paidDate = date; }
  else { inst.status = "Partial"; }
  acc.principalOutstanding = acc.schedule.filter(i=>i.status!=="Paid").reduce((s,i)=>s+i.principalComponent,0);
  const allPaid = acc.schedule.every(i=>i.status==="Paid");
  if(allPaid){ acc.status = "Closed"; acc.principalOutstanding = 0; }
  await db.put("loanAccounts", acc);

  const cust = await db.get("customers", acc.customerId);
  await logAudit(u.name, u.role, "EMI Collected", `${cust?cust.personal.name:acc.customerId} — Installment #${instIndex} — ${fmtINR(amount)} via ${mode}`);
  if(allPaid) await logAudit(u.name, u.role, "Loan Closed", `${acc.id} fully repaid`);

  // Split this specific payment into principal/interest proportional to
  // the installment's own split — matters for partial payments, where
  // the amount collected isn't necessarily the full EMI.
  const principalPortion = inst.emiAmount>0 ? Math.round(amount * (inst.principalComponent/inst.emiAmount)) : amount;
  const interestPortion = amount - principalPortion;
  const glLines = [{ accountName: glAccountForMode(mode), side:"debit", amount }];
  if(principalPortion>0) glLines.push({ accountName:"Loan Portfolio — Principal Outstanding", side:"credit", amount:principalPortion });
  if(interestPortion>0) glLines.push({ accountName:"Interest Income", side:"credit", amount:interestPortion });
  await postToGeneralLedger({
    date, voucherType: "Receipt Voucher", narration: `EMI Collection — ${cust?cust.personal.name:acc.customerId} — ${acc.accountNumber} #${instIndex}`,
    lineDefs: glLines, actor: u.name, actorRole: u.role
  });

  session.viewingReceipt = {
    id: payment.id, customerName: cust?cust.personal.name:"—", amount, product: acc.product,
    installmentIndex: instIndex, mode, referenceNumber: ref, date, collectedBy: u.name, createdAt: payment.createdAt,
    outstandingAfter: acc.principalOutstanding
  };
  toast("Payment recorded. Receipt ready.");
  session.loanSubview = "receipt";
  render();
}

async function handleCorrectLoanTerms(loanId){
  const u = session.user;
  const acc = await db.get("loanAccounts", loanId);
  if(!acc) return;
  const principal = Number(document.getElementById("cl-principal").value);
  const interestRate = Number(document.getElementById("cl-rate").value);
  const tenureMonths = Number(document.getElementById("cl-tenure").value);
  const disbursedDate = document.getElementById("cl-disbursed").value;
  const accountNumber = document.getElementById("cl-account-number").value.trim();
  const installmentsPaid = Number(document.getElementById("cl-installments-paid").value)||0;
  if(!principal || principal<=0 || !interestRate || !tenureMonths || !disbursedDate){ toast("Fill in all loan terms with valid values."); return; }

  const existingPayments = (await db.getAll("payments")).filter(p=>p.loanAccountId===loanId);
  if(existingPayments.length>0){
    if(!window.confirm(`This account has ${existingPayments.length} real collection(s) recorded. Regenerating the schedule will make those records reference installments that may no longer match. Continue anyway?`)) return;
  }
  if(accountNumber && accountNumber!==acc.accountNumber){
    const clash = (await db.getAll("loanAccounts")).find(a=>a.id!==loanId && a.accountNumber===accountNumber);
    if(clash){ toast("That account number is already in use by another loan account."); return; }
  }

  acc.principal = principal;
  acc.interestRate = interestRate;
  acc.tenureMonths = tenureMonths;
  acc.disbursedDate = disbursedDate;
  if(accountNumber) acc.accountNumber = accountNumber;

  const gen = generateEmiSchedule(acc);
  acc.schedule = gen.schedule; acc.emiAmount = gen.emiAmount; acc.totalInstallments = gen.totalInstallments;
  const toMark = Math.min(installmentsPaid, acc.schedule.length);
  for(let k=0; k<toMark; k++){
    const inst = acc.schedule[k];
    inst.status = "Paid"; inst.paidAmount = inst.emiAmount; inst.paidDate = inst.dueDate;
  }
  acc.principalOutstanding = acc.schedule.filter(i=>i.status!=="Paid").reduce((s,i)=>s+i.principalComponent,0);
  acc.correctedAt = nowISO();
  acc.correctedBy = u.name;
  await db.put("loanAccounts", acc);

  await logAudit(u.name, u.role, "Loan Account Terms Corrected", `${acc.accountNumber} — principal ${fmtINR(principal)}, rate ${interestRate}%, tenure ${tenureMonths}mo, ${toMark} installments marked paid${existingPayments.length>0?' — WARNING: had '+existingPayments.length+' real collection record(s) at time of correction':''}`);
  toast("Loan terms corrected and schedule regenerated.");
  session.showCorrectLoanForm = false;
  render();
}

async function handleForecloseLoan(loanId){
  const u = session.user;
  const acc = await db.get("loanAccounts", loanId);
  if(!acc) return;
  const principalOutstanding = acc.principalOutstanding;
  const paidInstallments = acc.schedule.filter(i=>i.status==="Paid" && i.paidDate).sort((a,b)=> new Date(b.paidDate) - new Date(a.paidDate));
  const lastPaidDate = paidInstallments.length ? paidInstallments[0].paidDate : acc.disbursedDate;
  const today = todayStr();
  const daysSince = Math.max(0, Math.round((new Date(today) - new Date(lastPaidDate)) / (1000*60*60*24)));
  const accruedInterest = principalOutstanding * (acc.interestRate/100) * (daysSince/365);
  const payoffAmount = principalOutstanding + accruedInterest;

  const confirmMsg = `Foreclose this loan?\n\nPrincipal outstanding: ${fmtINR(principalOutstanding)}\nAccrued interest (${daysSince} days since ${lastPaidDate} @ ${acc.interestRate}% p.a.): ${fmtINR(Math.round(accruedInterest))}\nTotal payoff amount: ${fmtINR(Math.round(payoffAmount))}\n\nThis doesn't include any prepayment charges your product terms may carry — check manually if applicable. Continue?`;
  if(!window.confirm(confirmMsg)) return;

  acc.schedule.forEach(i=>{ if(i.status!=="Paid"){ i.status="Foreclosed"; i.paidDate=today; i.paidAmount=0; } });
  acc.principalOutstanding = 0;
  acc.status = "Closed (Foreclosed)";
  acc.foreclosureAccruedInterest = Math.round(accruedInterest);
  acc.foreclosurePayoffAmount = Math.round(payoffAmount);
  acc.foreclosedAt = nowISO();
  await db.put("loanAccounts", acc);

  const cust = await db.get("customers", acc.customerId);
  await logAudit(u.name, u.role, "Loan Foreclosed", `${cust?cust.personal.name:acc.customerId} — Principal ${fmtINR(principalOutstanding)} + Accrued Interest ${fmtINR(Math.round(accruedInterest))} = Payoff ${fmtINR(Math.round(payoffAmount))}`);
  toast(`Foreclosed. Payoff amount ${fmtINR(Math.round(payoffAmount))} — record it as a payment under Collect EMI (or a Journal entry) once received, this doesn't move funds by itself.`);
  render();
}

/* ---------------------------------------------------------------------
   Phase 5 handlers: Reminders
   --------------------------------------------------------------------- */
function reminderMessageFor(r){
  return r.ruleLabel.startsWith("Custom:") ? r.ruleLabel.replace("Custom: ","") :
    `Reminder: your EMI installment #${r.installmentIndex} of ${r.dueDate ? "due "+r.dueDate : ""} needs attention. Please contact your branch.`;
}

/** Does the actual channel-by-channel sending and returns the updated
 *  record plus results — deliberately does NOT write to Firestore
 *  itself. That's what lets the bulk path (handleSendAllDueReminders)
 *  batch hundreds of updates into one write instead of one write per
 *  reminder, which was the real cause of Reminders being slow to open
 *  at any real portfolio size — parallelizing the loop wasn't enough
 *  on its own if each iteration still did its own individual write. */
async function composeReminderSend(r, u){
  const message = reminderMessageFor(r);
  let sendResults = [];
  for(const channel of (r.channels||[])){
    const key = channel==="WhatsApp" ? "whatsapp" : channel==="Email" ? "email" : null;
    if(!key) continue; // SMS/Push/Voice have no configured provider hook yet
    if(channel==="Email" && !r.customerEmail){ sendResults.push("Email: No email on file for this customer"); continue; }
    const to = channel==="Email" ? r.customerEmail : r.customerMobile;
    const result = await sendMessage(key, to, "Payment Reminder", message);
    sendResults.push(`${channel}: ${result.status}`);
  }
  const updated = { ...r, status:"Sent", sentAt: nowISO(), sentBy: u.name, sendResults };
  return { updated, sendResults };
}

async function sendReminderMessage(r, u){
  const { updated, sendResults } = await composeReminderSend(r, u);
  await db.put("reminders", updated);
  const detail = sendResults.length ? sendResults.join("; ") : "no configured channel — logged only";
  await logAudit(u.name, u.role, "Reminder Sent", `${r.customerName} — ${r.ruleLabel} — ${detail}`);
  return sendResults;
}

async function handleMarkReminderSent(reminderId){
  const u = session.user;
  const r = await db.get("reminders", reminderId);
  if(!r) return;
  const sendResults = await sendReminderMessage(r, u);
  toast(sendResults.length ? "Send attempted: "+sendResults.join(", ") : "Marked as sent (no provider configured for these channels).");
  render();
}

/** Sends WhatsApp/Email for every currently-due pending reminder in one
 *  batch. Triggered automatically the first time Reminders is opened in
 *  a session (so it happens "on clicking the menu," as requested),
 *  guarded so it only fires once per login rather than on every
 *  re-render — real messages shouldn't go out repeatedly just because
 *  the screen redrew. A manual "Send All Due Now" button re-runs it
 *  anytime, e.g. after adding a new custom reminder mid-session. */
async function handleSendAllDueReminders(auto){
  const u = session.user;
  const pending = (await db.getAll("reminders")).filter(r=>r.status==="Pending" && (r.channels||[]).some(c=>c==="WhatsApp"||c==="Email"));
  if(pending.length===0){
    if(!auto) toast("No reminders due right now.");
    return;
  }
  const composed = await Promise.all(pending.map(r=> composeReminderSend(r, u)));
  await db.putMany("reminders", composed.map(c=>c.updated));
  let sentCount = 0, notConfiguredCount = 0;
  composed.forEach(c=>{
    if(c.sendResults.some(r=>r.includes("Not Configured"))) notConfiguredCount++;
    else sentCount++;
  });
  await logAudit(u.name, u.role, "Bulk Reminders Sent", `${pending.length} reminder(s) processed — ${auto?'auto-triggered on opening Reminders':'manually triggered'}`);
  toast(`${pending.length} reminder(s) processed.${notConfiguredCount>0 ? ' '+notConfiguredCount+' need a WhatsApp/Email provider configured under Integrations to actually go out.' : ''}`);
  if(!auto) render(); // auto-trigger runs inside an in-progress render() pass — calling render() again here would be recursive; the same pass already reflects the updated data since this runs before the pending list is read.
}

async function handlePostNpaProvisioning(){
  const u = session.user;
  const acct = await computeAccountingSummary();
  const requiredProvisioning = Math.round(acct.npaProvision);
  const balances = await computeAllLedgerBalances();
  const provisionAccountBalance = balances.find(b=>b.account.name==="Provision for NPA / Impairment Allowance");
  const alreadyPosted = Math.round(provisionAccountBalance ? provisionAccountBalance.balance : 0);
  const delta = requiredProvisioning - alreadyPosted;
  if(Math.abs(delta) < 1){ toast("Provisioning is already up to date."); return; }

  const isIncrease = delta > 0;
  if(!window.confirm(`${isIncrease?'Post additional':'Release excess'} provisioning of ${fmtINR(Math.abs(delta))}?`)) return;

  await postToGeneralLedger({
    date: todayStr(), voucherType: "Journal Voucher",
    narration: `NPA Provisioning ${isIncrease?'increase':'release'} — true-up to ${fmtINR(requiredProvisioning)} required`,
    lineDefs: isIncrease
      ? [{accountName:"NPA Provisioning / Impairment Expense", side:"debit", amount:Math.abs(delta)}, {accountName:"Provision for NPA / Impairment Allowance", side:"credit", amount:Math.abs(delta)}]
      : [{accountName:"Provision for NPA / Impairment Allowance", side:"debit", amount:Math.abs(delta)}, {accountName:"NPA Provisioning / Impairment Expense", side:"credit", amount:Math.abs(delta)}],
    actor: u.name, actorRole: u.role
  });
  await logAudit(u.name, u.role, "NPA Provisioning Posted to GL", `${isIncrease?'Increase':'Release'} of ${fmtINR(Math.abs(delta))} — new total ${fmtINR(requiredProvisioning)}`);
  toast(`${isIncrease?'Posted':'Released'} ${fmtINR(Math.abs(delta))}.`);
  render();
}

async function handlePostDepreciation(){
  const u = session.user;
  const assets = await db.getAll("fixedAssets");
  let totalIncrement = 0;
  const updatedAssets = [];
  for(const a of assets.filter(x=>x.status==="Active")){
    const { accumulatedDepreciation } = computeAssetBookValue(a);
    const alreadyPosted = a.lastDepreciationPostedValue || 0;
    const increment = accumulatedDepreciation - alreadyPosted;
    if(increment >= 1){
      totalIncrement += increment;
      updatedAssets.push({ ...a, lastDepreciationPostedValue: accumulatedDepreciation });
    }
  }
  if(totalIncrement < 1){ toast("Nothing new to post — depreciation is already up to date."); return; }
  if(!window.confirm(`Post ${fmtINR(Math.round(totalIncrement))} of accrued depreciation to the General Ledger?`)) return;

  await postToGeneralLedger({
    date: todayStr(), voucherType: "Journal Voucher", narration: `Depreciation for the period — ${updatedAssets.length} asset(s)`,
    lineDefs: [
      { accountName: "Depreciation", side: "debit", amount: Math.round(totalIncrement) },
      { accountName: "Accumulated Depreciation", side: "credit", amount: Math.round(totalIncrement) },
    ],
    actor: u.name, actorRole: u.role
  });
  for(const a of updatedAssets){ await db.put("fixedAssets", a); }
  await logAudit(u.name, u.role, "Depreciation Posted to GL", `${fmtINR(Math.round(totalIncrement))} across ${updatedAssets.length} asset(s)`);
  toast(`Posted ${fmtINR(Math.round(totalIncrement))} of depreciation.`);
  render();
}

async function handleUploadStatement(){

async function handleMarkNoSystemRecord(lineId){
  const u = session.user;
  const line = await db.get("bankStatementLines", lineId);
  if(!line) return;
  const categorySelect = document.querySelector(`.no-record-category-select[data-line="${lineId}"]`);
  const category = categorySelect ? categorySelect.value : "Other Expense";
  const fundAccount = await db.get("fundAccounts", line.fundAccountId);
  const type = line.amount < 0 ? "Expense" : "Income";
  const amount = Math.abs(line.amount);

  // This bank-side transaction had no matching app record — recording
  // it now closes the actual gap reconciliation exists to catch,
  // rather than just acknowledging the line was looked at.
  const entry = {
    id: uid("jnl"), type, category, date: line.date, amount, mode: "Bank",
    description: `Bank reconciliation — ${line.description}`,
    fundAccountId: line.fundAccountId, fundAccountName: fundAccount?fundAccount.name:"—",
    createdAt: nowISO(), createdBy: u.name, proposedBy: u.name, proposedByRole: u.role,
    status: "Posted", approvedBy: u.name, approvedAt: nowISO()
  };
  await db.put("journalEntries", entry);
  if(fundAccount){
    fundAccount.balance += (type==="Income" ? amount : -amount);
    await db.put("fundAccounts", fundAccount);
  }
  const glAccountName = glAccountForCategory(category, type);
  await postToGeneralLedger({
    date: line.date, voucherType: type==="Expense" ? "Payment Voucher" : "Receipt Voucher",
    narration: `Bank reconciliation — ${line.description}`,
    lineDefs: type==="Expense"
      ? [{accountName: glAccountName, side:"debit", amount}, {accountName: glAccountForMode("Bank"), side:"credit", amount}]
      : [{accountName: glAccountForMode("Bank"), side:"debit", amount}, {accountName: glAccountName, side:"credit", amount}],
    actor: u.name, actorRole: u.role
  });

  line.matched = true;
  line.matchedType = "No System Record";
  line.matchedId = null;
  line.recordedCategory = category;
  await db.put("bankStatementLines", line);
  await logAudit(u.name, u.role, "Bank Statement Line Reconciled — Entry Recorded", `${line.description} — ${category} — ${fmtINR(amount)}`);
  toast(`Recorded as ${category} and reconciled.`);
  session.showRecordCategoryFor = null;
  render();
}

async function handleRunPayroll(){
  const u = session.user;
  const month = document.getElementById("payroll-month").value;
  const accountId = document.getElementById("payroll-account").value;
  if(!month){ toast("Select a month."); return; }
  const fundAccount = await db.get("fundAccounts", accountId);
  if(!fundAccount){ toast("Select a fund account."); return; }
  const salaries = (await db.getAll("staffSalaries")).filter(s=>s.active);
  if(salaries.length===0){ toast("No active salary structures to run."); return; }

  const alreadyRun = (await db.getAll("payrollRuns")).filter(r=>r.month===month);
  if(alreadyRun.length>0 && !window.confirm(`Payroll for ${month} already has ${alreadyRun.length} record(s). Run again and add more?`)) return;

  let totalPaid = 0, paidCount = 0, manualCount = 0;
  for(const s of salaries){
    const payoutResult = await attemptPayout(s.staffName, "", "", s.netSalary, "Salary — "+month);
    const paid = payoutResult.ok;
    await db.put("payrollRuns", {
      id: uid("pyr"), month, staffId: s.staffId, staffName: s.staffName, grossSalary: s.grossSalary,
      totalDeductions: s.totalDeductions, netSalary: s.netSalary, fundAccountId: accountId, fundAccountName: fundAccount.name,
      payoutStatus: paid ? "Paid" : "Manual", paidDate: paid ? todayStr() : null, createdAt: nowISO(), createdBy: u.name
    });
    await db.put("journalEntries", {
      id: uid("jnl"), type:"Expense", category:"Salaries", date: todayStr(), amount: s.netSalary,
      description: `${s.staffName} — ${month}`, fundAccountId: accountId, fundAccountName: fundAccount.name,
      createdAt: nowISO(), createdBy: u.name, proposedBy: u.name, proposedByRole: u.role, status:"Posted", approvedBy: u.name, approvedAt: nowISO()
    });
    fundAccount.balance -= s.netSalary;
    totalPaid += s.netSalary;
    if(paid) paidCount++; else manualCount++;
    await postToGeneralLedger({
      date: todayStr(), voucherType: "Payment Voucher", narration: `Salary — ${s.staffName} — ${month}`,
      lineDefs: [
        { accountName: "Salaries & Staff Costs", side: "debit", amount: s.netSalary },
        { accountName: glAccountForMode("Bank"), side: "credit", amount: s.netSalary },
      ],
      actor: u.name, actorRole: u.role
    });
  }
  await db.put("fundAccounts", fundAccount);
  await logAudit(u.name, u.role, "Payroll Run", `${month} — ${salaries.length} staff — ${fmtINR(totalPaid)} total — ${paidCount} auto-paid, ${manualCount} need manual transfer`);
  toast(`Payroll run for ${month}: ${fmtINR(totalPaid)} across ${salaries.length} staff.${manualCount>0 ? ' '+manualCount+' need manual bank transfer (no payout provider configured).' : ''}`);
  render();
}

async function generateDsaReferralCode(name){
  const existing = new Set((await db.getAll("dsaAgents")).map(d=>d.referralCode).filter(Boolean));
  const base = (name||"DSA").replace(/[^a-zA-Z]/g,"").toUpperCase().slice(0,4).padEnd(4,"X");
  let code;
  do{
    code = base + Math.floor(100+Math.random()*900);
  } while(existing.has(code));
  return code;
}

/** Maps this app's free-text expense/income categories onto the
 *  Chart of Accounts — anything not explicitly listed falls onto the
 *  catch-all "Other Operating Expenses" / "Other Income" account
 *  rather than failing to post. */
function glAccountForCategory(category, type){
  const expenseMap = {
    "Rent": "Rent", "Salaries": "Salaries & Staff Costs", "Interest on Borrowings": "Interest on Borrowings (Finance Cost)",
    "DSA Commission": "DSA Commission"
  };
  const incomeMap = { "Interest Income": "Interest Income", "Processing Fee Income": "Processing Fee Income" };
  if(type==="Expense") return expenseMap[category] || "Other Operating Expenses";
  return incomeMap[category] || "Other Income";
}

async function handleSaveJournalEntry(){

  if(!fundAccount){ toast("Select a fund account."); return; }
  if(type==="Expense" && amount > fundAccount.balance){ toast("Amount exceeds the selected account's balance."); return; }

  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const ownLimit = getJournalLimitForRole(policy, u.role);
  const withinOwnLimit = u.role==="Super Admin" || amount <= ownLimit;

  const entry = {
    id: uid("jnl"), type, category, date, amount, mode, description,
    fundAccountId, fundAccountName: fundAccount.name, createdAt: nowISO(), createdBy: u.name,
    proposedBy: u.name, proposedByRole: u.role,
    status: withinOwnLimit ? "Posted" : "Pending Approval",
    approvedBy: withinOwnLimit ? u.name : null, approvedAt: withinOwnLimit ? nowISO() : null
  };
  await db.put("journalEntries", entry);

  if(withinOwnLimit){
    fundAccount.balance += (type==="Income" ? amount : -amount);
    await db.put("fundAccounts", fundAccount);
    await logAudit(u.name, u.role, "Journal Entry Posted", `${type}: ${category} — ${fmtINR(amount)}${description?" — "+description:""}`);
    const glAccountName = glAccountForCategory(category, type);
    await postToGeneralLedger({
      date, voucherType: type==="Expense" ? "Payment Voucher" : "Receipt Voucher",
      narration: `${category}${description?" — "+description:""}`,
      lineDefs: type==="Expense"
        ? [{accountName: glAccountName, side:"debit", amount}, {accountName: glAccountForMode(mode), side:"credit", amount}]
        : [{accountName: glAccountForMode(mode), side:"debit", amount}, {accountName: glAccountName, side:"credit", amount}],
      actor: u.name, actorRole: u.role
    });
    toast("Entry recorded.");
  } else {
    await logAudit(u.name, u.role, "Journal Entry Proposed (Pending Approval)", `${type}: ${category} — ${fmtINR(amount)} exceeds your self-authorized limit of ${fmtINR(ownLimit)} — needs a different officer's approval`);

  }
  render();
}

async function handleApproveJournalEntry(entryId){
  const u = session.user;
  const entry = await db.get("journalEntries", entryId);
  if(!entry) return;
  if(entry.proposedBy === u.name){ toast("Maker-Checker: you cannot approve your own entry."); return; }
  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const limit = getJournalLimitForRole(policy, u.role);
  if(u.role!=="Super Admin" && limit < entry.amount){ toast("This amount exceeds your authorized limit."); return; }
  const fundAccount = await db.get("fundAccounts", entry.fundAccountId);
  if(!fundAccount){ toast("Fund account not found."); return; }
  if(entry.type==="Expense" && entry.amount > fundAccount.balance){ toast("Amount now exceeds the account's balance — cannot approve."); return; }

  entry.status = "Posted";
  entry.approvedBy = u.name;
  entry.approvedAt = nowISO();
  await db.put("journalEntries", entry);
  fundAccount.balance += (entry.type==="Income" ? entry.amount : -entry.amount);
  await db.put("fundAccounts", fundAccount);
  await logAudit(u.name, u.role, "Journal Entry Approved", `${entry.type}: ${entry.category} — ${fmtINR(entry.amount)} (Maker: ${entry.proposedBy})`);
  const glAccountName = glAccountForCategory(entry.category, entry.type);
  await postToGeneralLedger({
    date: entry.date, voucherType: entry.type==="Expense" ? "Payment Voucher" : "Receipt Voucher",
    narration: `${entry.category}${entry.description?" — "+entry.description:""}`,
    lineDefs: entry.type==="Expense"
      ? [{accountName: glAccountName, side:"debit", amount:entry.amount}, {accountName: glAccountForMode(entry.mode), side:"credit", amount:entry.amount}]
      : [{accountName: glAccountForMode(entry.mode), side:"debit", amount:entry.amount}, {accountName: glAccountName, side:"credit", amount:entry.amount}],
    actor: u.name, actorRole: u.role
  });
  toast("Entry approved and posted.");
  render();
}

async function handleDedupeCompliance(){
  const u = session.user;
  const items = await db.getAll("complianceItems");
  const groups = {};
  items.forEach(it=>{
    const key = it.category+"||"+it.item;
    groups[key] = groups[key] || [];
    groups[key].push(it);
  });
  const statusRank = {"Done":3, "In Progress":2, "Not Started":1, "Not Applicable":1};
  let removed = 0;
  for(const key in groups){
    const group = groups[key];
    if(group.length<=1) continue;
    // Keep whichever copy has the most progress (or has notes); ties broken by earliest created.
    group.sort((a,b)=>{
      const rankDiff = (statusRank[b.status]||0) - (statusRank[a.status]||0);
      if(rankDiff!==0) return rankDiff;
      const notesDiff = (b.notes?1:0) - (a.notes?1:0);
      if(notesDiff!==0) return notesDiff;
      return new Date(a.createdAt) - new Date(b.createdAt);
    });
    const keep = group[0];
    const toRemove = group.slice(1);
    for(const dupe of toRemove){
      await db.delete("complianceItems", dupe.id);
      removed++;
    }
  }
  await logAudit(u.name, u.role, "Compliance Duplicates Removed", `${removed} duplicate item(s) removed, keeping the most-progressed copy of each`);
  toast(removed>0 ? `Removed ${removed} duplicate(s).` : "No duplicates found.");
  render();
}

async function handleOcrDocument(){
  if(!customerDraft.docImageBase64){ toast("Upload an ID document scan first."); return; }
  toast("Reading document…");
  try{
    const base64Data = customerDraft.docImageBase64.split(",")[1];
    const mediaType = customerDraft.docImageBase64.match(/data:(.*?);base64/)[1];
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6", max_tokens: 300,
        messages: [{ role:"user", content:[
          { type:"image", source:{ type:"base64", media_type:mediaType, data:base64Data } },
          { type:"text", text:"This is an Indian ID document (Aadhaar or PAN card). Respond ONLY with JSON, no markdown, no preamble: {\"idType\":\"Aadhaar or PAN or Unknown\",\"aadhaar\":\"12 digit number or empty\",\"pan\":\"10 char PAN or empty\",\"name\":\"name on document or empty\"}" }
        ]}]
      })
    });
    const data = await response.json();
    const textOut = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    const parsed = JSON.parse(textOut.replace(/```json|```/g,"").trim());
    if(parsed.aadhaar) document.getElementById("c-aadhaar").value = parsed.aadhaar;
    if(parsed.pan) document.getElementById("c-pan").value = parsed.pan;
    if(parsed.name && !document.getElementById("c-name").value) document.getElementById("c-name").value = parsed.name;
    toast("Fields pre-filled from document — please verify before saving.");
  } catch(err){
    toast("Auto-read failed — this feature only works inside Claude.ai's artifact runtime. Enter the ID manually.");
  }
}

async function handleFullBackup(){
  const u = session.user;
  toast("Preparing backup…");
  const backup = { _meta: { exportedAt: nowISO(), exportedBy: u.name, app: "NBFC LMS" } };
  for(const c of ALL_COLLECTIONS){
    backup[c] = await db.getAll(c);
  }
  downloadJSON(`nbfc-lms-backup-${todayStr()}.json`, backup);
  await logAudit(u.name, u.role, "Full Backup Downloaded", `${ALL_COLLECTIONS.length} collections`);
  toast("Backup downloaded.");
}

async function handleRestoreBackup(){
  const u = session.user;
  const input = document.getElementById("restore-file-input");
  const file = input.files[0];
  if(!file) return;
  if(!window.confirm(`Restore from "${file.name}"? This will overwrite any existing records that share an ID with the backup. This cannot be undone. Continue?`)) return;

  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const backup = JSON.parse(reader.result);
      let totalRestored = 0;
      for(const c of ALL_COLLECTIONS){
        const records = backup[c];
        if(!Array.isArray(records)) continue;
        for(const rec of records){
          if(!rec || !rec.id) continue;
          await db.put(c, rec);
          totalRestored++;
        }
      }
      await logAudit(u.name, u.role, "Backup Restored", `${totalRestored} records from ${file.name}`);
      toast(`Restore complete — ${totalRestored} records written.`);
      render();
    } catch(err){
      toast("Restore failed — the file doesn't look like a valid backup JSON.");
    }
  };
  reader.readAsText(file);
}

async function handleImportCustomers(){
  const u = session.user;
  const fileInput = document.getElementById("import-customers-file-input");
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const rows = parseGenericCsv(reader.result);
      if(rows.length===0){ toast("No rows found — check the CSV has the expected header row."); return; }
      const existing = await db.getAll("customers");
      let created = 0, skipped = 0;
      for(const row of rows){
        const mobile = (row.Mobile||"").trim();
        if(!row.Name || !mobile){ skipped++; continue; }
        if(existing.some(c=>c.personal.mobile===mobile)){ skipped++; continue; } // avoid duplicate import on re-run
        const monthlyIncome = Number(row.MonthlyIncome)||null;
        const aadhaarRaw = row.Aadhaar||"", panRaw = (row.PAN||"").toUpperCase();
        const [aadhaarEnc, panEnc, aadhaarHash, panHash] = await Promise.all([
          encryptField(aadhaarRaw), encryptField(panRaw), hashField(aadhaarRaw), hashField(panRaw)
        ]);
        await db.put("customers", {
          id: uid("cus"),
          personal: { name: row.Name, dob: row.DOB||"", gender: row.Gender||"", maritalStatus: row.MaritalStatus||"", mobile, email:"" },
          family: { name:"", dependents:"" },
          address: { current: row.Address||"", permanent: row.Address||"" },
          business: { name: row.BusinessName||"", type: row.BusinessType||"", years:"" },
          income: { monthly: monthlyIncome, annual: monthlyIncome ? monthlyIncome*12 : null, monthlyExpenses:null, source: row.BusinessType||"" },
          bank: { name: row.BankName||"", account: row.BankAccount||"", ifsc: row.BankIFSC||"" },
          nominee: { name:"", relationship:"Spouse", mobile:"" },
          references: [],
          existingLoans:"", previousLoans:"", creditScore: Number(row.CreditScore)||null, riskCategory: row.RiskCategory||"Medium",
          kyc: { aadhaar: aadhaarRaw?aadhaarEnc:null, pan: panRaw?panEnc:null, aadhaarHash, panHash, otherIdType:"", otherIdNumber:"", photoBase64:null, docImageBase64:null, signatureBase64:null, gpsLat:null, gpsLng:null },
          duplicateFlag:false, duplicateReason:"", leadId:null, createdAt: nowISO(), createdBy: u.name+" (Bulk Import)"
        });
        created++;
      }
      await logAudit(u.name, u.role, "Customers Bulk Imported", `${created} created, ${skipped} skipped (missing data or already exists)`);
      toast(`Imported ${created} customer(s).${skipped>0 ? ' '+skipped+' skipped (missing name/mobile or already imported).' : ''}`);
      render();
    } catch(err){
      console.error(err);
      toast("Import failed — check the CSV format matches the template.");
    }
  };
  reader.readAsText(file);
}

async function handleImportLoanAccounts(){
  const u = session.user;
  const fileInput = document.getElementById("import-loans-file-input");
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const rows = parseGenericCsv(reader.result);
      if(rows.length===0){ toast("No rows found — check the CSV has the expected header row."); return; }
      const customers = await db.getAll("customers");
      const products = await db.getAll("products");
      const fundAccounts = await db.getAll("fundAccounts");
      let created = 0, skipped = 0;
      const skipReasons = [];
      for(const row of rows){
        const customer = customers.find(c=>c.personal.mobile===(row.CustomerMobile||"").trim());
        const product = products.find(p=>p.name===(row.Product||"").trim());
        const fundAccount = fundAccounts.find(f=>f.name===(row.FundAccountName||"").trim()) || fundAccounts[0];
        const principal = Number(row.Principal);
        if(!customer){ skipped++; skipReasons.push(`No customer with mobile ${row.CustomerMobile}`); continue; }
        if(!product){ skipped++; skipReasons.push(`No product named "${row.Product}"`); continue; }
        if(!principal || principal<=0){ skipped++; skipReasons.push(`Invalid principal for ${row.CustomerMobile}`); continue; }

        const loanAccount = {
          id: uid("loa"), sanctionId:null, customerId: customer.id, product: product.name,
          principal, interestRate: Number(row.InterestRate)||product.interestRate, tenureMonths: Number(row.TenureMonths)||product.tenureMax,
          emiFrequency: row.EmiFrequency || product.emiFrequency, disbursedDate: row.DisbursedDate, status:"Active",
          createdAt: nowISO(), createdBy: u.name+" (Bulk Import)", accountNumber: await generateLoanAccountNumber(),
          recoveryOfficer:null, recoveryStatus:null, migratedHistorical:true
        };
        const gen = generateEmiSchedule(loanAccount);
        loanAccount.schedule = gen.schedule; loanAccount.emiAmount = gen.emiAmount; loanAccount.totalInstallments = gen.totalInstallments;

        // Mark past installments Paid for reporting accuracy (NPA
        // classification, portfolio outstanding) WITHOUT moving any
        // money — those payments already happened in the old system,
        // and re-crediting them here would double-count against your
        // opening fund balance.
        const installmentsPaid = Math.min(Number(row.InstallmentsPaid)||0, loanAccount.schedule.length);
        for(let k=0; k<installmentsPaid; k++){
          const inst = loanAccount.schedule[k];
          inst.status = "Paid"; inst.paidAmount = inst.emiAmount; inst.paidDate = inst.dueDate;
        }
        loanAccount.principalOutstanding = loanAccount.schedule.filter(i=>i.status!=="Paid").reduce((s,i)=>s+i.principalComponent,0);
        await db.put("loanAccounts", loanAccount);

        // A historical disbursement record for audit-trail completeness —
        // also tagged as not affecting fund balances.
        await db.put("disbursements", {
          id: uid("dsb"), sanctionId:null, customerId: customer.id, amount: principal,
          mode:"Migrated — Historical", date: row.DisbursedDate, utr:"MIGRATED",
          fundAccountId: fundAccount?fundAccount.id:null, fundAccountName: fundAccount?fundAccount.name:"—",
          createdAt: nowISO(), createdBy: u.name+" (Bulk Import)", migratedHistorical:true
        });
        created++;
      }
      await logAudit(u.name, u.role, "Loan Accounts Bulk Imported", `${created} created, ${skipped} skipped`);
      toast(`Imported ${created} loan account(s).${skipped>0 ? ' '+skipped+' skipped — check console for reasons.' : ''}`);
      if(skipReasons.length>0) console.warn("Import skip reasons:", skipReasons);
      render();
    } catch(err){
      console.error(err);
      toast("Import failed — check the CSV format matches the template.");
    }
  };
  reader.readAsText(file);
}

async function handleFactoryReset(){
  const u = session.user;
  const totalRecords = {};
  let grandTotal = 0;
  for(const c of ALL_COLLECTIONS){ totalRecords[c] = (await db.getAll(c)).length; grandTotal += totalRecords[c]; }
  if(grandTotal===0){ toast("There's nothing to delete."); return; }

  if(!window.confirm(`⚠ BE CAREFUL — this will permanently erase ALL data: ${grandTotal} record(s) across every collection, including your own staff Firestore record. There is no undo, no recycle bin, and no way to recover it afterward. Note: this does not delete Firebase Auth accounts themselves (only Firestore data) — old logins will need a fresh Setup Admin run with a new username afterward. Have you downloaded a backup? Click OK only if you are certain.`)) return;
  const typed = window.prompt(`Last chance. Type DELETE EVERYTHING (exactly, in capitals) to permanently erase all data.`, "");
  if(typed !== "DELETE EVERYTHING"){ toast("Cancelled — nothing was deleted."); return; }

  // Log the reset before wiping the audit trail itself, so there's a
  // final record of who did this and when, for whatever it's worth.
  await logAudit(u.name, u.role, "FACTORY RESET", `${grandTotal} record(s) deleted across all collections — initiated by ${u.name}`);

  for(const c of ALL_COLLECTIONS){
    const records = await db.getAll(c);
    for(const rec of records){ await db.delete(c, rec.id); }
  }
  toast("Factory reset complete — this NBFC LMS is now empty. Signing you out.");
  session = {type:null, user:null};
  await firebase.auth().signOut();
  await firebase.auth().signInAnonymously();
  setRoute("landing");
}

async function handleAutoReadItr(customerId){
  const u = session.user;
  const cust = await db.get("customers", customerId);
  if(!cust || !cust.financialDocs?.itrDocBase64){ toast("Upload the ITR acknowledgment first."); return; }
  toast("Reading document…");
  try{
    const base64Data = cust.financialDocs.itrDocBase64.split(",")[1];
    const mediaType = cust.financialDocs.itrDocBase64.match(/data:(.*?);base64/)[1];
    if(mediaType==="application/pdf"){ toast("Auto-read currently supports image uploads (JPG/PNG) of the ITR, not PDF — take a photo/screenshot of the acknowledgment page instead."); return; }
    const result = await callAiChat([{ role:"user", content:[
      { type:"image", source:{ type:"base64", media_type:mediaType, data:base64Data } },
      { type:"text", text:"This is an Indian Income Tax Return (ITR) acknowledgment. Respond ONLY with JSON, no markdown, no preamble: {\"grossTotalIncome\": number in rupees or 0 if not found, \"assessmentYear\":\"string or empty\"}" }
    ]}], 300);
    if(!result.ok){ toast(result.error); return; }
    const parsed = JSON.parse(result.text.replace(/```json|```/g,"").trim());
    if(parsed.grossTotalIncome){
      cust.financialDocs.itrDeclaredIncome = parsed.grossTotalIncome;
      await db.put("customers", cust);
      await logAudit(u.name, u.role, "ITR Auto-Read", `${cust.personal.name} — Gross Total Income ${fmtINR(parsed.grossTotalIncome)}${parsed.assessmentYear?" (AY "+parsed.assessmentYear+")":""}`);
      toast("ITR income extracted — please verify against the document before relying on it.");
      render();
    } else {
      toast("Couldn't find an income figure on that document — enter it manually if needed.");
    }
  } catch(err){
    toast("Auto-read failed — this feature needs an AI provider (Claude.ai runtime, or a vision-capable proxy under Integrations).");
  }
}

function initSignaturePad(){
  const canvas = document.getElementById("sig-pad");
  if(!canvas) return;
  sigPadCtx = canvas.getContext("2d");
  sigPadCtx.strokeStyle = "#182238";
  sigPadCtx.lineWidth = 1.6;
  sigPadCtx.lineCap = "round";
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x:cx, y:cy};
  }
  function start(e){ sigDrawing=true; sigLast=pos(e); e.preventDefault(); }
  function move(e){
    if(!sigDrawing) return;
    const p = pos(e);
    sigPadCtx.beginPath(); sigPadCtx.moveTo(sigLast.x, sigLast.y); sigPadCtx.lineTo(p.x,p.y); sigPadCtx.stroke();
    sigLast = p; e.preventDefault();
  }
  function end(){ sigDrawing=false; }
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}

  let cred = null;
  try{
    cred = await firebase.auth().createUserWithEmailAndPassword(borrowerAuthEmail(mobile), password);
    // Force the ID token to refresh before writing to Firestore — right
    // after account creation there's a brief window where the SDK's
    // internal auth state hasn't fully settled, which can make the very
    // next Firestore write get evaluated as if it were still the old
    // (anonymous) session, failing the security rule that requires
    // writing your own record.
    await cred.user.getIdToken(true);
  } catch(err){
    console.error(err);
    toast(friendlyAuthError(err));
    return;
  }
  try{
    const rec = { id: cred.user.uid, name, mobile, location, createdAt: nowISO() };

    await logAudit(name, "Borrower", "Login", "");
    toast("Account created. Welcome, "+name+".");
    render();
  } catch(err){
    console.error(err);
    // The Auth account exists but the database record didn't save —
    // roll back the Auth account too, rather than leaving a stuck,
    // invisible account behind that blocks this mobile number forever.
    try{ await cred.user.delete(); } catch(cleanupErr){ console.error("Rollback also failed:", cleanupErr); }
    toast("Something went wrong saving your details — please try registering again. (If this keeps happening, contact your branch.)");
  }
}

async function handleSaveJournalVoucher(){
  const u = session.user;
  const voucherType = document.getElementById("gl-voucher-type").value;
  const date = document.getElementById("gl-voucher-date").value;
  const narration = document.getElementById("gl-voucher-narration").value.trim();
  if(!date || !narration){ toast("Enter a date and narration."); return; }

  const accounts = await db.getAll("chartOfAccounts");
  const lines = [];
  document.querySelectorAll(".gl-line-account").forEach(sel=>{
    const idx = sel.dataset.idx;
    const accountId = sel.value;
    const debit = Number(document.querySelector(`.gl-line-debit[data-idx="${idx}"]`).value)||0;
    const credit = Number(document.querySelector(`.gl-line-credit[data-idx="${idx}"]`).value)||0;
    const lineNarration = document.querySelector(`.gl-line-narration[data-idx="${idx}"]`).value.trim();
    if(debit===0 && credit===0) return;
    if(debit>0 && credit>0){ toast("A single line can't have both a debit and a credit — use two lines instead."); throw new Error("invalid line"); }
    const account = accounts.find(a=>a.id===accountId);
    lines.push({ ledgerAccountId: accountId, ledgerAccountName: account?account.name:"Unknown", debit, credit, lineNarration });
  });

  if(lines.length<2){ toast("A voucher needs at least two lines."); return; }
  const totalDebit = lines.reduce((s,l)=>s+l.debit,0);
  const totalCredit = lines.reduce((s,l)=>s+l.credit,0);
  if(Math.round(totalDebit*100) !== Math.round(totalCredit*100)){
    toast(`Debits (${fmtINR(totalDebit)}) and credits (${fmtINR(totalCredit)}) must be exactly equal before this can save.`);
    return;
  }
  if(totalDebit===0){ toast("Enter at least one amount."); return; }

  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const ownLimit = getJournalLimitForRole(policy, u.role);
  const withinOwnLimit = u.role==="Super Admin" || totalDebit <= ownLimit;
  const voucherNumber = await getNextVoucherNumber(voucherType);

  const voucher = {
    id: uid("jv"), voucherNumber, voucherType, date, narration, lines,
    totalDebit: Math.round(totalDebit*100)/100, totalCredit: Math.round(totalCredit*100)/100,
    status: withinOwnLimit ? "Posted" : "Pending Approval",
    proposedBy: u.name, proposedByRole: u.role,
    approvedBy: withinOwnLimit ? u.name : null, approvedAt: withinOwnLimit ? nowISO() : null,
    createdAt: nowISO(), createdBy: u.name
  };
  await db.put("journalVouchers", voucher);
  await logAudit(u.name, u.role, withinOwnLimit ? "GL Voucher Posted" : "GL Voucher Proposed", `${voucherNumber} — ${narration} — ${fmtINR(totalDebit)}`);
  toast(withinOwnLimit ? `Voucher ${voucherNumber} posted.` : `Voucher ${voucherNumber} saved — awaiting approval (exceeds your own limit).`);
  session.glVoucherLineCount = 2;
  render();
}

async function handleAddStaff(){
  const name = document.getElementById("nu-name").value.trim();
  const username = document.getElementById("nu-username").value.trim();
  const password = document.getElementById("nu-password").value;
  const role = document.getElementById("nu-role").value;
  const branch = document.getElementById("nu-branch").value.trim();
  if(!name || !username || !password){ toast("Please fill in name, username, and password."); return; }
  if(password.length<6){ toast("Password must be at least 6 characters."); return; }
  const existing = (await db.getAll("staff")).find(s=>s.username===username);
  if(existing){ toast("That username is already taken."); return; }
  toast("Creating account…");
  // Firebase's client SDK signs in as whoever createUserWithEmailAndPassword
  // just created — on the PRIMARY app that would silently log the current
  // Super Admin out mid-session. A throwaway secondary app instance keeps
  // the new account creation isolated from the admin's own session.
  const secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, "Secondary-"+Date.now());
  let cred = null;
  try{
    cred = await secondaryApp.auth().createUserWithEmailAndPassword(staffAuthEmail(username), password);
  } catch(err){
    console.error(err);
    toast(friendlyAuthError(err));
    await secondaryApp.delete();
    return;
  }
  try{
    const rec = { id: cred.user.uid, name, username, role, branch, createdAt: nowISO(), createdBy: session.user.name };
    await db.put("staff", rec);
    await secondaryApp.auth().signOut();
    await logAudit(session.user.name, session.user.role, "Staff User Created", `${name} (${role}) — maker: ${session.user.name}`);
    toast("User created: "+name);
    render();
  } catch(err){
    console.error(err);
    // The Auth account exists but the database record didn't save —
    // roll back the Auth account too (must do this before signing out
    // of the secondary instance, since deleting requires being signed
    // in as that user), rather than leaving a stuck, invisible account.
    try{ await cred.user.delete(); } catch(cleanupErr){ console.error("Rollback also failed:", cleanupErr); }
    toast("Something went wrong saving this user — please try again.");
  } finally {
    await secondaryApp.delete();
  }
}

async function handleRemoveStaff(staffId){
  const u = session.user;
  if(u.role!=="Super Admin"){ toast("Only Super Admin can remove staff."); return; }
  const target = await db.get("staff", staffId);
  if(!target) return;

  // Hard safeguard: never allow the last remaining Super Admin to be
  // removed through the app — that would permanently lock everyone out,
  // since the one-time bootstrap window for creating a fresh Super Admin
  // closes forever after the first one and does not reopen.
  if(target.role==="Super Admin"){
    const allStaff = await db.getAll("staff");
    const superAdminCount = allStaff.filter(s=>s.role==="Super Admin").length;
    if(superAdminCount<=1){
      toast("Can't remove the only Super Admin — create another Super Admin account first, confirm they can log in, then remove this one.");
      return;
    }
  }

  const removingSelf = staffId === u.id;
  const confirmMsg = removingSelf
    ? `This removes YOUR OWN staff access and signs you out immediately. Are you sure?`
    : `Remove ${target.name} (${target.role})? This deletes their access immediately. Their Firebase Auth login itself isn't deleted (see Security Migration notes) — they'll simply have zero access if they try to sign in again.`;
  if(!window.confirm(confirmMsg)) return;

  await logAudit(u.name, u.role, "Staff User Removed", `${target.name} (${target.role}) — removed by ${u.name}`);
  await db.delete("staff", staffId);

  if(removingSelf){
    toast("Your access has been removed. Signing you out.");
    session = {type:null, user:null};
    await firebase.auth().signOut();
    await firebase.auth().signInAnonymously();
    setRoute("landing");
  } else {
    toast(`${target.name} removed.`);
    render();
  }
}
