/* =========================================================================
   Lightweight SVG charts — deliberately not using Chart.js or any other
   external library. This is a production financial app; a broken CDN
   link shouldn't be able to blank out a dashboard. SVG also renders as
   a plain string, fitting the same template-string pattern as
   everything else here, with no post-render canvas setup needed.
   ========================================================================= */
function svgBarChart(data, opts={}){
  const w = opts.width||480, h = opts.height||220, padL=48, padB=32, padT=14, padR=14;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const maxVal = Math.max(1, ...data.map(d=>d.value));
  const barW = plotW/data.length*0.62;
  const gap = plotW/data.length;
  const color = opts.color || "#0E1A30";
  const bars = data.map((d,i)=>{
    const barH = (d.value/maxVal)*plotH;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + plotH - barH;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${d.color||color}" rx="2"></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(padT+plotH+16).toFixed(1)}" font-size="10" text-anchor="middle" fill="#5C6579">${esc(d.label)}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="10" text-anchor="middle" fill="#0E1A30">${d.valueLabel||d.value}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; max-width:${w}px;">
    <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" stroke="#E3DFD6"/>
    ${bars}
  </svg>`;
}

function svgLineChart(series, opts={}){
  const w = opts.width||480, h = opts.height||220, padL=48, padB=32, padT=14, padR=14;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const allVals = series.flatMap(s=>s.points.map(p=>p.value));
  const maxVal = Math.max(1, ...allVals);
  const minVal = Math.min(0, ...allVals);
  const range = maxVal-minVal || 1;
  const n = series[0].points.length;
  const stepX = n>1 ? plotW/(n-1) : 0;
  const colors = ["#B08A2E","#0E1A30","#4E7A5A","#A5323B"];
  const linesAndLabels = series.map((s,si)=>{
    const pts = s.points.map((p,i)=>{
      const x = padL + i*stepX;
      const y = padT + plotH - ((p.value-minVal)/range)*plotH;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    const color = s.color || colors[si%colors.length];
    const dots = s.points.map((p,i)=>{
      const x = padL + i*stepX;
      const y = padT + plotH - ((p.value-minVal)/range)*plotH;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${color}"></circle>`;
    }).join("");
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"></polyline>${dots}`;
  }).join("");
  const xLabels = series[0].points.map((p,i)=>{
    const x = padL + i*stepX;
    return `<text x="${x.toFixed(1)}" y="${(padT+plotH+16).toFixed(1)}" font-size="10" text-anchor="middle" fill="#5C6579">${esc(p.label)}</text>`;
  }).join("");
  const legend = series.length>1 ? series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;"><span style="width:10px;height:10px;border-radius:2px;background:${s.color||colors[si%colors.length]};display:inline-block;"></span>${esc(s.name)}</span>`).join("") : "";
  return `${legend ? `<div class="small muted" style="margin-bottom:6px;">${legend}</div>` : ""}
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; max-width:${w}px;">
    <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" stroke="#E3DFD6"/>
    ${linesAndLabels}
    ${xLabels}
  </svg>`;
}

function svgPieChart(data, opts={}){
  const size = opts.size||200, r = size/2-8, cx=size/2, cy=size/2;
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const colors = ["#B08A2E","#0E1A30","#4E7A5A","#A5323B","#6B5CA5","#3D8B96","#C77B3E"];
  let angleStart = -90;
  const slices = data.map((d,i)=>{
    const angleSpan = (d.value/total)*360;
    const angleEnd = angleStart+angleSpan;
    const largeArc = angleSpan>180 ? 1 : 0;
    const toXY = (deg)=>{ const rad=deg*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; };
    const [x1,y1] = toXY(angleStart), [x2,y2] = toXY(angleEnd);
    const path = total>0 && d.value>0 ? `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z` : "";
    angleStart = angleEnd;
    return { path, color: d.color||colors[i%colors.length] };
  });
  const legend = data.map((d,i)=>`<div style="display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:3px;"><span style="width:10px;height:10px;border-radius:2px;background:${d.color||colors[i%colors.length]};display:inline-block;"></span>${esc(d.label)} — ${d.valueLabel||d.value}</div>`).join("");
  return `<div style="display:flex; gap:18px; align-items:center; flex-wrap:wrap;">
    <svg viewBox="0 0 ${size} ${size}" style="width:${size}px; height:${size}px; flex-shrink:0;">
      ${slices.map(s=>s.path?`<path d="${s.path}" fill="${s.color}"></path>`:"").join("")}
    </svg>
    <div>${legend}</div>
  </div>`;
}

function daysSince(dateStr){
  return Math.max(0, Math.round((new Date() - new Date(dateStr)) / (1000*60*60*24)));
}
/** Colour-coded ageing badge — green under 2 days, amber 3-5, red
 *  beyond that. These thresholds are a reasonable starting TAT
 *  expectation, not a regulatory standard; adjust to your own SLA. */
function ageingBadge(days){
  const cls = days<=2 ? "badge-approved" : days<=5 ? "badge-progress" : "badge-rejected";
  return `<span class="badge ${cls}">${days}d</span>`;
}

/** Loosely matches a pending item's type label against the free-text
 *  Escalation Matrix rules (e.g. "Sanction Approval" matching a queue
 *  item labeled "Sanction") — a simple substring match rather than a
 *  rigid dropdown, so the matrix stays easy to configure in plain
 *  language while still actually doing something with it. */
function findEscalationRule(itemTypeLabel, rules){
  const label = itemTypeLabel.toLowerCase();
  return rules.find(r=> label.includes(r.itemType.toLowerCase()) || r.itemType.toLowerCase().includes(label));
}

async function renderMyQueueTab(){
  const u = session.user;
  const [leads, appraisals, sanctions, journalEntries, glVouchers, policy, escalationRules, loanAccounts] = await Promise.all([
    db.getAll("leads"), db.getAll("appraisals"), db.getAll("sanctions"),
    db.getAll("journalEntries"), db.getAll("journalVouchers"), db.get("policyConfig","default"),
    db.getAll("escalationRules"), db.getAll("loanAccounts")
  ]);
  const pol = policy || defaultPolicyConfig();
  const openLeadStatuses = ["New","Contacted","Documents Pending","KYC Pending","Under Verification","Eligible"];
  const openLeads = leads.filter(l=>openLeadStatuses.includes(l.status))
    .map(l=>({...l, ageDays: daysSince(l.createdAt)})).sort((a,b)=>b.ageDays-a.ageDays);

  const appraisedLeadIds = new Set(appraisals.map(a=>a.leadId));
  const pendingAppraisal = leads.filter(l=>l.status==="Converted into Loan Application" && !appraisedLeadIds.has(l.id))
    .map(l=>({...l, ageDays: daysSince(l.createdAt)})).sort((a,b)=>b.ageDays-a.ageDays);

  const canApproveRole = (role)=> DELEGATION_ROLES.includes(role) || role==="Super Admin";
  const myPendingSanctions = sanctions.filter(s=>s.status==="Pending Approval" && s.proposedBy!==u.name && canApproveRole(u.role))
    .map(s=>({...s, ageDays: daysSince(s.createdAt)})).sort((a,b)=>b.ageDays-a.ageDays);
  const myPendingJournalEntries = journalEntries.filter(j=>j.status==="Pending Approval" && j.proposedBy!==u.name &&
    (u.role==="Super Admin" || getJournalLimitForRole(pol, u.role)>=j.amount))
    .map(j=>({...j, ageDays: daysSince(j.createdAt)})).sort((a,b)=>b.ageDays-a.ageDays);
  const myPendingVouchers = glVouchers.filter(v=>v.status==="Pending Approval" && v.proposedBy!==u.name &&
    (u.role==="Super Admin" || getJournalLimitForRole(pol, u.role)>=v.totalDebit))
    .map(v=>({...v, ageDays: daysSince(v.createdAt)})).sort((a,b)=>b.ageDays-a.ageDays);

  const totalPending = openLeads.length + pendingAppraisal.length + myPendingSanctions.length + myPendingJournalEntries.length + myPendingVouchers.length;

  // SLA-breach escalation: check EVERY pending item (regardless of who'd
  // normally approve it) against the Escalation Matrix, and surface
  // anything that's breached its threshold AND escalates to YOUR role
  // specifically — this is what makes the matrix an actual working
  // feature rather than just a reference table.
  const allPendingForEscalation = [
    ...leads.filter(l=>openLeadStatuses.includes(l.status)).map(l=>({label:"Lead", detail:l.applicantName, ageDays: daysSince(l.createdAt), tab:"leads"})),
    ...sanctions.filter(s=>s.status==="Pending Approval").map(s=>({label:"Sanction Approval", detail:`${s.product} — ${fmtINR(s.sanctionedAmount)}`, ageDays: daysSince(s.createdAt), tab:"sanction"})),
    ...journalEntries.filter(j=>j.status==="Pending Approval").map(j=>({label:"Journal Entry Approval", detail:`${j.category} — ${fmtINR(j.amount)}`, ageDays: daysSince(j.createdAt), tab:"accounting"})),
    ...glVouchers.filter(v=>v.status==="Pending Approval").map(v=>({label:"GL Voucher Approval", detail:v.narration, ageDays: daysSince(v.createdAt), tab:"generalledger"})),
  ];
  const escalatedToMe = allPendingForEscalation.map(item=>{
    const rule = findEscalationRule(item.label, escalationRules);
    return rule && item.ageDays > rule.days && rule.toRole===u.role ? {...item, rule} : null;
  }).filter(Boolean).sort((a,b)=>b.ageDays-a.ageDays);

  // TAT — average turnaround, stage to stage, across loans that made it
  // all the way to disbursement (a clean start-to-finish measure).
  const tatSamples = [];
  loanAccounts.forEach(acc=>{
    const sanction = sanctions.find(s=>s.loanAccountId===acc.id);
    if(!sanction) return;
    const appraisal = appraisals.find(a=>a.id===sanction.appraisalId);
    const lead = leads.find(l=>l.id===sanction.leadId);
    if(!lead || !appraisal) return;
    tatSamples.push({
      leadToAppraisal: (new Date(appraisal.createdAt)-new Date(lead.createdAt))/(1000*60*60*24),
      appraisalToSanction: (new Date(sanction.createdAt)-new Date(appraisal.createdAt))/(1000*60*60*24),
      sanctionToDisbursement: (new Date(acc.createdAt)-new Date(sanction.createdAt))/(1000*60*60*24),
      leadToDisbursement: (new Date(acc.createdAt)-new Date(lead.createdAt))/(1000*60*60*24),
    });
  });
  const avg = (key)=> tatSamples.length>0 ? (tatSamples.reduce((s,t)=>s+Math.max(0,t[key]),0)/tatSamples.length) : null;

  return `
    <div class="card">
      <h2>My Queue</h2>
      <p class="sub">Everything currently needing action, aggregated in one place, oldest first. Ageing is calculated from when each item was created — not from when it entered its current specific status — so treat it as a reasonable proxy, not an exact SLA clock. ${totalPending} item(s) total right now.</p>
    </div>

    ${escalatedToMe.length>0 ? `
    <div class="card" style="border:1px solid var(--danger); background:#FBE7E8;">
      <h2 style="font-size:16px;">Escalated To You <span class="badge badge-rejected">${escalatedToMe.length}</span></h2>
      <p class="sub">These have breached the SLA in your Escalation Matrix and now need your attention specifically, regardless of who'd normally handle them.</p>
      <table>
        <thead><tr><th>Item</th><th>Detail</th><th>Age</th><th>SLA</th><th></th></tr></thead>
        <tbody>
        ${escalatedToMe.map(e=>`<tr><td>${esc(e.label)}</td><td>${esc(e.detail)}</td><td>${ageingBadge(e.ageDays)}</td><td>${e.rule.days}d → ${esc(e.rule.toRole)}</td><td><button class="btn btn-outline btn-sm queue-goto-btn" data-tab="${e.tab}">Go</button></td></tr>`).join("")}
        </tbody>
      </table>
    </div>` : ""}

    <div class="card">
      <h2 style="font-size:16px;">Turnaround Time (Average, Days)</h2>
      <p class="sub">Across loans that reached disbursement — ${tatSamples.length} sample(s).</p>
      <div class="grid grid-4">
        <div class="kpi"><div class="lbl">Lead → Appraisal</div><div class="val" style="font-size:18px;">${avg('leadToAppraisal')!==null?avg('leadToAppraisal').toFixed(1):'—'}</div></div>
        <div class="kpi"><div class="lbl">Appraisal → Sanction</div><div class="val" style="font-size:18px;">${avg('appraisalToSanction')!==null?avg('appraisalToSanction').toFixed(1):'—'}</div></div>
        <div class="kpi"><div class="lbl">Sanction → Disbursement</div><div class="val" style="font-size:18px;">${avg('sanctionToDisbursement')!==null?avg('sanctionToDisbursement').toFixed(1):'—'}</div></div>
        <div class="kpi"><div class="lbl">End-to-End (Lead → Disbursement)</div><div class="val" style="font-size:18px;">${avg('leadToDisbursement')!==null?avg('leadToDisbursement').toFixed(1):'—'}</div></div>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:16px;">Open Leads Needing Action <span class="badge badge-progress">${openLeads.length}</span></h2>
      <table>
        <thead><tr><th>Applicant</th><th>Product</th><th>Status</th><th>Age</th><th></th></tr></thead>

async function renderManagementDashboard(leads, borrowers, customers, staffCount, appraisals, sanctions, loanAccounts, payments){
  const fundPos = await computeFundPosition();
  const emiPos = await computeEmiPosition(loanAccounts, payments);
  const riskPos = await computePortfolioRisk(loanAccounts, payments);
  const todayD = new Date().toDateString();
  const sanctionedToday = sanctions.filter(s=>s.status==="Approved" && new Date(s.approvedAt).toDateString()===todayD).length;
  const disbursedToday = loanAccounts.filter(a=>new Date(a.disbursedDate).toDateString()===todayD).length;
  const totalPortfolio = loanAccounts.reduce((s,a)=>s+a.principal,0);
  const kpis = [
    {lbl:"Total Loan Portfolio", val: fmtINR(totalPortfolio)},
    {lbl:"Available Funds", val: fmtINR(fundPos.available)},
    {lbl:"Number of Customers (KYC'd)", val: customers.length},
    {lbl:"New Applications", val: leads.filter(l=>l.status==="New").length},
    {lbl:"Loans Sanctioned Today", val: sanctionedToday},
    {lbl:"Loans Disbursed Today", val: disbursedToday},
    {lbl:"EMI Due Today", val: fmtINR(emiPos.emiDueTodayAmount)},
    {lbl:"Collections Today", val: fmtINR(emiPos.collectionsToday)},
    {lbl:"Overdue Amount", val: fmtINR(emiPos.overdueAmount)},
    {lbl:"NPA Amount", val: fmtINR(riskPos.npaAmount)},
    {lbl:"Portfolio at Risk (PAR)", val: riskPos.par.toFixed(1)+"%"},
    {lbl:"Collection Efficiency", val: riskPos.collectionEfficiency.toFixed(1)+"%"},
  ];
  const overdueReturns = ["Super Admin","Managing Director"].includes(session.user.role) ? await computeOverdueRbiReturns() : [];

  // --- Chart data ---
  const parByClass = {};
  PROVISION_CLASSES.forEach(c=>parByClass[c]=0);
  riskPos.analyzed.forEach(a=>{ parByClass[a.classification] = (parByClass[a.classification]||0) + a.acc.principalOutstanding; });
  const parChartData = PROVISION_CLASSES.map((c,i)=>({
    label: c.replace(/ \(.*\)/,"").replace(" Assets","").replace(" NPA",""),
    value: Math.round(parByClass[c]/1000), valueLabel: fmtINR(parByClass[c]),
    color: i===0?"#4E7A5A":i<=2?"#B08A2E":i===3?"#D98C3F":"#A5323B"
  }));

  const portfolioByProduct = {};
  loanAccounts.filter(a=>a.status==="Active").forEach(a=>{ portfolioByProduct[a.product] = (portfolioByProduct[a.product]||0) + a.principalOutstanding; });
  const productChartData = Object.entries(portfolioByProduct).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({ label, value, valueLabel: fmtINR(value) }));

  const monthsBack = 6;
  const monthKeys = [];
  const now = new Date();
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    monthKeys.push(d.toISOString().slice(0,7));
  }
  const monthLabel = (ym)=>{ const [y,m]=ym.split("-"); return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'short'}); };
  const disbursementTrend = monthKeys.map(ym=>({
    label: monthLabel(ym),
    value: Math.round(loanAccounts.filter(a=>(a.disbursedDate||"").slice(0,7)===ym).reduce((s,a)=>s+a.principal,0)/1000)
  }));
  disbursementTrend.forEach(d=> d.valueLabel = fmtINR(d.value*1000));

  const collectionEfficiencyTrend = monthKeys.map(ym=>{
    let demand=0;
    loanAccounts.forEach(a=>(a.schedule||[]).forEach(inst=>{ if((inst.dueDate||"").slice(0,7)===ym) demand += inst.emiAmount; }));
    const collected = payments.filter(p=>(p.createdAt||"").slice(0,7)===ym).reduce((s,p)=>s+p.amount,0);
    return { label: monthLabel(ym), value: demand>0 ? Math.round((collected/demand)*1000)/10 : 0 };
  });

  return `
    ${overdueReturns.length>0 ? `
    <div class="card" style="border:1px solid var(--danger); background:#FBE7E8;">
      <div class="flex-between">
        <div>
          <h3 style="color:#7A1F27; margin:0;">⚠ ${overdueReturns.length} RBI return(s) overdue</h3>
          <p class="small" style="color:#7A1F27; margin:6px 0 0;">${overdueReturns.map(f=>`${esc(f.code)} (${esc(f.period)}, due ${esc(f.dueDate)})`).join(" · ")}</p>
        </div>
        <button class="btn btn-danger btn-sm" id="btn-goto-rbi-returns">Go to RBI Returns</button>
      </div>
    </div>` : ""}
    <div class="card">
      <h2>Management Dashboard</h2>
      <p class="sub">Live where data exists today. Metrics tagged with a phase will populate as that module is built.</p>
      <div class="grid grid-4">
        ${kpis.map(k=>`
          <div class="kpi">
            <div class="lbl">${k.lbl}</div>
            <div class="val ${k.val===null?'dim':''}">${k.val===null? (k.note||"—") : k.val}</div>
          </div>`).join("")}
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:16px;">Disbursement Trend <span class="small muted">(last 6 months, ₹ thousands)</span></h2>
      ${disbursementTrend.every(d=>d.value===0) ? `<p class="small muted">No disbursements recorded in this window yet.</p>` : svgBarChart(disbursementTrend, {color:"#B08A2E"})}
    </div>

    <div class="card">
      <h2 style="font-size:16px;">Collection Efficiency Trend <span class="small muted">(last 6 months, %)</span></h2>
      ${collectionEfficiencyTrend.every(d=>d.value===0) ? `<p class="small muted">No EMI demand recorded in this window yet.</p>` : svgLineChart([{name:"Collection Efficiency %", points: collectionEfficiencyTrend}])}
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h2 style="font-size:16px;">Portfolio at Risk by Classification <span class="small muted">(₹ thousands)</span></h2>
        ${parChartData.every(d=>d.value===0) ? `<p class="small muted">No active portfolio yet.</p>` : svgBarChart(parChartData, {width:420})}
      </div>
      <div class="card">
        <h2 style="font-size:16px;">Product-wise Portfolio</h2>
        ${productChartData.length===0 ? `<p class="small muted">No active loans yet.</p>` : svgPieChart(productChartData, {size:180})}
      </div>
    </div>
    <div class="card">
      <div class="flex-between"><h2 style="font-size:16px;">Recent Applications</h2></div>
      <table>
        <thead><tr><th>Applicant</th><th>Product</th><th>Amount</th><th>Source</th><th>Status</th><th>Applied</th></tr></thead>
        <tbody>
        ${leads.length===0 ? `<tr class="empty-row"><td colspan="6">No applications yet — they'll appear here as borrowers apply.</td></tr>` :
          leads.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,6).map(l=>`
          <tr>
            <td>${esc(l.applicantName)}</td><td>${esc(l.product)}</td><td>${fmtINR(l.amountRequested)}</td>
            <td>${esc(l.source)}</td><td>${statusBadge(l.status)}</td><td>${fmtDate(l.createdAt)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function statusBadge(status){
  let cls = "badge-new";
  if(["Under Verification","Documents Pending","KYC Pending","Contacted"].includes(status)) cls="badge-progress";
  if(status==="Eligible"||status==="Converted into Loan Application") cls="badge-approved";
  if(status==="Rejected") cls="badge-rejected";
  return `<span class="badge ${cls}">${esc(status)}</span>`;
}

async function renderCustomerForm(){
  const editing = session.editingCustomer || null;

  const decryptedPan = editing ? await decryptField(editing.kyc.pan) : "";
  // Reads from the customer being edited first, falls back to lead
  // prefill for a brand-new customer, else blank. Aadhaar/PAN are
  // special-cased since they're encrypted at rest and need decrypting
  // before they're safe to drop into a plain input value.
  const ev = (path, prefillKey)=>{

    if(path==="kyc.pan") return decryptedPan;

      const parts = path.split(".");
      let v = editing;

      return p(v);

}

async function renderCustomerDetail(c){
  if(!c) return `<div class="card">Customer not found.</div>`;
  const cfg = await getApiConfig();
  const [allLoanAccounts, allSanctions, decryptedAadhaar, decryptedPan] = await Promise.all([
    db.getAll("loanAccounts"), db.getAll("sanctions"), decryptField(c.kyc.aadhaar), decryptField(c.kyc.pan)
  ]);
  const custLoans = allLoanAccounts.filter(a=>a.customerId===c.id);
  const custSanctions = allSanctions.filter(s=>s.customerId===c.id && s.status==="Approved" && !s.disbursementId);
  const activeLoans = custLoans.filter(a=>a.status==="Active");
  const totalOutstanding = activeLoans.reduce((s,a)=>s+a.principalOutstanding,0);
  const verifyRow = (key, label, resultField)=>{
    const result = c.kyc[resultField];
    const enabled = cfg[key+"Enabled"];
    return `<tr>
      <td>${label}</td>
      <td>${result ? `<span class="badge ${result.status==='Verified'?'badge-approved':result.status==='Failed'?'badge-rejected':'badge-progress'}">${esc(result.status)}</span>` : `<span class="badge badge-new">Not Checked</span>`}</td>
      <td>${result ? fmtDate(result.checkedAt)+" by "+esc(result.checkedBy) : "—"}</td>
      <td><button class="btn btn-outline btn-sm run-verify-btn" data-customer="${c.id}" data-service="${key}" data-field="${resultField}" ${enabled?'':'disabled'}>${enabled?'Run Check':'Not Configured'}</button></td>
    </tr>`;
  };
  return `
    <div class="card">
      <div class="flex-between">
        <h2>${esc(c.personal.name)}</h2>
        <div class="action-row">
          <button class="btn btn-gold btn-sm" id="btn-edit-customer" data-customer="${c.id}">Edit</button>
          <button class="btn btn-outline btn-sm" id="btn-back-to-customers">← Back to list</button>
        </div>
      </div>
      ${c.duplicateFlag ? `<div class="warn-banner">⚠ ${esc(c.duplicateReason)}</div>` : ""}
      ${custLoans.length>0 || custSanctions.length>0 ? `
      <h3 class="section-h">Existing Loan Accounts With Us</h3>
      <div class="grid grid-3">
        <div class="kpi"><div class="lbl">Active Accounts</div><div class="val" style="font-size:18px;">${activeLoans.length}</div></div>
        <div class="kpi"><div class="lbl">Total Outstanding</div><div class="val" style="font-size:18px;">${fmtINR(totalOutstanding)}</div></div>
        <div class="kpi"><div class="lbl">Approved, Not Yet Disbursed</div><div class="val" style="font-size:18px;">${custSanctions.length}</div></div>
      </div>
      ${custLoans.length>0 ? `
      <table>
        <thead><tr><th>Account No.</th><th>Product</th><th>Principal</th><th>Outstanding</th><th>Status</th></tr></thead>
        <tbody>
        ${custLoans.map(a=>`<tr><td class="mono">${esc(a.accountNumber)||a.id}</td><td>${esc(a.product)}</td><td>${fmtINR(a.principal)}</td><td>${fmtINR(a.principalOutstanding)}</td><td>${a.status==='Active'?`<span class="badge badge-approved">Active</span>`:`<span class="badge badge-new">${esc(a.status)}</span>`}</td></tr>`).join("")}
        </tbody>
      </table>` : ""}
      ${custSanctions.length>0 ? `<p class="small muted" style="margin-top:8px;">Plus ${custSanctions.length} sanction(s) approved but not yet disbursed — check Sanction &amp; Disbursement.</p>` : ""}
      ` : `<p class="small muted">No loan accounts with us yet for this customer.</p>`}
      <div class="grid grid-3" style="margin-top:10px;">
        <div><div class="field"><label>Mobile</label><div class="mono">${esc(c.personal.mobile)||"—"}</div></div></div>
        <div><div class="field"><label>DOB</label><div>${esc(c.personal.dob)||"—"}</div></div></div>
        <div><div class="field"><label>Gender / Marital</label><div>${esc(c.personal.gender)||"—"} / ${esc(c.personal.maritalStatus)||"—"}</div></div></div>
        <div><div class="field"><label>Risk Category</label><div>${c.riskCategory?`<span class="badge badge-risk-${c.riskCategory}">${c.riskCategory}</span>`:"—"}</div></div></div>
        <div><div class="field"><label>Credit Score</label><div>${c.creditScore||"—"}</div></div></div>
        <div><div class="field"><label>Monthly Income</label><div>${fmtINR(c.income.monthly)}</div></div></div>
        <div><div class="field"><label>Monthly Expenses</label><div>${fmtINR(c.income.monthlyExpenses)}</div></div></div>
        <div><div class="field"><label>Annual Income</label><div>${fmtINR(c.income.annual)}</div></div></div>
      </div>
      <h3 class="section-h">Business</h3>
      <p>${esc(c.business.name)||"—"} · ${esc(c.business.type)||"—"} · ${c.business.years||"—"} yrs</p>
      <h3 class="section-h">Address</h3>
      <p><b>Current:</b> ${esc(c.address.current)||"—"}<br><b>Permanent:</b> ${esc(c.address.permanent)||"—"}</p>
      <h3 class="section-h">Bank &amp; Nominee</h3>
      <p>${esc(c.bank.name)||"—"} · A/c ${esc(c.bank.account)||"—"} · IFSC ${esc(c.bank.ifsc)||"—"}<br>Nominee: ${esc(c.nominee.name)||"—"} (${esc(c.nominee.relationship)||"—"})</p>
      <h3 class="section-h">References</h3>
      <p>${esc(c.references[0])||"—"}<br>${esc(c.references[1])||"—"}</p>
      <h3 class="section-h">KYC</h3>
      <p>Aadhaar: <span class="mono">${maskAadhaar(decryptedAadhaar)}</span> · PAN: <span class="mono">${maskPAN(decryptedPan)}</span>
      ${c.kyc.otherIdType ? ` · ${esc(c.kyc.otherIdType)}: ${esc(c.kyc.otherIdNumber)}` : ""}</p>
      <h3 class="section-h">Real-Time Verification</h3>
      <table>
        <thead><tr><th>Check</th><th>Status</th><th>Last Run</th><th></th></tr></thead>
        <tbody>
          ${verifyRow("aadhaar","Aadhaar Verification","aadhaarVerification")}
          ${verifyRow("pan","PAN Verification","panVerification")}
          ${verifyRow("ckyc","CKYC Fetch","ckycVerification")}
        </tbody>
      </table>
      <p class="small muted">Set up a provider under Verification APIs (Super Admin) to enable these.</p>
      <div class="kyc-upload-row">
        ${c.kyc.photoBase64 ? `<div class="kyc-upload-box"><div class="small">Photograph</div><img src="${c.kyc.photoBase64}" style="display:block;"></div>` : ""}
        ${c.kyc.docImageBase64 ? `<div class="kyc-upload-box"><div class="small">ID Document</div><img src="${c.kyc.docImageBase64}" style="display:block;"></div>` : ""}
        ${c.kyc.signatureBase64 ? `<div class="kyc-upload-box"><div class="small">Signature</div><img src="${c.kyc.signatureBase64}" style="display:block;"></div>` : ""}
        ${c.kyc.gpsLat ? `<div class="kyc-upload-box"><div class="small">GPS Location</div><div class="mono small" style="margin-top:8px;">${c.kyc.gpsLat.toFixed(5)}, ${c.kyc.gpsLng.toFixed(5)}</div></div>` : ""}
      </div>
      <p class="small muted" style="margin-top:14px;">Created ${fmtDate(c.createdAt)} by ${esc(c.createdBy)}</p>
      <h3 class="section-h">Financial Document Verification</h3>
      <p class="small muted">No credentials are ever stored here — documents only, uploaded by the applicant or staff, or fetched via a consented Account Aggregator connection once one is configured.</p>
      <div class="grid grid-2">
        <div class="field"><label>Account Aggregator consent</label>
          <div>${c.aaConsentStatus ? `<span class="badge ${c.aaConsentStatus==='Granted'?'badge-approved':'badge-progress'}">${esc(c.aaConsentStatus)}</span>` : `<span class="badge badge-new">Not Requested</span>`}
          <button class="btn btn-outline btn-sm request-aa-btn" data-customer="${c.id}" style="margin-left:8px;" ${cfg.accountAggregatorEnabled?'':'disabled'}>${cfg.accountAggregatorEnabled?'Request Consent':'Not Configured'}</button></div>
        </div>
      </div>
      <div class="kyc-upload-row" style="margin-top:10px;">
        <div class="kyc-upload-box">
          <div class="small">ITR Acknowledgment</div>
          ${c.financialDocs?.itrDocBase64 ? `<img src="${c.financialDocs.itrDocBase64}" style="display:block;">` : ""}
          <input type="file" accept="image/*,application/pdf" class="findoc-file-input" data-customer="${c.id}" data-doc="itrDocBase64">
          <button class="btn btn-outline btn-sm auto-read-itr-btn" data-customer="${c.id}" style="margin-top:6px; width:100%;">Auto-read ITR Income</button>
          ${c.financialDocs?.itrDeclaredIncome ? `<div class="small" style="margin-top:6px;">ITR shows: <b>${fmtINR(c.financialDocs.itrDeclaredIncome)}</b>/yr${c.income.annual ? ` — declared: ${fmtINR(c.income.annual)}/yr — ${Math.abs(c.financialDocs.itrDeclaredIncome-c.income.annual) > c.income.annual*0.2 ? '<span class="badge badge-rejected">Mismatch &gt;20%</span>' : '<span class="badge badge-approved">Consistent</span>'}` : ''}</div>` : ""}
        </div>
        <div class="kyc-upload-box">
          <div class="small">GST Returns</div>
          ${c.financialDocs?.gstDocBase64 ? `<img src="${c.financialDocs.gstDocBase64}" style="display:block;">` : ""}
          <input type="file" accept="image/*,application/pdf" class="findoc-file-input" data-customer="${c.id}" data-doc="gstDocBase64">

        <div class="kyc-upload-box">
          <div class="small">Bank Statement</div>
          ${c.financialDocs?.bankStmtDocBase64 ? `<img src="${c.financialDocs.bankStmtDocBase64}" style="display:block;">` : ""}

/* ---------------------------------------------------------------------
   Loan Products tab (Phase 3)
   --------------------------------------------------------------------- */
function renderProductsTab(products){
  const subview = session.productSubview || "list";
  if(subview === "form") return renderProductForm(session.editingProduct);
  const sorted = products.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const isSuperAdmin = session.user.role==="Super Admin";
  const nameCounts = {};
  products.forEach(p=>{ nameCounts[p.name] = (nameCounts[p.name]||0)+1; });
  const hasDuplicates = Object.values(nameCounts).some(c=>c>1);
  return `
    <div class="card">
      <div class="flex-between">
        <div><h2>Loan Products</h2><p class="sub">Every product's rate, tenure, fees, security requirement, and lending limit — configurable, not hard-coded. ${isSuperAdmin?'':'Only Super Admin can activate a product or change its limit into effect — your changes save as Draft until activated.'}</p></div>
        <div class="action-row">
          ${isSuperAdmin ? `<button class="btn btn-outline btn-sm" id="btn-activate-all-products">Activate All</button>` : ""}
          ${isSuperAdmin && hasDuplicates ? `<button class="btn btn-danger btn-sm" id="btn-dedupe-products">Remove Duplicates</button>` : ""}
          <button class="btn btn-gold btn-sm" id="btn-open-new-product">+ New Product</button>
        </div>
      </div>
      <table>
        <thead><tr><th>Product</th><th>Rate</th><th>Tenure</th><th>Max Loan Amount</th><th>Security</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${sorted.map(p=>`
          <tr>
            <td><a href="javascript:void(0)" class="edit-product-btn" data-product="${p.id}" style="color:var(--navy-900); font-weight:600; text-decoration:underline; cursor:pointer;">${esc(p.name)}</a>${nameCounts[p.name]>1?` <span class="badge badge-rejected">Duplicate</span>`:''}</td><td>${p.interestRate}% p.a.</td><td>${p.tenureMin}–${p.tenureMax} mo</td>
            <td>${fmtINR(p.maxLoanAmount)}</td><td>${esc(p.securityRequired)}</td>
            <td>${p.active ? `<span class="badge badge-approved">Active</span>` : `<span class="badge badge-new">Draft</span>`}</td>
            <td>
              <div class="action-row">
                <button class="btn btn-outline btn-sm edit-product-btn" data-product="${p.id}">Edit</button>
                ${isSuperAdmin ? `<button class="btn ${p.active?'btn-danger':'btn-gold'} btn-sm activate-product-btn" data-product="${p.id}" data-activate="${p.active?'0':'1'}">${p.active?'Deactivate':'Activate'}</button>` : ""}
              </div>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderProductForm(product){
  const p = product || {name:"", interestRate:"", tenureMin:6, tenureMax:36, emiFrequency:"Monthly", processingFeePct:1, insurancePct:0.5, penaltyRatePct:2, gstPct:18, moratoriumMonths:0, securityRequired:"No", maxLoanAmount:200000, active:true, autoSanctionEnabled:false, rules:[]};
  const isSuperAdmin = session.user.role==="Super Admin";
  const rules = p.rules || [];
  const ruleRow = (i)=>{
    const r = rules[i] || {};
    return `
      <div class="grid grid-3" style="margin-bottom:8px;">
        <select class="rule-field" data-idx="${i}"><option value="">— Not used —</option>${RULE_FIELDS.map(f=>`<option value="${f.key}" ${r.field===f.key?'selected':''}>${f.label}</option>`).join("")}</select>
        <select class="rule-operator" data-idx="${i}">${RULE_OPERATORS.map(o=>`<option ${r.operator===o?'selected':''}>${o}</option>`).join("")}</select>
        <input class="rule-value" data-idx="${i}" type="number" step="0.1" value="${r.value!==undefined?r.value:''}" placeholder="Threshold value">
      </div>`;
  };
  return `
    <div class="card">
      <div class="flex-between">
        <h2>${product ? "Edit Product" : "New Product"}</h2>
        <button class="btn btn-outline btn-sm" id="btn-cancel-product">Cancel</button>
      </div>
      <div class="grid grid-3">
        <div class="field"><label>Product name</label><input id="pf-name" value="${esc(p.name)}"></div>
        <div class="field"><label>Interest rate (% p.a.)</label><input id="pf-rate" type="number" step="0.1" value="${p.interestRate}"></div>
        <div class="field"><label>EMI frequency</label><select id="pf-freq">${EMI_FREQUENCIES.map(f=>`<option ${f===p.emiFrequency?'selected':''}>${f}</option>`).join("")}</select></div>
        <div class="field"><label>Tenure min (months)</label><input id="pf-tenure-min" type="number" value="${p.tenureMin}"></div>
        <div class="field"><label>Tenure max (months)</label><input id="pf-tenure-max" type="number" value="${p.tenureMax}"></div>
        <div class="field"><label>Max loan amount (₹)</label><input id="pf-max-amount" type="number" value="${p.maxLoanAmount||0}"></div>
        <div class="field"><label>Moratorium (months)</label><input id="pf-moratorium" type="number" value="${p.moratoriumMonths}"></div>
        <div class="field"><label>Processing fee (%)</label><input id="pf-processing" type="number" step="0.1" value="${p.processingFeePct}"></div>
        <div class="field"><label>Insurance (%)</label><input id="pf-insurance" type="number" step="0.1" value="${p.insurancePct}"></div>
        <div class="field"><label>Penalty rate (% p.a. on overdue)</label><input id="pf-penalty" type="number" step="0.1" value="${p.penaltyRatePct}"></div>
        <div class="field"><label>GST on fees (%)</label><input id="pf-gst" type="number" step="0.1" value="${p.gstPct}"></div>
        <div class="field"><label>Security required</label><select id="pf-security"><option value="No" ${p.securityRequired==='No'?'selected':''}>No</option><option value="Yes" ${p.securityRequired==='Yes'?'selected':''}>Yes</option></select></div>
        ${isSuperAdmin ? `
        <div class="field"><label>Status</label><select id="pf-active"><option value="true" ${p.active?'selected':''}>Active</option><option value="false" ${!p.active?'selected':''}>Draft (Inactive)</option></select></div>
        ` : `<div class="field"><label>Status</label><div class="small muted" style="padding-top:8px;">Only Super Admin can activate a product. This saves as Draft.</div></div>`}
      </div>

      <h3 class="section-h">Minimum Eligibility Criteria (Borrower Self-Check)</h3>
      <p class="small muted" style="margin-top:-6px;">Used by the Borrower Portal's "Check Eligibility" tool to give a genuine yes/no — separate from Straight-Through Processing below, so every product can give a clear answer whether or not auto-sanction is enabled for it.</p>
      <div class="grid grid-2">
        <div class="field"><label>Minimum monthly income (₹)</label><input id="pf-min-income" type="number" value="${p.minMonthlyIncome||0}"></div>
        <div class="field"><label>Maximum FOIR — total obligations as % of income</label><input id="pf-max-foir" type="number" step="1" value="${p.maxFoirPct||60}"></div>
      </div>

      <h3 class="section-h">Required Documents Checklist</h3>
      <div class="field"><label>One document per line</label><textarea id="pf-required-docs" placeholder="Aadhaar Card&#10;PAN Card&#10;Business Proof&#10;Bank Statement (6 months)&#10;Photograph">${(p.requiredDocuments||[]).join("\n")}</textarea></div>
      <p class="small muted" style="margin-top:-6px;">Shown as a checklist during Credit Appraisal for applications on this product.</p>

      ${isSuperAdmin ? `
      <h3 class="section-h">Straight-Through Processing (Rule Engine)</h3>
      <div class="warn-banner" style="background:#FBE7E8;border-color:var(--danger);color:#7A1F27;">⚠ Enabling this bypasses the human Maker-Checker approval your Credit Policy otherwise requires for this product — every auto-sanction is logged distinctly as machine-decided. Only Super Admin can turn this on.</div>
      <label style="display:flex; align-items:center; gap:8px; margin-bottom:12px;"><input type="checkbox" id="pf-auto-sanction" ${p.autoSanctionEnabled?'checked':''} style="width:auto;"> Enable auto-sanction for this product when every rule below passes</label>
      <p class="small muted">Applies when an appraisal recommends "Approve" for this product. Leave a rule row's field as "— Not used —" to skip it. All configured rules must pass.</p>
      ${[0,1,2,3,4,5,6,7].map(ruleRow).join("")}

      <h3 class="section-h">DSA Commission</h3>
      <div class="field" style="max-width:260px;"><label>Commission (% of disbursed amount)</label><input id="pf-dsa-commission" type="number" step="0.1" value="${p.dsaCommissionPct||0}"></div>
      ` : ""}

      <button class="btn btn-gold" id="btn-save-product" data-product="${product?product.id:''}">Save Product</button>
    </div>
  `;
}

/* ---------------------------------------------------------------------
   Credit Policy Engine tab (Phase 3)
   --------------------------------------------------------------------- */
async function renderPolicyTab(){
  let policy = await db.get("policyConfig","default");
  if(!policy) policy = defaultPolicyConfig();
  if(!policy.journalLimits) policy.journalLimits = defaultPolicyConfig().journalLimits;
  if(policy.minCibilScore===undefined || policy.minCibilScore===null) policy.minCibilScore = defaultPolicyConfig().minCibilScore;
  return `
    <div class="card">
      <h2>Credit Policy Engine</h2>
      <p class="sub">Delegation of powers, exposure norms, LTV limits, pricing matrix, provisioning rules and early-warning signals — every sanction and disbursement will check against these from Phase 4 onward.</p>
      <div class="warn-banner" style="background:#FBF1DC;border-color:var(--gold);color:#5C4200;">⚠ Defaults shown are illustrative starting points, not RBI/NBFC compliance advice. Confirm every figure against current RBI Scale Based Regulation and your Board-approved credit policy before go-live.</div>

      <h3 class="section-h">Minimum Eligibility</h3>
      <div class="grid grid-3">
        <div class="field"><label>Minimum CIBIL / bureau score</label><input id="pol-min-cibil" type="number" value="${policy.minCibilScore}"></div>
      </div>
      <p class="sub" style="margin-top:-6px;">Shown as a reference check on Credit Appraisal — the officer sees whether the applicant's declared bureau score clears this bar, but appraisal and sanction still require a human decision. If auto-sanction is enabled for a product (Loan Products tab), add a matching Credit Score rule there for it to actually gate approval automatically.</p>

        <thead><tr><th>Asset Classification</th><th>Provisioning (%)</th></tr></thead>

        ${policy.provisioning.map((pv,i)=>`<tr><td>${esc(pv.classification)}</td><td><input class="policy-input" data-group="provisioning" data-index="${i}" data-field="pct" type="number" step="0.1" value="${pv.pct}" style="width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;"></td></tr>`).join("")}

/* ---------------------------------------------------------------------

async function renderAppraisalTab(appraisals, customers, leads){
  const subview = session.appraisalSubview || "list";
  if(subview === "new") return await renderAppraisalForm(customers, leads);
  if(subview === "view") return await renderAppraisalDetail(appraisals.find(a=>a.id===session.viewingAppraisalId), customers);
  return renderAppraisalList(appraisals, customers);
}

function renderAppraisalList(appraisals, customers){
  const custName = (id)=> { const c = customers.find(c=>c.id===id); return c ? c.personal.name : "—"; };
  const sorted = appraisals.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return `
    <div class="card">
      <div class="flex-between">
        <div><h2>Credit Appraisal</h2><p class="sub">Field verification — business, residence, neighbour checks, income and cash-flow assessment, risk rating and recommendation.</p></div>
        <button class="btn btn-gold btn-sm" id="btn-open-new-appraisal" ${customers.length===0?'disabled':''}>+ New Appraisal</button>
      </div>
      ${customers.length===0 ? `<p class="small muted">Add a customer first (Customers tab) before starting an appraisal.</p>` : ""}
      <table>
        <thead><tr><th>Customer</th><th>Officer</th><th>Risk Rating</th><th>Recommendation</th><th>Status</th><th>Date</th><th></th></tr></thead>
        <tbody>
        ${sorted.length===0 ? `<tr class="empty-row"><td colspan="7">No appraisals yet.</td></tr>` :
          sorted.map(a=>`
          <tr>
            <td>${esc(custName(a.customerId))}</td><td>${esc(a.officerName)}</td>
            <td>${a.riskRating ? `<span class="badge badge-risk-${a.riskRating}">${a.riskRating}</span>` : "—"}</td>
            <td>${esc(a.recommendation)||"—"}</td>
            <td>${a.status==="Submitted" ? `<span class="badge badge-approved">Submitted</span>` : `<span class="badge badge-progress">Draft</span>`}</td>
            <td>${fmtDate(a.appraisalDate||a.createdAt)}</td>
            <td><button class="btn btn-outline btn-sm view-appraisal-btn" data-appraisal="${a.id}">View</button></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function flagBadgeClass(flag){
  if(flag==="Good") return "badge-approved";
  if(flag==="Caution") return "badge-progress";
  if(flag==="High Risk") return "badge-rejected";
  return "badge-new";
}

function renderCmaRatiosBlock(r){
  const row = (label, value, flag, hint)=>`
    <div class="kpi" ${flag?`style="border-top-color:${flag==='Good'?'var(--ok)':flag==='Caution'?'var(--warn)':flag==='High Risk'?'var(--danger)':'var(--gold)'};"`:''}>
      <div class="lbl">${label}</div>
      <div class="val" style="font-size:18px;">${value}</div>
      ${flag ? `<span class="badge ${flagBadgeClass(flag)}" style="margin-top:6px;">${flag}</span>` : ""}
      ${hint ? `<div class="small muted" style="margin-top:4px;">${hint}</div>` : ""}
    </div>`;
  return `
    <h3 class="section-h">CMA / Financial Ratios</h3>
    <div class="warn-banner" style="background:#FBF1DC;border-color:var(--gold);color:#5C4200;">⚠ Flag bands (Good/Caution/High Risk) are common rule-of-thumb thresholds in Indian bank/NBFC lending practice, not a fixed regulatory standard — your Credit Policy should set the final thresholds for sanctioning decisions.</div>
    <div class="grid grid-4">
      ${row("Net Worth", fmtINR(r.netWorth))}
      ${row("Current Ratio", r.currentRatio===null?"—":r.currentRatio.toFixed(2), r.flags.currentRatio, "Benchmark ≥1.33 (Tandon Committee)")}
      ${row("Debt-Equity Ratio", r.debtEquityRatio===null?"—":r.debtEquityRatio.toFixed(2)+":1", r.flags.debtEquityRatio, "Rule of thumb ≤2:1")}
      ${row("DSCR", r.dscr===null?"—":r.dscr.toFixed(2), r.flags.dscr, "Comfortable ≥1.5")}
    </div>
    <div class="grid grid-3" style="margin-top:12px;">
      ${row("FOIR", r.foirPct===null?"—":r.foirPct.toFixed(1)+"%", r.flags.foirPct, r.takeHomePay ? "vs. take-home pay (more accurate for salaried)" : "vs. gross income")}
      <div class="kpi"><div class="lbl">Proposed EMI (estimated)</div><div class="val" style="font-size:18px;">${fmtINR(Math.round(r.proposedEmi||0))}</div></div>
      <div class="kpi"><div class="lbl">Total Monthly Obligation</div><div class="val" style="font-size:18px;">${fmtINR(Math.round(r.totalMonthlyObligation||0))}</div></div>
    </div>
    ${r.takeHomePay ? `<p class="small muted" style="margin-top:8px;">Take-Home Pay entered: <b>${fmtINR(r.takeHomePay)}</b>/month</p>` : ""}
  `;
}

async function renderAppraisalDetail(a, customers){
  if(!a) return `<div class="card">Appraisal not found.</div>`;
  const cust = customers.find(c=>c.id===a.customerId);
  const cfg = await getApiConfig();
  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const minCibil = policy.minCibilScore || 0;
  const custScore = cust ? cust.creditScore : null;
  const verifyRow = (key, label, resultField)=>{
    const result = a[resultField];
    const enabled = cfg[key+"Enabled"];
    return `<tr>
      <td>${label}</td>
      <td>${result ? `<span class="badge ${result.status==='Verified'?'badge-approved':result.status==='Failed'?'badge-rejected':'badge-progress'}">${esc(result.status)}</span>` : `<span class="badge badge-new">Not Checked</span>`}</td>
      <td>${result ? fmtDate(result.checkedAt)+" by "+esc(result.checkedBy) : "—"}</td>
      <td><button class="btn btn-outline btn-sm run-appraisal-verify-btn" data-appraisal="${a.id}" data-service="${key}" data-field="${resultField}" ${enabled?'':'disabled'}>${enabled?'Run Check':'Not Configured'}</button></td>
    </tr>`;
  };
  return `
    <div class="card">
      <div class="flex-between">
        <h2>Appraisal — ${esc(cust ? cust.personal.name : "Unknown customer")}</h2>
        <div class="action-row">
          <button class="btn btn-gold btn-sm" id="btn-generate-appraisal-note" data-appraisal="${a.id}">Generate Appraisal Note (PDF)</button>
          <button class="btn btn-outline btn-sm" id="btn-back-to-appraisals">← Back to list</button>
        </div>
      </div>
      <div class="grid grid-3">
        <div><div class="field"><label>Officer</label><div>${esc(a.officerName)}</div></div></div>
        <div><div class="field"><label>Date</label><div>${esc(a.appraisalDate)}</div></div></div>
        <div><div class="field"><label>Risk Rating</label><div>${a.riskRating?`<span class="badge badge-risk-${a.riskRating}">${a.riskRating}</span>`:"—"}</div></div></div>
      </div>
      ${custScore!==null ? `
      <div class="warn-banner" style="background:${custScore>=minCibil?'#E4F3E8':'#FBE7E8'};border-color:${custScore>=minCibil?'var(--ok)':'var(--danger)'};color:${custScore>=minCibil?'#1D4E33':'#7A1F27'};">
        ${custScore>=minCibil?'✓':'⚠'} Credit score ${custScore} — Credit Policy minimum is ${minCibil}. ${custScore>=minCibil?'Meets the minimum.':'Below the policy minimum — a deviation, if approved, should be explicitly noted.'}
      </div>` : ""}
      ${a.documentChecklist && a.documentChecklist.length>0 ? `
      <h3 class="section-h">Document Checklist</h3>
      <div class="grid grid-3">
        ${a.documentChecklist.map(d=>`<div class="small">${d.checked?'✅':'⬜'} ${esc(d.name)}</div>`).join("")}
      </div>` : ""}
      <h3 class="section-h">Field Verification</h3>
      <p><b>Business:</b> ${esc(a.businessVerification)||"—"}</p>
      <p><b>Residence:</b> ${esc(a.residenceVerification)||"—"}</p>
      <p><b>Neighbour:</b> ${esc(a.neighbourVerification)||"—"}</p>
      <p><b>Credit Bureau:</b> ${esc(a.creditBureauReport)||"—"}</p>
      <h3 class="section-h">Financial Assessment</h3>
      <p><b>Income:</b> ${esc(a.incomeAssessment)||"—"}</p>
      <p><b>Cash flow:</b> ${esc(a.cashFlowAssessment)||"—"}</p>
      <p><b>Household expenses:</b> ${fmtINR(a.householdExpenses)} · <b>Repayment capacity:</b> ${fmtINR(a.repaymentCapacity)}</p>
      ${a.cmaRatios ? renderCmaRatiosBlock(a.cmaRatios) : ""}
      <h3 class="section-h">Recommendation</h3>
      <p>${esc(a.recommendation)||"—"}</p>
      <h3 class="section-h">Litigation, Bureau &amp; Fraud Checks</h3>
      <table>
        <thead><tr><th>Check</th><th>Status</th><th>Last Run</th><th></th></tr></thead>
        <tbody>
          ${verifyRow("litigation","Court / Litigation Search","litigationCheck")}
          ${verifyRow("bureau","Credit Bureau / Defaulter Check","bureauCheck")}
          ${verifyRow("aml","AML / Sanctions &amp; PEP Screening","amlCheck")}

async function renderSanctionTab(sanctions, leads, customers, products, loanAccounts){

function sanctionStatusBadge(status){
  if(status==="Proposed") return `<span class="badge badge-progress">Proposed</span>`;
  if(status==="Approved") return `<span class="badge badge-approved">Approved</span>`;
  if(status==="Rejected") return `<span class="badge badge-rejected">Rejected</span>`;
  return `<span class="badge badge-new">${esc(status)}</span>`;
}

function renderSanctionList(sanctions, customers, policy){
  const custName = (id)=> { const c = customers.find(c=>c.id===id); return c ? c.personal.name : "—"; };
  const u = session.user;
  const sorted = sanctions.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return `
    <div class="card">
      <div class="flex-between">
        <div><h2>Sanction &amp; Disbursement</h2><p class="sub">Fund-checked proposals, Maker-Checker approval, and disbursement recording.</p></div>
        <button class="btn btn-gold btn-sm" id="btn-open-new-sanction">+ New Sanction</button>
      </div>
      <table>
        <thead><tr><th>Customer</th><th>Product</th><th>Amount</th><th>Proposed By</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${sorted.length===0 ? `<tr class="empty-row"><td colspan="6">No sanctions yet.</td></tr>` :
          sorted.map(s=>{
            const canApprove = (DELEGATION_ROLES.includes(u.role) || u.role==="Super Admin") && u.name !== s.proposedBy;
            const withinDelegation = u.role==="Super Admin" || getDelegationLimitForRole(policy, u.role) >= s.sanctionedAmount;
            let actions = "";
            if(s.status==="Proposed"){
              if(canApprove && withinDelegation){
                actions = `<div class="action-row"><button class="btn btn-outline btn-sm approve-sanction-btn" data-sanction="${s.id}">Approve</button><button class="btn btn-danger btn-sm reject-sanction-btn" data-sanction="${s.id}">Reject</button></div>`;
              } else if(canApprove && !withinDelegation){
                actions = `<span class="small muted">Exceeds your delegation limit</span>`;
              } else {
                actions = `<span class="small muted">Maker-Checker: awaiting a different authorised approver</span>`;
              }
            } else if(s.status==="Approved" && !s.disbursementId){
              actions = `<div class="action-row"><button class="btn btn-gold btn-sm disburse-btn" data-sanction="${s.id}">Disburse</button><button class="btn btn-outline btn-sm letter-btn" data-sanction="${s.id}">Letter</button></div>`;
            } else if(s.disbursementId){
              actions = `<div class="action-row"><span class="badge badge-approved">Disbursed</span><button class="btn btn-outline btn-sm letter-btn" data-sanction="${s.id}">Letter</button></div>`;
            }
            return `<tr>
              <td>${esc(custName(s.customerId))}</td><td>${esc(s.product)}</td><td>${fmtINR(s.sanctionedAmount)}</td>
              <td>${esc(s.proposedBy)}</td><td>${sanctionStatusBadge(s.status)}</td><td>${actions}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function getDelegationLimitForRole(policySnapshot, role){
  if(!policySnapshot) return 0;
  const row = policySnapshot.delegation.find(d=>d.role===role);
  return row ? row.maxAmount : 0;
}
function getJournalLimitForRole(policySnapshot, role){
  if(!policySnapshot || !policySnapshot.journalLimits) return 0;
  const row = policySnapshot.journalLimits.find(d=>d.role===role);
  return row ? row.maxAmount : 0;
}

async function refreshSanctionChecks(){
  const box = document.getElementById("sanction-checks-box");
  const leadSel = document.getElementById("sf-lead");
  if(!box || !leadSel) return;
  const leadId = leadSel.value;
  const lead = await db.get("leads", leadId);
  if(!lead) return;
  const products = await db.getAll("products");
  const prod = products.find(p=>p.name===lead.product);
  const amountInput = document.getElementById("sf-amount");
  const rateInput = document.getElementById("sf-rate");
  const tenureInput = document.getElementById("sf-tenure");
  if(amountInput && !amountInput.value) amountInput.value = lead.amountRequested || "";
  if(rateInput && !rateInput.value) rateInput.value = prod ? prod.interestRate : "";
  if(tenureInput && !tenureInput.value) tenureInput.value = prod ? prod.tenureMax : "";

  const amount = Number(amountInput.value)||0;
  const fundPos = await computeFundPosition();
  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const borrowerExp = await computeBorrowerExposure(lead.customerId, null);
  const sector = await computeSectorExposure(lead.product, null);
  const fundsOk = amount <= fundPos.available;
  const exposureOk = (borrowerExp + amount) <= policy.exposure.maxBorrowerExposure;
  const sectorOk = sector.pct <= policy.exposure.maxSectorExposurePct;
  const productLimitOk = !prod || !prod.maxLoanAmount || amount <= prod.maxLoanAmount;

  box.innerHTML = `
    <h3 class="section-h">Fund &amp; Exposure Checks</h3>
    <div class="grid grid-4">
      <div class="kpi"><div class="lbl">Available Funds</div><div class="val" style="font-size:18px;">${fmtINR(fundPos.available)}</div></div>
      <div class="kpi"><div class="lbl">Committed Funds</div><div class="val" style="font-size:18px;">${fmtINR(fundPos.committed)}</div></div>
      <div class="kpi"><div class="lbl">Borrower Exposure (incl. this)</div><div class="val" style="font-size:18px;">${fmtINR(borrowerExp+amount)}</div></div>
      <div class="kpi"><div class="lbl">Sector Exposure (${esc(lead.product)})</div><div class="val" style="font-size:18px;">${sector.pct.toFixed(1)}%</div></div>
    </div>
    <div class="warn-banner" style="background:${fundsOk?'#E4F3E8':'#FBE7E8'};border-color:${fundsOk?'var(--ok)':'var(--danger)'};color:${fundsOk?'#1D4E33':'#7A1F27'};margin-top:12px;">
      ${fundsOk?'✓':'⚠'} Fund availability: ${fundsOk?'sufficient funds available.':'requested amount exceeds available funds — requires override.'}
    </div>
    <div class="warn-banner" style="background:${productLimitOk?'#E4F3E8':'#FBE7E8'};border-color:${productLimitOk?'var(--ok)':'var(--danger)'};color:${productLimitOk?'#1D4E33':'#7A1F27'};">
      ${productLimitOk?'✓':'⚠'} Product limit: ${prod&&prod.maxLoanAmount ? (productLimitOk?'within':'exceeds')+' the '+esc(lead.product)+' maximum of '+fmtINR(prod.maxLoanAmount)+' set in Loan Products.' : 'no maximum configured for this product.'}
    </div>
    <div class="warn-banner" style="background:${exposureOk?'#E4F3E8':'#FBF1DC'};border-color:${exposureOk?'var(--ok)':'var(--warn)'};color:${exposureOk?'#1D4E33':'#5C4200'};">
      ${exposureOk?'✓':'⚠'} Borrower exposure: ${exposureOk?'within':'exceeds'} policy cap of ${fmtINR(policy.exposure.maxBorrowerExposure)}.
    </div>
    <div class="warn-banner" style="background:${sectorOk?'#E4F3E8':'#FBF1DC'};border-color:${sectorOk?'var(--ok)':'var(--warn)'};color:${sectorOk?'#1D4E33':'#5C4200'};">
      ${sectorOk?'✓':'⚠'} Sector (product) exposure: ${sectorOk?'within':'exceeds'} policy cap of ${policy.exposure.maxSectorExposurePct}% of portfolio.
    </div>
    <p class="small muted">Branch exposure is not yet tracked (staff/customers aren't branch-linked in this phase).</p>
  `;
}

async function renderLoanAccountsTab(loanAccounts, customers){
  const subview = session.loanSubview || "list";
  if(subview === "view") return await renderLoanAccountDetail(loanAccounts.find(a=>a.id===session.viewingLoanId), customers);
  if(subview === "collect") return await renderCollectionForm(loanAccounts.find(a=>a.id===session.collectingLoanId), customers);
  if(subview === "receipt") return await renderReceipt(session.viewingReceipt);
  return renderLoanAccountsList(loanAccounts, customers);
}

function loanNextDue(acc){
  if(!acc.schedule) return null;
  return acc.schedule.find(i=>i.status!=="Paid") || null;
}

function renderLoanAccountsList(loanAccounts, customers){
  const custName = (id)=> { const c = customers.find(c=>c.id===id); return c ? c.personal.name : "—"; };
  const sorted = loanAccounts.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const today = todayStr();
  return `
    <div class="card">
      <h2>Loan Accounts</h2>
      <p class="sub">Each account has a unique reference number for statements/receipts. Principal outstanding, EMI schedule, repayment history, prepayment and foreclosure. One customer may hold multiple accounts.</p>
      <table>
        <thead><tr><th>Account No.</th><th>Customer</th><th>Product</th><th>Principal</th><th>Outstanding</th><th>Next Due</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${sorted.length===0 ? `<tr class="empty-row"><td colspan="8">No loan accounts yet — disburse a sanctioned loan to create one.</td></tr>` :
          sorted.map(a=>{
            const next = loanNextDue(a);
            const overdue = next && next.dueDate < today;
            return `<tr>
              <td class="mono">${esc(a.accountNumber)||"—"}</td>
              <td>${esc(custName(a.customerId))}</td><td>${esc(a.product)}</td>
              <td>${fmtINR(a.principal)}</td><td>${fmtINR(a.principalOutstanding)}</td>
              <td>${next ? `${fmtINR(next.emiAmount)} on ${next.dueDate} ${overdue?'<span class="badge badge-rejected">Overdue</span>':''}` : "—"}</td>
              <td>${a.status==="Active" ? `<span class="badge badge-approved">Active</span>` : `<span class="badge badge-new">${esc(a.status)}</span>`}</td>
              <td><button class="btn btn-outline btn-sm view-loan-btn" data-loan="${a.id}">View</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/** Key Fact Statement — RBI's Master Direction (April 15, 2024) requires
 *  this be given to the borrower before the loan agreement is executed,
 *  for every new retail/MSME term loan sanctioned on or after 1 Oct 2024.
 *  Covers the elements that mandate requires: sanctioned amount, tenure,
 *  EMI, interest rate, itemized fees/charges, APR (all-in cost), penal
 *  and foreclosure charges, and the cooling-off period. Built in good
 *  faith from the publicly available requirements — cross-check the
 *  exact field-by-field template (Annex A of that circular) with your
 *  compliance team before relying on this as your compliance document;
 *  I don't have that literal annex to verify against character-for-character.
 */
async function generateKfsHtml(sanction, cust, product){
  const nbfc = await getNbfcProfile();
  const gen = generateEmiSchedule({
    principal: sanction.sanctionedAmount, interestRate: sanction.interestRate,
    tenureMonths: sanction.tenureMonths, disbursedDate: todayStr(),
    emiFrequency: product ? product.emiFrequency : "Monthly"
  });
  const processingFee = sanction.processingFee || 0;
  const insuranceFee = product ? Math.round(sanction.sanctionedAmount * (product.insurancePct||0)/100) : 0;
  const gstOnFees = product ? Math.round((processingFee+insuranceFee) * (product.gstPct||0)/100) : 0;
  const totalUpfrontFees = processingFee + insuranceFee + gstOnFees;
  const netProceeds = sanction.sanctionedAmount - totalUpfrontFees;
  const periodsPerYear_ = periodsPerYear(product ? product.emiFrequency : "Monthly");
  const apr = computeAPR(netProceeds, gen.schedule, periodsPerYear_);
  const penalRate = product ? product.penaltyRatePct : 2;

  return `
    <div class="letterhead">
      <div class="name">${esc(nbfc.name||"[NBFC Name Not Set]")}</div>
      <div class="meta">${esc(nbfc.address||"")} ${nbfc.registrationNumber?" · RBI Reg. "+esc(nbfc.registrationNumber):""}</div>
    </div>
    <h1>Key Fact Statement (KFS)</h1>
    <p class="small">As per RBI's Key Fact Statement guidelines — provided before execution of your loan agreement, summarizing the true cost and terms of this loan in plain language.</p>
    <table>
      <tr><td><b>Borrower</b></td><td>${esc(cust.personal.name)}</td><td><b>Reference No.</b></td><td class="mono">${esc(sanction.id)}</td></tr>
      <tr><td><b>Type of Loan</b></td><td>${esc(sanction.product)}</td><td><b>Date</b></td><td>${fmtDate(nowISO())}</td></tr>
    </table>

    <h2>Loan Terms</h2>
    <table>
      <tr><td style="width:35%;"><b>Sanctioned Loan Amount</b></td><td>${fmtINR(sanction.sanctionedAmount)}</td></tr>
      <tr><td><b>Loan Term</b></td><td>${sanction.tenureMonths} months</td></tr>
      <tr><td><b>Interest Rate (Fixed)</b></td><td>${sanction.interestRate}% per annum</td></tr>
      <tr><td><b>Instalment Amount (EMI)</b></td><td>${fmtINR(gen.emiAmount)} — ${gen.totalInstallments} instalments, ${esc(product?product.emiFrequency:"Monthly")}</td></tr>
    </table>

    <h2>Fees and Charges</h2>
    <table>
      <thead><tr><th>Charge</th><th>Amount</th><th>When Payable</th></tr></thead>
      <tbody>
        <tr><td>Processing Fee</td><td>${fmtINR(processingFee)}</td><td>One-time, at disbursement</td></tr>
        ${insuranceFee>0 ? `<tr><td>Insurance Charges</td><td>${fmtINR(insuranceFee)}</td><td>One-time, at disbursement</td></tr>` : ""}
        <tr><td>GST on above charges</td><td>${fmtINR(gstOnFees)}</td><td>One-time, at disbursement</td></tr>
        <tr><td><b>Net Amount Disbursed (Sanctioned Amount less upfront charges)</b></td><td><b>${fmtINR(netProceeds)}</b></td><td>—</td></tr>
      </tbody>
    </table>

    <h2>Annual Percentage Rate (APR)</h2>
    <table><tr><td style="width:35%;"><b>APR — Effective Annual Cost of This Loan</b></td><td style="font-size:16px;"><b>${apr.toFixed(2)}%</b></td></tr></table>
    <p class="small">APR factors in the interest rate together with all upfront fees and charges shown above — this is the true annual cost of borrowing, not just the interest rate, and is what RBI requires be disclosed for comparison across lenders.</p>

    <h2>Contingent Charges</h2>
    <table>
      <tr><td style="width:35%;"><b>Penal Charges (on overdue amount)</b></td><td>${penalRate}% per annum on the overdue amount, for the period of delay</td></tr>
      <tr><td><b>Foreclosure / Prepayment Charges</b></td><td>Principal outstanding plus interest accrued to date of foreclosure — no charge on future scheduled interest</td></tr>
    </table>

    <h2>Cooling-Off / Look-Up Period</h2>
    <p>You have <b>3 days</b> from the date of this Key Fact Statement to exit this loan, by repaying the principal and proportionate interest for the period, without any foreclosure charge.</p>

    <h2>Grievance Redressal</h2>
    <p>${esc(nbfc.contactEmail||"")}${nbfc.contactPhone?" · "+esc(nbfc.contactPhone):""}${!nbfc.contactEmail && !nbfc.contactPhone ? "Contact your branch directly." : ""}</p>

    <p style="font-size:10.5px; color:#888; margin-top:20px;">Generated from NBFC LMS on ${fmtDate(nowISO())}. This summarizes the terms above — please read your full loan agreement, which governs in case of any difference.</p>
  `;
}

function currentIndianFY(){
  const now = new Date();
  const y = now.getMonth()>=3 ? now.getFullYear() : now.getFullYear()-1; // FY starts April (month index 3)
  return `${y}-${(y+1).toString().slice(-2)}`;
}
function fyDateRange(fyLabel){
  const startYear = Number(fyLabel.split("-")[0]);
  return { start: `${startYear}-04-01`, end: `${startYear+1}-03-31` };
}

const LOAN_DOCUMENT_TYPES = ["Sanction Letter","Loan Agreement","Demand Promissory Note","Hypothecation Agreement","Guarantee Deed","Mortgage Papers","KYC Documents","Income Proof","Inspection Report","Other"];
// Firestore caps a single document at 1MB, and base64 encoding inflates
// a file's size by roughly a third — this threshold leaves real margin
// rather than letting someone hit that ceiling with no warning.
const DOCUMENT_VAULT_MAX_FILE_KB = 650;

async function renderDocumentVaultSection(loanAccountId){
  const isOpen = session.showDocumentVaultFor === loanAccountId;
  if(!isOpen){
    return `
      <h3 class="section-h">Document Vault</h3>
      <button class="btn btn-outline btn-sm" id="btn-toggle-document-vault" data-loan="${loanAccountId}">Show Document Vault</button>
    `;
  }

  const allDocs = (await db.getAll("loanDocuments")).filter(d=>d.loanAccountId===loanAccountId);
  const usedTypes = [...new Set(allDocs.map(d=>d.documentType))];
  const byType = {};
  usedTypes.forEach(t=> byType[t] = allDocs.filter(d=>d.documentType===t).sort((a,b)=>b.versionNumber-a.versionNumber));
  const availableToAdd = LOAN_DOCUMENT_TYPES.filter(t=>!usedTypes.includes(t));

  return `
    <div class="flex-between">
      <h3 class="section-h" style="margin:0;">Document Vault</h3>

    ${usedTypes.length===0 ? `<p class="small muted">No documents added yet for this loan.</p>` : `
    <table>
      <thead><tr><th>Document Type</th><th>Current Version</th><th>Uploaded</th><th></th></tr></thead>
      <tbody>
      ${usedTypes.map(type=>{
        const versions = byType[type];
        const current = versions[0];
        return `<tr>
          <td>${esc(type)}</td>
          <td>v${current.versionNumber} — ${esc(current.fileName)}</td>
          <td>${fmtDate(current.uploadedAt)+" by "+esc(current.uploadedBy)}</td>
          <td class="action-row">

          ${versions.map(v=>`<div class="small" style="padding:4px 0;">v${v.versionNumber} — ${esc(v.fileName)} — ${fmtDate(v.uploadedAt)} by ${esc(v.uploadedBy)} — <a href="${v.fileBase64}" download="${esc(v.fileName)}">Download</a></div>`).join("")}
        </td></tr>` : ""}`;
      }).join("")}
      </tbody>

    ${availableToAdd.length>0 ? `
    <div class="action-row" style="margin-top:8px;">
      <select id="doc-vault-add-type-select" data-loan="${loanAccountId}" style="padding:6px 8px; border-radius:6px; border:1px solid var(--line); font-size:13px;">

async function ensureRemindersUpToDate(loanAccounts, customers){
  const today = todayStr();
  const existingKeys = new Set((await db.getAll("reminders")).map(r=>r.key));
  const custById = Object.fromEntries(customers.map(c=>[c.id,c]));
  const newReminders = [];
  for(const acc of loanAccounts){
    if(!acc.schedule) continue;
    for(const inst of acc.schedule){
      if(inst.status==="Paid") continue;
      for(const rule of REMINDER_RULES){
        const trigger = new Date(inst.dueDate); trigger.setDate(trigger.getDate()+rule.offset);
        const triggerStr = trigger.toISOString().slice(0,10);
        if(triggerStr > today) continue;
        const key = `${acc.id}_${inst.index}_${rule.offset}`;
        if(existingKeys.has(key)) continue;
        const cust = custById[acc.customerId];
        newReminders.push({
          id: uid("rem"), key, loanAccountId: acc.id, customerId: acc.customerId,
          customerName: cust ? cust.personal.name : "—", customerMobile: cust ? cust.personal.mobile : "",
          customerEmail: cust ? cust.personal.email : "",
          installmentIndex: inst.index, dueDate: inst.dueDate, ruleLabel: rule.label, channels: rule.channels,
          triggerDate: triggerStr, status:"Pending", sentAt:null, sentBy:null, custom:false, createdAt: nowISO()
        });
        existingKeys.add(key);
      }
    }
  }
  await db.putMany("reminders", newReminders);
}

async function renderRemindersTab(loanAccounts, customers){
  if(!session.remindersEnsuredThisSession){
    session.remindersEnsuredThisSession = true;
    await ensureRemindersUpToDate(loanAccounts, customers);
  }
  if(!session.remindersAutoSentThisSession){

function classificationBadge(label){
  if(label==="Standard Assets") return `<span class="badge badge-approved">${label}</span>`;
  if(label.startsWith("SMA")) return `<span class="badge badge-progress">${label}</span>`;
  return `<span class="badge badge-rejected">${label}</span>`;
}

/* ---------------------------------------------------------------------
   Early Warning Signals (EWS) — surfaces deterioration signals BEFORE
   an account becomes a full NPA, so recovery/credit teams can act early
   rather than only reacting once something is already 90+ DPD. Built
   entirely from data already tracked elsewhere in the app — no new
   external inputs needed.
   --------------------------------------------------------------------- */
async function computeEwsSignals(){
  const [loanAccounts, customers, recoveryVisits] = await Promise.all([
    db.getAll("loanAccounts"), db.getAll("customers"), db.getAll("recoveryVisits")
  ]);
  const today = todayStr();
  const in30Days = new Date(Date.now() + 30*24*60*60*1000).toISOString().slice(0,10);
  const activeAccounts = loanAccounts.filter(a=>a.status==="Active");

  const smaWatchlist = activeAccounts.map(a=>{
    const dpd = computeDPD(a);
    const classification = classifyDPD(dpd);
    return { account: a, dpd, classification };
  }).filter(x=>["SMA-1 (31–60 DPD)","SMA-2 (61–90 DPD)"].includes(x.classification))
    .sort((a,b)=>b.dpd-a.dpd);

  const brokenPromises = recoveryVisits.filter(v=> v.promiseToPayDate && v.promiseToPayDate < today).map(v=>{
    const acc = loanAccounts.find(a=>a.id===v.loanAccountId);
    return acc && acc.status==="Active" && computeDPD(acc)>0 ? {visit:v, account:acc} : null;
  }).filter(Boolean);

  const insuranceExpiring = activeAccounts.filter(a=> a.insurance?.expiryDate && a.insurance.expiryDate <= in30Days);
  const collateralDue = activeAccounts.filter(a=> a.collateral?.nextValuationDue && a.collateral.nextValuationDue <= in30Days);

  const duplicateFlagged = customers.filter(c=>c.duplicateFlag).map(c=>{
    const custActive = activeAccounts.filter(a=>a.customerId===c.id);
    return custActive.length>0 ? {customer:c, accounts:custActive} : null;
  }).filter(Boolean);

  return { smaWatchlist, brokenPromises, insuranceExpiring, collateralDue, duplicateFlagged, customersById: Object.fromEntries(customers.map(c=>[c.id,c])) };
}

   Income on the Income Statement above stays cash-basis, driven by
   actual EMI collections. This is a separate accrual-basis memo view
   for whoever wants to see interest earned by the book this month
   regardless of what's actually been collected yet.)
   --------------------------------------------------------------------- */
async function computeMonthlyInterestAccrual(monthLabel){
  const loanAccounts = await db.getAll("loanAccounts");
  let accrued = 0, installmentCount = 0;
  for(const acc of loanAccounts){
    for(const inst of (acc.schedule||[])){
      if(inst.dueDate && inst.dueDate.slice(0,7)===monthLabel){
        accrued += inst.interestComponent;
        installmentCount++;
      }
    }
  }
  return { accrued, installmentCount };
}

async function renderInterestAccrualCard(){
  const monthLabel = session.accrualMonth || todayStr().slice(0,7);
  const { accrued, installmentCount } = await computeMonthlyInterestAccrual(monthLabel);
  const logs = (await db.getAll("auditLog")).filter(l=>l.action==="Month-End Interest Accrual Logged" && l.details.includes(monthLabel));
  return `

      <p class="sub">Accrual-basis memo — interest earned by the book for the selected month across all installments due in it, regardless of whether they've actually been collected yet. This is separate from Interest Income above, which is cash-basis (only counts what's actually been collected) — this card doesn't move any fund balance. There's no server to run this automatically at midnight on the last day of the month; run it manually here whenever you like for any month.</p>

}

/* ---------------------------------------------------------------------
   Cash Flow Statement — indirect method, simplified management view.
   For an NBFC, lending is the core business, so loan disbursements and
   collections are treated as Operating activity (not Investing, as they
   would be for a non-financial company) — consistent with how banks and
   NBFCs typically present this under Ind AS 7. This is a since-inception
   reconstruction from current records, not a true period-on-period
   statement (the app doesn't track opening/closing balances by period) —
   treat it as "how did we get to today's cash position," not a
   month/quarter-specific report.
   --------------------------------------------------------------------- */
async function renderCashFlowCard(){
  const acct = await computeAccountingSummary();
  const bankBorrowings = await db.getAll("bankBorrowings");
  const fixedAssets = await db.getAll("fixedAssets");

  const netLendingOutflow = acct.principalDisbursed - acct.principalCollected;
  const operatingCash = acct.interestIncome + acct.processingFeeIncome + acct.otherIncome - acct.operatingExpenses - netLendingOutflow;

  const fixedAssetsPurchased = fixedAssets.reduce((s,a)=>s+a.cost,0);
  const investingCash = -fixedAssetsPurchased;

  const capitalContributed = acct.fundAccounts.filter(a=>a.type==="Capital").reduce((s,a)=>s+a.balance,0);
  const borrowingsDrawn = bankBorrowings.filter(b=>b.affectsFundBalance).reduce((s,b)=>s+b.sanctionedAmount,0);
  const financingCash = capitalContributed + borrowingsDrawn;

  const netChange = operatingCash + investingCash + financingCash;

  const row = (label, value, bold)=>`<tr><td>${bold?`<b>${label}</b>`:label}</td><td style="text-align:right;">${bold?`<b>${fmtINR(Math.round(value))}</b>`:fmtINR(Math.round(value))}</td></tr>`;

  return `
    <div class="card">
      <h2 style="font-size:16px;">Cash Flow Statement</h2>
      <p class="sub">Indirect method. For an NBFC, loan disbursements and collections are treated as Operating activity, not Investing, since lending is the core business. This is reconstructed from current records since inception, not a fixed period like a month or quarter — it explains how the business arrived at today's cash position.</p>
      <div class="warn-banner" style="background:#FBF1DC;border-color:var(--gold);color:#5C4200;">⚠ Illustrative management view only — not a statutory Cash Flow Statement under Ind AS 7 / AS 3.</div>
      <table><tbody>
        <tr><td colspan="2"><b>Cash Flow from Operating Activities</b></td></tr>
        ${row("Interest Income Collected", acct.interestIncome)}
        ${row("Processing Fee Income", acct.processingFeeIncome)}
        ${row("Other Income", acct.otherIncome)}
        ${row("Operating Expenses", -acct.operatingExpenses)}
        ${row("Net Increase in Loan Portfolio (Disbursed − Collected)", -netLendingOutflow)}
        ${row("Net Cash from Operating Activities", operatingCash, true)}
        <tr><td colspan="2" style="padding-top:14px;"><b>Cash Flow from Investing Activities</b></td></tr>
        ${row("Fixed Assets Purchased", -fixedAssetsPurchased)}
        ${row("Net Cash used in Investing Activities", investingCash, true)}
        <tr><td colspan="2" style="padding-top:14px;"><b>Cash Flow from Financing Activities</b></td></tr>
        ${row("Capital Contributed", capitalContributed)}
        ${row("Borrowings Drawn (Term Loans)", borrowingsDrawn)}
        ${row("Net Cash from Financing Activities", financingCash, true)}
        <tr style="border-top:2px solid var(--navy-900);"><td style="padding-top:10px;"><b>Net Change in Cash</b></td><td style="text-align:right; padding-top:10px;"><b>${fmtINR(Math.round(netChange))}</b></td></tr>
        <tr><td>Cash &amp; Bank Balance (per Fund Management, for reference)</td><td style="text-align:right;">${fmtINR(Math.round(acct.cashBankBalance))}</td></tr>
      </tbody></table>
      <p class="small muted" style="margin-top:10px;">If Net Change in Cash doesn't closely match the actual Cash &amp; Bank Balance, it usually means a Fund Account balance was manually adjusted (Fund Management → Adjust Balance) outside a recorded transaction — same reconciliation note as the Trial Balance below.</p>
    </div>
  `;
}
