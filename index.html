/* =========================================================================
   Projections — 2-year forward P&L and Balance Sheet, built by applying
   your own growth/rate assumptions to the current Schedule III figures.
   This is a planning tool, not a forecast guarantee — every assumption
   is yours to set and revisit, and the numbers are only as good as those
   inputs. Route through management/board review before using this for
   anything external (a lender submission, an investor deck, etc.).
   ========================================================================= */
function defaultProjectionAssumptions(){
  return {
    id:"default",
    loanBookGrowthPct: 20, yieldOnAdvancesPct: 18, costOfFundsPct: 11,
    opexGrowthPct: 15, provisioningPct: 2, otherIncomeGrowthPct: 10,
    capitalInfusions: [0,0,0,0,0],
    updatedAt: null, updatedBy: null
  };
}
async function getProjectionAssumptions(){
  const a = (await db.get("projectionAssumptions","default")) || defaultProjectionAssumptions();
  if(!a.capitalInfusions){
    // Migrate from the earlier 2-year-only version of this feature.
    a.capitalInfusions = [a.capitalInfusionYear1||0, a.capitalInfusionYear2||0, 0, 0, 0];
  }
  while(a.capitalInfusions.length < 5) a.capitalInfusions.push(0);
  return a;
}

async function computeProjections(){
  const sch = await computeScheduleIIIFigures();
  const a = await getProjectionAssumptions();
  const bs0 = sch.balanceSheet, pl0 = sch.profitLoss;
  const numYears = 5;

  const prevOpexY0 = pl0.financeCosts + pl0.feesCommissionExpense + pl0.employeeBenefits + pl0.depreciation + pl0.otherExpenses;
  const current = { loans: bs0.grossLoans, interestIncome: pl0.interestIncome, otherIncome: pl0.otherIncome, totalIncome: pl0.totalIncome, opex: prevOpexY0, pbt: pl0.profitBeforeTax, capital: bs0.equityShareCapital, borrowings: bs0.totalBorrowings, otherEquity: bs0.otherEquity, totalAssets: bs0.totalAssets };

  const years = [];
  let prevLoans = bs0.grossLoans, prevOpex = prevOpexY0, prevOtherIncome = pl0.otherIncome, prevCapital = bs0.equityShareCapital, prevOtherEquity = bs0.otherEquity;
  const nonLoanAssets = bs0.totalFinancialAssets - bs0.grossLoans + bs0.totalNonFinancialAssets;

  for(let i=0; i<numYears; i++){
    const infusion = a.capitalInfusions[i] || 0;
    const loans = prevLoans * (1 + a.loanBookGrowthPct/100);
    const interestIncome = loans * (a.yieldOnAdvancesPct/100);
    const otherIncome = prevOtherIncome * (1 + a.otherIncomeGrowthPct/100);
    const totalIncome = interestIncome + otherIncome;
    const provisioning = loans * (a.provisioningPct/100);
    const opex = prevOpex * (1 + a.opexGrowthPct/100);
    const capital = prevCapital + infusion;
    const borrowings = Math.max(0, loans - (capital + prevOtherEquity));
    const financeCosts = borrowings * (a.costOfFundsPct/100);
    const totalExpenses = opex + provisioning + financeCosts;
    const pbt = totalIncome - totalExpenses;
    const otherEquity = prevOtherEquity + pbt;
    const totalAssets = loans + nonLoanAssets;

    years.push({ yearNum: i+1, loans, interestIncome, otherIncome, totalIncome, provisioning, opex, financeCosts, totalExpenses, pbt, capital, otherEquity, borrowings, totalAssets });
    prevLoans = loans; prevOpex = opex; prevOtherIncome = otherIncome; prevCapital = capital; prevOtherEquity = otherEquity;
  }

  return { assumptions: a, current, years };
}

const ALM_BUCKETS = [
  {label:"1–30 days", minDays:0, maxDays:30},
  {label:"31–90 days", minDays:31, maxDays:90},
  {label:"3–6 months", minDays:91, maxDays:182},
  {label:"6–12 months", minDays:183, maxDays:365},
  {label:"1–3 years", minDays:366, maxDays:1095},
  {label:"3–5 years", minDays:1096, maxDays:1825},
  {label:"Over 5 years", minDays:1826, maxDays:Infinity},
];
function daysFromToday(dateStr){
  return Math.round((new Date(dateStr) - new Date(todayStr())) / (1000*60*60*24));
}

async function computeTreasuryMetrics(){
  const [loanAccounts, bankBorrowings, staff, sanctions] = await Promise.all([
    db.getAll("loanAccounts"), db.getAll("bankBorrowings"), db.getAll("staff"), db.getAll("sanctions")
  ]);
  const acct = await computeAccountingSummary();

  // ALM: assets = future scheduled principal inflows; liabilities =
  // borrowings assumed to mature (bullet repayment) at sanctionDate +
  // tenureMonths — a simplification, since individual repayment
  // schedules for borrowings aren't tracked in this app.
  const assetBuckets = ALM_BUCKETS.map(b=>({...b, amount:0}));
  loanAccounts.filter(a=>a.status==="Active").forEach(acc=>{
    (acc.schedule||[]).filter(i=>i.status!=="Paid").forEach(inst=>{
      const d = Math.max(0, daysFromToday(inst.dueDate)); // overdue installments are treated as immediately due, not excluded
      const bucket = assetBuckets.find(b=>d>=b.minDays && d<=b.maxDays);
      if(bucket) bucket.amount += inst.principalComponent;
    });
  });
  const liabilityBuckets = ALM_BUCKETS.map(b=>({...b, amount:0}));
  bankBorrowings.filter(b=>b.status==="Active" && b.tenureMonths).forEach(b=>{
    const maturityDate = new Date(b.sanctionDate);
    maturityDate.setMonth(maturityDate.getMonth()+b.tenureMonths);
    const d = daysFromToday(maturityDate.toISOString().slice(0,10));
    const bucket = liabilityBuckets.find(x=>d>=x.minDays && d<=x.maxDays);
    if(bucket) bucket.amount += (b.affectsFundBalance ? b.sanctionedAmount : (b.utilizedAmount||0));
  });

  // Cost of funds & interest spread
  const totalBorrowings = bankBorrowings.filter(b=>b.status==="Active").reduce((s,b)=> s+(b.affectsFundBalance?b.sanctionedAmount:(b.utilizedAmount||0)), 0);
  const financeCosts = sumJournalByCategory(acct.journalEntries, ["Interest on Borrowings"]);
  const costOfFunds = totalBorrowings>0 ? (financeCosts/totalBorrowings)*100 : 0;
  const activeLoans = loanAccounts.filter(a=>a.status==="Active");
  const totalPortfolio = activeLoans.reduce((s,a)=>s+a.principalOutstanding,0);
  const yieldOnAdvances = totalPortfolio>0 ? (acct.interestIncome/totalPortfolio)*100 : 0;
  const interestSpread = yieldOnAdvances - costOfFunds;

  // Product-wise profitability: income allocated by each product's
  // share of the loan book, less its share of NPA provisioning.
  const byProduct = {};
  activeLoans.forEach(a=>{ byProduct[a.product] = byProduct[a.product] || {outstanding:0}; byProduct[a.product].outstanding += a.principalOutstanding; });
  Object.keys(byProduct).forEach(p=>{
    const share = totalPortfolio>0 ? byProduct[p].outstanding/totalPortfolio : 0;
    byProduct[p].allocatedIncome = acct.interestIncome*share;
    byProduct[p].allocatedProvisioning = acct.npaProvision*share;
    byProduct[p].netContribution = byProduct[p].allocatedIncome - byProduct[p].allocatedProvisioning;
  });

  // Branch-wise: approximated via the disbursing officer's branch —
  // this app doesn't tag a fixed branch code directly on the loan
  // account itself, so treat this as directional, not exact.
  const staffBranchByName = Object.fromEntries(staff.map(s=>[s.name, s.branch]));
  const byBranch = {};
  activeLoans.forEach(a=>{
    const branch = staffBranchByName[a.createdBy] || "Unassigned";
    byBranch[branch] = byBranch[branch] || {outstanding:0, count:0};
    byBranch[branch].outstanding += a.principalOutstanding;
    byBranch[branch].count += 1;
  });

  return { assetBuckets, liabilityBuckets, costOfFunds, yieldOnAdvances, interestSpread, byProduct, byBranch, totalBorrowings, totalPortfolio };
}

async function renderCashBankBookSection(categoryFilter, nameFilter){
  const accounts = (await db.getAll("chartOfAccounts")).filter(a=>a.active && a.name.includes(nameFilter));
  const vouchers = (await db.getAll("journalVouchers")).filter(v=>v.status==="Posted").sort((a,b)=>new Date(a.date)-new Date(b.date));
  const accountIds = new Set(accounts.map(a=>a.id));
  const rows = [];
  let runningBalance = 0;
  vouchers.forEach(v=>{
    v.lines.forEach(line=>{
      if(!accountIds.has(line.ledgerAccountId)) return;
      runningBalance += (line.debit||0) - (line.credit||0);
      rows.push({ date: v.date, voucherNumber: v.voucherNumber, narration: v.narration, debit: line.debit||0, credit: line.credit||0, balance: runningBalance });
    });
  });
  return `
    <div class="card">
      <h2 style="font-size:16px;">${nameFilter==="Cash in Hand" ? "Cash Book" : "Bank Book"}</h2>
      <p class="sub">Every posted voucher line touching a ${esc(nameFilter)} account, in date order, with a running balance.</p>
      <table>
        <thead><tr><th>Date</th><th>Voucher #</th><th>Narration</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead>
        <tbody>
        ${rows.length===0 ? `<tr class="empty-row"><td colspan="6">No postings yet.</td></tr>` :
          rows.map(r=>`<tr><td>${r.date}</td><td class="mono">${esc(r.voucherNumber)}</td><td>${esc(r.narration)}</td><td>${r.debit?fmtINR(r.debit):"—"}</td><td>${r.credit?fmtINR(r.credit):"—"}</td><td>${fmtINR(r.balance)}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

async function renderTrialBalanceFromGlSection(){
  const balances = await computeAllLedgerBalances();
  let totalDr = 0, totalCr = 0;
  const rows = balances.map(b=>{
    const showAsDr = b.account.normalBalance==="Debit" ? b.balance>=0 : b.balance<0;

/** System Health Check — Super Admin, on-demand. Checks the kinds of
 *  things that can silently go wrong in an app tracking money in more
 *  than one place: Funds vs General Ledger drift, Trial Balance status,
 *  and orphaned records (a payment pointing at a loan account that no
 *  longer exists, etc.). Deliberately on-demand rather than run on
 *  every page load, since it reads most of the database. */
/** Storage usage — this app has no separate file-storage product
 *  connected (see the Document Vault's own note about that); every
 *  document, including base64-encoded photos and uploaded files, lives
 *  directly inside Firestore documents. So "storage" here genuinely
 *  means Firestore's own storage, measured by summing the actual byte
 *  size of every document across every collection — not an estimate,
 *  a real measurement via each document's serialized size. */
async function computeStorageUsage(){
  const perCollection = [];
  let totalBytes = 0;
  for(const collectionName of ALL_COLLECTIONS){
    const records = await db.getAll(collectionName);
    let bytes = 0;
    records.forEach(r=>{ bytes += new Blob([JSON.stringify(r)]).size; });
    if(records.length>0){ perCollection.push({ name: collectionName, count: records.length, bytes }); totalBytes += bytes; }
  }
  perCollection.sort((a,b)=>b.bytes-a.bytes);
  return { perCollection, totalBytes };
}
function fmtBytes(bytes){
  if(bytes < 1024) return bytes+" B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+" KB";
  return (bytes/(1024*1024)).toFixed(2)+" MB";
}

async function renderStorageTab(){
  if(!session.storageUsageResult){
    return `
      <div class="card">
        <h2>Storage</h2>
        <p class="sub">This app has no separate file-storage product connected — every record, including uploaded documents and photos, lives directly inside Firestore. This measures actual Firestore storage by reading every collection and summing real document sizes, so it's run on demand rather than automatically.</p>
        <button class="btn btn-gold" id="btn-calculate-storage">Calculate Storage Usage</button>
      </div>
    `;
  }
  const s = session.storageUsageResult;
  // Firestore's free (Spark) tier includes 1 GiB of storage — the one
  // genuinely fixed reference point available. On the paid (Blaze)
  // plan there's no hard ceiling at all, just cost that scales with
  // usage — stated plainly rather than implying a cap that may not
  // actually apply to this project.
  const sparkLimitBytes = 1024*1024*1024;
  const pctOfSparkLimit = (s.totalBytes/sparkLimitBytes)*100;
  return `
    <div class="card">
      <div class="flex-between">
        <h2>Storage</h2>
        <button class="btn btn-outline btn-sm" id="btn-calculate-storage">Recalculate</button>
      </div>
      <p class="sub">Every record, including uploaded documents and photos, lives directly inside Firestore — there's no separate file-storage product connected. This is a real measurement, not an estimate.</p>
      <div class="grid grid-2">
        <div class="kpi"><div class="lbl">Total Used</div><div class="val" style="font-size:22px;">${fmtBytes(s.totalBytes)}</div></div>
        <div class="kpi"><div class="lbl">Total Documents</div><div class="val" style="font-size:22px;">${s.perCollection.reduce((sum,c)=>sum+c.count,0)}</div></div>
      </div>
      <div class="warn-banner" style="background:#FBF1DC;border-color:var(--gold);color:#5C4200; margin-top:14px;">
        ⚠ Firestore doesn't have a single fixed "disk size" the way a phone does, so "unused" isn't quite the right frame here. The one real reference point: Firestore's <b>free (Spark) plan includes 1 GiB total</b> — you're using approximately <b>${pctOfSparkLimit.toFixed(2)}%</b> of that if you're still on it. If you've since moved to the paid (Blaze) plan, there's no fixed ceiling at all — storage simply costs a small amount per GB used beyond its own free allowance, so "how much is left" isn't really a meaningful question on that plan.
      </div>
      <h3 class="section-h">By Collection (largest first)</h3>
      <table>
        <thead><tr><th>Collection</th><th>Documents</th><th>Size</th><th>% of Total</th></tr></thead>
        <tbody>
        ${s.perCollection.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.count}</td><td>${fmtBytes(c.bytes)}</td><td>${s.totalBytes>0?((c.bytes/s.totalBytes)*100).toFixed(1):'0'}%</td></tr>`).join("")}
        </tbody>
      </table>
      <p class="small muted" style="margin-top:8px;">Documents, KYC photos, and appraisal/recovery-visit photos (all stored as embedded data, not links) are typically the largest contributors — worth checking the Document Vault's own storage note if one particular collection looks unexpectedly large.</p>
    </div>
  `;

async function computeHealthCheck(){
  const [fundAccounts, glBalances, customers, loanAccounts, payments, sanctions, disbursements, appraisals, leads,
    journalEntries, journalVouchers, fixedAssets] = await Promise.all([
    db.getAll("fundAccounts"), computeAllLedgerBalances(), db.getAll("customers"), db.getAll("loanAccounts"),
    db.getAll("payments"), db.getAll("sanctions"), db.getAll("disbursements"), db.getAll("appraisals"), db.getAll("leads"),
    db.getAll("journalEntries"), db.getAll("journalVouchers"), db.getAll("fixedAssets")
  ]);

  // 1. Funds vs GL — the two systems should never drift on Cash/Bank,
  // since every real cash movement should post to both.
  const fundCashBank = fundAccounts.filter(a=>a.type==="Cash"||a.type==="Bank Account").reduce((s,a)=>s+a.balance,0);
  const glCash = glBalances.find(b=>b.account.name==="Cash in Hand");
  const glBank = glBalances.find(b=>b.account.name==="Bank Account — Operating");
  const glCashBank = (glCash?glCash.balance:0) + (glBank?glBank.balance:0);
  const fundsGlDrift = Math.round(fundCashBank - glCashBank);

  // 2. Trial Balance status
  let totalDr = 0, totalCr = 0;
  glBalances.forEach(b=>{
    const showAsDr = b.account.normalBalance==="Debit" ? b.balance>=0 : b.balance<0;
    if(showAsDr) totalDr += Math.abs(b.balance); else totalCr += Math.abs(b.balance);
  });
  const trialBalanced = Math.abs(totalDr-totalCr) < 1;

  // 3. Orphaned records — referential integrity
  const custIds = new Set(customers.map(c=>c.id));
  const loanIds = new Set(loanAccounts.map(a=>a.id));
  const sanctionIds = new Set(sanctions.map(s=>s.id));
  const orphans = [];
  loanAccounts.forEach(a=>{ if(!custIds.has(a.customerId)) orphans.push(`Loan account ${a.accountNumber||a.id} references a missing customer`); });
  payments.forEach(p=>{
    if(!loanIds.has(p.loanAccountId)) orphans.push(`Payment ${p.id} references a missing loan account`);
    if(!custIds.has(p.customerId)) orphans.push(`Payment ${p.id} references a missing customer`);
  });
  sanctions.forEach(s=>{ if(!custIds.has(s.customerId)) orphans.push(`Sanction ${s.id} references a missing customer`); });
  disbursements.forEach(d=>{ if(!sanctionIds.has(d.sanctionId)) orphans.push(`Disbursement ${d.id} references a missing sanction`); });
  appraisals.forEach(a=>{ if(!custIds.has(a.customerId)) orphans.push(`Appraisal ${a.id} references a missing customer`); });

  // 4. Interest/EMI schedule integrity — regenerate each active
  // account's schedule from its own stored terms (principal, rate,
  // tenure, disbursement date) and check it against what's actually
  // stored. A mismatch means either the terms were edited without
  // regenerating the schedule, or the stored schedule was hand-edited
  // — either way, worth knowing about specifically, not just trusting
  // the stored figures.
  const scheduleIssues = [];
  loanAccounts.filter(a=>a.status==="Active").forEach(acc=>{
    if(!acc.schedule || acc.schedule.length===0) return;
    const regen = generateEmiSchedule(acc);
    if(Math.abs(regen.emiAmount - acc.emiAmount) > 1){
      scheduleIssues.push(`${acc.accountNumber||acc.id}: stored EMI ${fmtINR(acc.emiAmount)} vs recalculated ${fmtINR(regen.emiAmount)} from its own terms — schedule may be stale`);
    }
    const lastInst = acc.schedule[acc.schedule.length-1];
    if(lastInst && lastInst.outstandingAfter !== undefined && Math.abs(lastInst.outstandingAfter) > 1){
      scheduleIssues.push(`${acc.accountNumber||acc.id}: schedule doesn't fully amortize to zero (₹${fmtINR(lastInst.outstandingAfter)} left at final installment)`);
    }
  });

  // 5. NPA Provisioning currency — is the GL's provision balance
  // actually in step with what the live DPD classification currently
  // requires, or has the portfolio moved since the last "post/release"?
  const acct = await computeAccountingSummary();
  const requiredProvisioning = Math.round(acct.npaProvision);
  const provisionBalance = glBalances.find(b=>b.account.name==="Provision for NPA / Impairment Allowance");
  const postedProvisioning = Math.round(provisionBalance ? provisionBalance.balance : 0);
  const provisioningGap = requiredProvisioning - postedProvisioning;

  // 6. Depreciation currency — same idea, for Fixed Assets.
  let unpostedDepreciation = 0;
  fixedAssets.filter(a=>a.status==="Active").forEach(a=>{
    const { accumulatedDepreciation } = computeAssetBookValue(a);
    unpostedDepreciation += Math.max(0, accumulatedDepreciation - (a.lastDepreciationPostedValue||0));
  });

  // 7. Pending approvals — with aging, not just a raw count, so a
  // stuck item is actually visible rather than buried in a number.
  const pendingItems = [
    ...sanctions.filter(s=>s.status==="Pending Approval").map(s=>({label:`Sanction — ${s.product}`, ageDays: daysSince(s.createdAt)})),
    ...journalEntries.filter(j=>j.status==="Pending Approval").map(j=>({label:`Journal Entry — ${j.category}`, ageDays: daysSince(j.createdAt)})),
    ...journalVouchers.filter(v=>v.status==="Pending Approval").map(v=>({label:`GL Voucher — ${v.narration}`, ageDays: daysSince(v.createdAt)})),
  ].sort((a,b)=>b.ageDays-a.ageDays);

  // 8. Snapshot
  const activeLoanAccounts = loanAccounts.filter(a=>a.status==="Active");

  return {
    fundCashBank, glCashBank, fundsGlDrift,
    totalDr, totalCr, trialBalanced,
    orphans, scheduleIssues,
    requiredProvisioning, postedProvisioning, provisioningGap,
    unpostedDepreciation,
    pendingItems,
    snapshot: {
      customers: customers.length, activeLoans: activeLoanAccounts.length,
      portfolioOutstanding: activeLoanAccounts.reduce((s,a)=>s+a.principalOutstanding,0),
      openLeads: leads.filter(l=>!["Rejected","Converted into Loan Application"].includes(l.status)).length,
      pendingApprovals: pendingItems.length
    }
  };
}

  if(sub==="borrower") body = await renderBorrowerStatementLookup();
  else if(sub==="pl") body = await renderPeriodPLSection();
  else if(sub==="bs") body = await renderPeriodBalanceSheetSection();

  return `
    <div class="card">
      <h2>Statements</h2>
      <p class="sub">A borrower's own account statement, or the Profit &amp; Loss / Balance Sheet for any period you choose — computed directly from the General Ledger's actual dated postings, not just today's live snapshot the way Financial Statements elsewhere in the app always shows.</p>
      <div class="tabs" style="margin-bottom:0; border-bottom:none;">
        ${subTabs.map(t=>`<button class="tab ${sub===t.id?'active':''}" data-stmttab="${t.id}">${t.label}</button>`).join("")}
      </div>
    </div>
    ${body}
  `;
}

async function renderBorrowerStatementLookup(){
  const query = (session.statementSearchQuery||"").trim().toLowerCase();
  let results = [];
  if(query.length>=2){
    const [customers, loanAccounts] = await Promise.all([db.getAll("customers"), db.getAll("loanAccounts")]);
    loanAccounts.forEach(a=>{
      const cust = customers.find(c=>c.id===a.customerId);
      const haystack = `${cust?cust.personal.name:''} ${cust?cust.personal.mobile:''} ${a.accountNumber||''}`.toLowerCase();
      if(haystack.includes(query)) results.push({ account: a, customerName: cust?cust.personal.name:'—' });
    });
  }
  return `
    <div class="card">
      <h2 style="font-size:16px;">Find a Borrower's Loan Account</h2>
      <div class="field" style="max-width:400px;"><label>Search by name, mobile, or account number</label><input id="statement-search-input" value="${esc(session.statementSearchQuery||'')}" placeholder="e.g. Ramesh, 9876543210, LN2026..."></div>
      ${query.length<2 ? `<p class="small muted">Type at least 2 characters to search.</p>` :
        results.length===0 ? `<p class="small muted">No matching loan accounts.</p>` :
        `<table>
          <thead><tr><th>Customer</th><th>Account #</th><th>Product</th><th>Status</th><th>Outstanding</th><th></th></tr></thead>
          <tbody>
          ${results.map(r=>`<tr><td>${esc(r.customerName)}</td><td class="mono">${esc(r.account.accountNumber)}</td><td>${esc(r.account.product)}</td><td>${esc(r.account.status)}</td><td>${fmtINR(r.account.principalOutstanding)}</td>
            <td><button class="btn btn-gold btn-sm generate-statement-lookup-btn" data-loan="${r.account.id}">Statement</button></td></tr>`).join("")}
          </tbody>
        </table>`}
    </div>
  `;
}

          ${rowN("Borrowings (balancing funding need)", proj.current.borrowings, y=>y.borrowings)}

        <tbody>
        ${journalSorted.length===0 ? `<tr class="empty-row"><td colspan="9">No journal entries yet.</td></tr>` :

            let actions = "";
            if(status==="Pending Approval"){
              const canApprove = (DELEGATION_ROLES.includes(session.user.role) || session.user.role==="Super Admin") && session.user.name !== j.proposedBy;
              const withinLimit = session.user.role==="Super Admin" || getJournalLimitForRole(policy, session.user.role) >= j.amount;
              if(canApprove && withinLimit){
                actions = `<div class="action-row"><button class="btn btn-outline btn-sm approve-journal-btn" data-entry="${j.id}">Approve</button><button class="btn btn-danger btn-sm reject-journal-btn" data-entry="${j.id}">Reject</button></div>`;
              } else if(canApprove && !withinLimit){
                actions = `<span class="small muted">Exceeds your limit</span>`;
              } else {
                actions = `<span class="small muted">Awaiting a different officer</span>`;
              }

            return `<tr><td>${esc(j.date)}</td><td>${j.type==='Income'?`<span class="badge badge-approved">Income</span>`:`<span class="badge badge-rejected">Expense</span>`}</td><td>${esc(j.category)}</td><td>${esc(j.description)||"—"}</td><td>${fmtINR(j.amount)}</td><td>${esc(j.mode)||"—"}</td><td>${esc(j.fundAccountName)}</td><td>${statusBadgeHtml}</td><td>${actions}</td></tr>`;

    <div class="card">

          <tr><td>Processing Fee Income</td><td style="text-align:right;">${fmtINR(Math.round(acct.processingFeeIncome))}</td></tr>
          <tr><td>Other Income</td><td style="text-align:right;">${fmtINR(Math.round(acct.otherIncome))}</td></tr>
          <tr><td><b>Total Income</b></td><td style="text-align:right;"><b>${fmtINR(Math.round(acct.totalIncome))}</b></td></tr>

    <div class="card">
      <h2 style="font-size:16px;">Balance Sheet (Simplified Management View)</h2>
      <div class="grid grid-2">
        <div>
          <h3 class="section-h">Assets</h3>

            <tr><td><b>Total Assets</b></td><td style="text-align:right;"><b>${fmtINR(Math.round(acct.cashBankBalance+acct.portfolioOutstanding))}</b></td></tr>
          </tbody></table>
        </div>
        <div>
          <h3 class="section-h">Capital &amp; Liabilities</h3>
          <table><tbody>
            ${acct.fundAccounts.map(a=>`<tr><td>${esc(a.name)} (${esc(a.type)})</td><td style="text-align:right;">${fmtINR(a.balance)}</td></tr>`).join("")}
            <tr><td><b>Total</b></td><td style="text-align:right;"><b>${fmtINR(Math.round(acct.fundAccounts.reduce((s,a)=>s+a.balance,0)))}</b></td></tr>
          </tbody></table>
        </div>
      </div>
      <p class="small muted" style="margin-top:10px;">Illustrative management view only — not a statutory Balance Sheet or Schedule III format.</p>
    </div>

    ${await renderCashFlowCard()}

    ${await renderInterestAccrualCard()}

    ${await renderFixedAssetsCard()}

    <div class="card">
      <h2 style="font-size:16px;">Trial Balance</h2>
      <p class="sub">This is a browser app with no backend server, so there's no literal midnight batch job — instead these figures are always live, recalculated fresh every time you open this tab, for whatever "today" is. That's arguably more useful than a fixed daily run, but note it currently reflects the position as of now, not a specific past date.</p>
      ${(()=>{
        const capital = acct.fundAccounts.filter(a=>a.type==="Capital").reduce((s,a)=>s+a.balance,0);
        const borrowings = acct.fundAccounts.filter(a=>a.type==="Borrowing").reduce((s,a)=>s+a.balance,0);
        const otherFunds = acct.fundAccounts.filter(a=>!["Capital","Borrowing"].includes(a.type)).reduce((s,a)=>s+a.balance,0);
        const totalDr = acct.cashBankBalance + acct.portfolioOutstanding;
        const knownCr = capital + borrowings + otherFunds + acct.npaProvision;
        const plug = totalDr - knownCr;
        return `
        <div class="grid grid-2">
          <div>
            <h3 class="section-h">Debit</h3>
            <table><tbody>
              <tr><td>Loan Portfolio Outstanding</td><td style="text-align:right;">${fmtINR(Math.round(acct.portfolioOutstanding))}</td></tr>
              <tr><td>Cash &amp; Bank Balance</td><td style="text-align:right;">${fmtINR(Math.round(acct.cashBankBalance))}</td></tr>
              <tr><td><b>Total Debit</b></td><td style="text-align:right;"><b>${fmtINR(Math.round(totalDr))}</b></td></tr>
            </tbody></table>
          </div>
          <div>
            <h3 class="section-h">Credit</h3>
            <table><tbody>
              <tr><td>Capital</td><td style="text-align:right;">${fmtINR(Math.round(capital))}</td></tr>
              <tr><td>Borrowings</td><td style="text-align:right;">${fmtINR(Math.round(borrowings))}</td></tr>
              ${otherFunds ? `<tr><td>Other Fund Sources</td><td style="text-align:right;">${fmtINR(Math.round(otherFunds))}</td></tr>` : ""}
              <tr><td>Provision for NPA</td><td style="text-align:right;">${fmtINR(Math.round(acct.npaProvision))}</td></tr>
              <tr><td>Accumulated Surplus/Deficit <span class="small muted">(balancing figure)</span></td><td style="text-align:right;">${fmtINR(Math.round(plug))}</td></tr>
              <tr><td><b>Total Credit</b></td><td style="text-align:right;"><b>${fmtINR(Math.round(knownCr+plug))}</b></td></tr>
            </tbody></table>
          </div>
        </div>
        <p class="small muted" style="margin-top:10px;">The Accumulated Surplus/Deficit line is a balancing figure, not a separately tracked account — cross-check it against Net Surplus on the Income Statement above (${fmtINR(Math.round(acct.netSurplus))}). A large, unexplained gap between the two usually means a Fund Account balance was adjusted manually (Fund Management → Adjust Balance) outside a recorded transaction — worth investigating before you rely on this Trial Balance. This is a simplified single-entry-derived Trial Balance for MIS purposes, not a substitute for your statutory books of account.</p>
        `;
      })()}
    </div>

    <div class="card">
      <div class="flex-between">
        <div><h2 style="font-size:16px;">Export to Tally</h2><p class="sub" style="margin-bottom:0;">Downloads a CSV of ledger entries in a Tally-importable column layout (Date, Voucher Type, Ledger, Amount). True Tally XML integration needs your Tally version's exact schema — validate with your accountant before import.</p></div>
        <button class="btn btn-gold btn-sm" id="btn-export-tally">Export CSV</button>
      </div>
    </div>
  `;
}

async function renderRatiosComplianceTab(){
  const r = await computeFinancialRatios();
  const complianceItems = await db.getAll("complianceItems");
  const byCategory = {};
  complianceItems.forEach(c=>{ byCategory[c.category] = byCategory[c.category]||[]; byCategory[c.category].push(c); });
  const doneCount = complianceItems.filter(c=>c.status==="Done").length;

  const ratioCard = (label, value, opts={})=>`
    <div class="kpi" ${opts.proxy?'style="border-top-color:var(--warn);"':''}>
      <div class="lbl">${label}${opts.proxy?' <span class="small" style="color:var(--warn);">(proxy)</span>':''}</div>
      <div class="val" style="font-size:18px;">${value}</div>
    </div>`;

  return `
    <div class="card">
      <h2>Ratios &amp; Compliance</h2>
      <p class="sub">Ratios below are split into two groups. The first are computed directly and reliably from your data. The second — marked "(proxy)" — approximate a real prudential ratio this app cannot fully calculate; never use those for actual regulatory reporting.</p>

      <h3 class="section-h">Portfolio &amp; Provisioning Ratios</h3>
      <div class="grid grid-4">
        ${ratioCard("Gross NPA Ratio", r.grossNpaRatio.toFixed(2)+"%")}
        ${ratioCard("Net NPA Ratio", r.netNpaRatio.toFixed(2)+"%")}
        ${ratioCard("Provisioning Coverage Ratio", r.provisioningCoverageRatio.toFixed(1)+"%")}
        ${ratioCard("Portfolio at Risk (PAR)", r.par.toFixed(1)+"%")}
      </div>

      <h3 class="section-h">Profitability &amp; Structure</h3>
      <div class="grid grid-4">
        ${ratioCard("Collection Efficiency", r.collectionEfficiency.toFixed(1)+"%")}
        ${ratioCard("Return on Assets", r.returnOnAssets.toFixed(2)+"%")}
        ${ratioCard("Yield on Advances", r.yieldOnAdvances.toFixed(1)+"%")}
        ${ratioCard("Debt-to-Equity", r.debtToEquity===null?"—":r.debtToEquity.toFixed(2)+"x")}
      </div>

      <h3 class="section-h">Capital Adequacy</h3>
      <div class="warn-banner" style="background:#FBE7E8;border-color:var(--danger);color:#7A1F27;">
        ⚠ "Capital Adequacy Proxy" below is <b>not</b> the statutory CRAR. Real CRAR requires Tier I/Tier II capital classification and risk-weighted assets per RBI's Scale Based Regulation matrix — this app doesn't track either. It assumes a flat 100% risk weight on the loan book and treats every "Capital"-type Fund Source as capital. Never use this figure for a regulatory filing or a lending decision — get your statutory auditor to compute the real CRAR.
      </div>
      <div class="grid grid-3">
        ${ratioCard("Capital Adequacy Proxy", r.capitalAdequacyProxy===null?"—":r.capitalAdequacyProxy.toFixed(1)+"%", {proxy:true})}
        <div class="kpi"><div class="lbl">Capital (Fund Sources typed Capital)</div><div class="val" style="font-size:18px;">${fmtINR(Math.round(r.capital))}</div></div>
        <div class="kpi"><div class="lbl">Borrowings (Fund Sources typed Borrowing)</div><div class="val" style="font-size:18px;">${fmtINR(Math.round(r.borrowings))}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="flex-between">
        <div><h2 style="font-size:16px;">Compliance Checklist</h2><p class="sub" style="margin-bottom:0;">A self-tracking checklist for your team — not a regulatory filing system and not legal advice. Each item is a prompt to verify with your Company Secretary, statutory auditor, or legal counsel; marking something "Done" here has no effect outside this app.</p></div>
        <div class="action-row">
          <span class="badge badge-approved">${doneCount}/${complianceItems.length} Done</span>
          ${session.user.role==="Super Admin" ? `<button class="btn btn-outline btn-sm" id="btn-dedupe-compliance">Remove Duplicates</button>` : ""}
        </div>
      </div>
      ${Object.entries(byCategory).map(([cat, items])=>`
        <h3 class="section-h">${esc(cat)}</h3>
        <table>
          <thead><tr><th>Item</th><th>Status</th><th>Notes</th><th>Updated</th></tr></thead>
          <tbody>
          ${items.map(c=>`
            <tr>
              <td style="max-width:260px;">${esc(c.item)}</td>
              <td>
                <select class="compliance-status-select" data-item="${c.id}" style="padding:5px 8px; border-radius:6px; border:1px solid var(--line); font-size:12.5px;">
                  ${COMPLIANCE_STATUSES.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join("")}
                </select>
              </td>
              <td><input class="compliance-notes-input" data-item="${c.id}" value="${esc(c.notes)}" placeholder="Notes / evidence reference" style="font-size:12.5px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; width:100%;"></td>
              <td class="small muted">${c.updatedAt ? fmtDate(c.updatedAt) : "—"}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      `).join("")}
    </div>

    ${await renderRbiReturnsSection()}

    ${await renderDocumentRegisterSection()}

    ${await renderRcmSection()}

    ${await renderAuditObservationsSection()}

    ${await renderRbiInspectionSection()}

    ${await renderStrCtrSection()}
  `;
}

/** Pulls together the figures already computed elsewhere in the app
 *  into a readable data summary relevant to preparing an RBI return —
 *  NOT a completed XBRL filing (this app doesn't replicate RBI's exact
 *  taxonomy schemas), but enough for whoever prepares the actual portal
 *  submission to work from real numbers instead of starting blank. */
async function generateReturnSummaryText(filing){
  const nbfc = await getNbfcProfile();
  const sch = await computeScheduleIIIFigures();
  const acct = await computeAccountingSummary();
  const sanctions = await db.getAll("sanctions");
  const largeExposures = [];
  const byCustomer = {};
  sanctions.filter(s=>s.status==="Approved").forEach(s=>{ byCustomer[s.customerId] = (byCustomer[s.customerId]||0) + s.sanctionedAmount; });
  const customers = await db.getAll("customers");
  Object.entries(byCustomer).forEach(([custId, exposure])=>{
    if(exposure >= 5000000){ // ₹5 Cr — CRILC large exposure threshold
      const cust = customers.find(c=>c.id===custId);
      largeExposures.push(`  - ${cust?cust.personal.name:custId}: ${fmtINR(exposure)}`);
    }
  });

  const lines = [
    `${nbfc.name || "(NBFC name not set — fill in NBFC Profile)"}`,
    nbfc.registrationNumber ? `RBI Registration No: ${nbfc.registrationNumber}` : "",
    `Data summary prepared for: ${filing.code} — ${filing.period}`,
    `As of: ${todayStr()}`,
    ``,
    `--- Balance Sheet Summary (Schedule III basis) ---`,
    `Total Assets: ${fmtINR(Math.round(sch.balanceSheet.totalAssets))}`,
    `Gross Loans: ${fmtINR(Math.round(sch.balanceSheet.grossLoans))}`,
    `Net Loans (after impairment): ${fmtINR(Math.round(sch.balanceSheet.netLoans))}`,
    `Total Borrowings: ${fmtINR(Math.round(sch.balanceSheet.totalBorrowings))}`,
    `Equity Share Capital: ${fmtINR(Math.round(sch.balanceSheet.equityShareCapital))}`,
    `Total Equity: ${fmtINR(Math.round(sch.balanceSheet.totalEquity))}`,
    ``,
    `--- P&L Summary ---`,
    `Total Income: ${fmtINR(Math.round(sch.profitLoss.totalIncome))}`,
    `Total Expenses: ${fmtINR(Math.round(sch.profitLoss.totalExpenses))}`,
    `Profit Before Tax: ${fmtINR(Math.round(sch.profitLoss.profitBeforeTax))}`,
    ``,
    `--- NPA / Provisioning ---`,
    `Impairment Allowance / NPA Provisioning: ${fmtINR(Math.round(acct.npaProvision))}`,
    ``,
    largeExposures.length>0 ? `--- Large Exposures (≥ ₹5 Cr, CRILC threshold reference) ---\n${largeExposures.join("\n")}` : `--- Large Exposures ---\nNone above ₹5 Cr threshold.`,
    ``,
    `⚠ This is a data preparation summary from internally recorded figures, not a completed or verified RBI return. Cross-check every figure against your books and the exact schema required for ${filing.code} before using it for any filing.`
  ].filter(Boolean);
  return lines.join("\n");
}

async function buildReport(reportId){
  const customers = await db.getAll("customers");
  const custName = (id)=>{ const c=customers.find(c=>c.id===id); return c?c.personal.name:"—"; };
  const loanAccounts = await db.getAll("loanAccounts");
  const products = await db.getAll("products");
  const productMap = {}; products.forEach(p=>productMap[p.name]=p);
  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const payments = await db.getAll("payments");
  const staff = await db.getAll("staff");

  if(reportId==="loan-register"){
    return { headers:["Customer","Product","Principal","Rate","Tenure","Outstanding","Status"],
      rows: loanAccounts.map(a=>[custName(a.customerId), a.product, fmtINR(a.principal), a.interestRate+"%", a.tenureMonths+" mo", fmtINR(a.principalOutstanding), a.status]) };
  }
  if(reportId==="disbursement-register"){
    const disbursements = await db.getAll("disbursements");
    return { headers:["Date","Customer","Amount","Mode","UTR","Fund Account"],
      rows: disbursements.map(d=>[d.date, custName(d.customerId), fmtINR(d.amount), d.mode, d.utr||"—", d.fundAccountName||"—"]) };
  }
  if(reportId==="recovery-register"){
    const visits = await db.getAll("recoveryVisits");
    return { headers:["Date","Customer","Officer","Remarks","Promise to Pay","Next Visit"],
      rows: visits.map(v=>[v.visitDate, custName(v.customerId), v.officer, v.borrowerRemarks||"—", v.promiseToPayAmount?fmtINR(v.promiseToPayAmount)+" by "+v.promiseToPayDate:"—", v.nextVisitDate||"—"]) };
  }
  if(reportId==="overdue-report" || reportId==="npa-report" || reportId==="ageing-report"){
    const analyzed = loanAccounts.filter(a=>a.status==="Active").map(a=>({acc:a, ...analyzeLoanAccount(a, productMap, policy)}));
    if(reportId==="ageing-report"){
      const buckets = {};
      DPD_BANDS.forEach(b=>buckets[b.label]={count:0, amount:0});
      analyzed.forEach(r=>{ buckets[r.classification].count++; buckets[r.classification].amount += r.acc.principalOutstanding; });
      return { headers:["Classification","Accounts","Outstanding Amount"], rows: Object.entries(buckets).map(([k,v])=>[k, v.count, fmtINR(v.amount)]) };
    }
    const filtered = reportId==="npa-report" ? analyzed.filter(r=>NPA_CLASSES.includes(r.classification)) : analyzed.filter(r=>r.dpd>0);
    return { headers:["Customer","Product","DPD","Classification","Overdue Amount","Provisioning","Recovery Officer","Recovery Status"],
      rows: filtered.map(r=>[custName(r.acc.customerId), r.acc.product, r.dpd, r.classification, fmtINR(r.overdueAmount), fmtINR(Math.round(r.provisioningAmount)), r.acc.recoveryOfficer||"—", r.acc.recoveryStatus||"—"]) };
  }
  if(reportId==="product-wise"){
    const byProduct = {};
    loanAccounts.forEach(a=>{ byProduct[a.product] = byProduct[a.product] || {count:0, principal:0, outstanding:0}; byProduct[a.product].count++; byProduct[a.product].principal += a.principal; byProduct[a.product].outstanding += a.principalOutstanding; });
    return { headers:["Product","Accounts","Total Principal","Outstanding"], rows: Object.entries(byProduct).map(([k,v])=>[k, v.count, fmtINR(v.principal), fmtINR(v.outstanding)]) };
  }
  if(reportId==="officer-wise"){
    const byOfficer = {};
    payments.forEach(p=>{ byOfficer[p.collectedBy] = byOfficer[p.collectedBy] || {count:0, amount:0}; byOfficer[p.collectedBy].count++; byOfficer[p.collectedBy].amount += p.amount; });
    return { headers:["Officer","Collections Count","Amount Collected"], rows: Object.entries(byOfficer).map(([k,v])=>[k, v.count, fmtINR(v.amount)]) };
  }
  if(reportId==="staff-productivity"){
    const appraisals = await db.getAll("appraisals");
    const sanctions = await db.getAll("sanctions");
    const byStaff = {};
    staff.forEach(s=>{ byStaff[s.name] = {appraisals:0, sanctions:0, disbursements:0, collections:0, collectionAmount:0}; });
    appraisals.forEach(a=>{ if(byStaff[a.officerName]) byStaff[a.officerName].appraisals++; });
    sanctions.filter(s=>s.status==="Approved").forEach(s=>{ if(byStaff[s.approvedBy]) byStaff[s.approvedBy].sanctions++; });
    loanAccounts.forEach(a=>{ if(byStaff[a.createdBy]) byStaff[a.createdBy].disbursements++; });
    payments.forEach(p=>{ if(byStaff[p.collectedBy]){ byStaff[p.collectedBy].collections++; byStaff[p.collectedBy].collectionAmount += p.amount; } });
    return { headers:["Staff","Appraisals Done","Sanctions Approved","Disbursements Processed","Collections Made","Amount Collected"],
      rows: Object.entries(byStaff).filter(([k,v])=>v.appraisals+v.sanctions+v.disbursements+v.collections>0).map(([k,v])=>[k, v.appraisals, v.sanctions, v.disbursements, v.collections, fmtINR(v.collectionAmount)]) };
  }
  if(reportId==="dsa-performance"){
    const dsaAgents = await db.getAll("dsaAgents");
    const leads = await db.getAll("leads");
    const dsaCommissions = await db.getAll("dsaCommissions");
    return { headers:["DSA","Leads Sourced","Loans Disbursed","Commission Accrued","Commission Paid"],
      rows: dsaAgents.map(d=>{
        const leadsSourced = leads.filter(l=>l.dsaId===d.id).length;
        // Commission accrues exactly once per disbursement tied to this
        // DSA, so its count is an accurate stand-in for loans disbursed.
        const commissions = dsaCommissions.filter(c=>c.dsaId===d.id);
        const accrued = commissions.reduce((s,c)=>s+c.commissionAmount,0);
        const paid = commissions.filter(c=>c.status==="Paid").reduce((s,c)=>s+c.commissionAmount,0);
        return [d.name, leadsSourced, commissions.length, fmtINR(accrued), fmtINR(paid)];
      }) };
  }
  if(reportId==="branch-performance"){
    const staffBranchByName = Object.fromEntries(staff.map(s=>[s.name, s.branch]));
    const byBranch = {};
    loanAccounts.filter(a=>a.status==="Active").forEach(a=>{
      const branch = staffBranchByName[a.createdBy] || "Unassigned";
      byBranch[branch] = byBranch[branch] || {count:0, outstanding:0, overdue:0};
      byBranch[branch].count++; byBranch[branch].outstanding += a.principalOutstanding;
      if(computeDPD(a)>0) byBranch[branch].overdue += a.principalOutstanding;
    });
    return { headers:["Branch (approximated)","Active Accounts","Outstanding","Overdue Amount"],
      rows: Object.entries(byBranch).map(([k,v])=>[k, v.count, fmtINR(v.outstanding), fmtINR(v.overdue)]) };
  }
  if(reportId==="daily-mis"){
    const day = session.reportDate || todayStr();
    const leads = await db.getAll("leads");
    const newLeadsCount = leads.filter(l=>(l.createdAt||"").slice(0,10)===day).length;
    const disbursedCount = loanAccounts.filter(a=>a.disbursedDate===day).length;
    const disbursedAmount = loanAccounts.filter(a=>a.disbursedDate===day).reduce((s,a)=>s+a.principal,0);
    const collectedAmount = payments.filter(p=>p.date===day).reduce((s,p)=>s+p.amount,0);
    const collectedCount = payments.filter(p=>p.date===day).length;
    return { headers:["Metric","Value"], rows: [
      ["Date", day],
      ["New Applications", newLeadsCount],
      ["Loans Disbursed", disbursedCount],
      ["Amount Disbursed", fmtINR(disbursedAmount)],
      ["EMIs Collected", collectedCount],
      ["Amount Collected", fmtINR(collectedAmount)],
    ]};
  }
  if(reportId==="monthly-mis"){
    const month = session.reportMonth || todayStr().slice(0,7);
    const leads = await db.getAll("leads");
    const newLeadsCount = leads.filter(l=>(l.createdAt||"").slice(0,7)===month).length;
    const disbursedInMonth = loanAccounts.filter(a=>(a.disbursedDate||"").slice(0,7)===month);
    const collectedInMonth = payments.filter(p=>(p.date||"").slice(0,7)===month);
    const acct = await computeAccountingSummary();
    return { headers:["Metric","Value"], rows: [
      ["Month", month],
      ["New Applications", newLeadsCount],
      ["Loans Disbursed", disbursedInMonth.length],
      ["Amount Disbursed", fmtINR(disbursedInMonth.reduce((s,a)=>s+a.principal,0))],
      ["EMIs Collected", collectedInMonth.length],
      ["Amount Collected", fmtINR(collectedInMonth.reduce((s,p)=>s+p.amount,0))],
      ["Portfolio Outstanding (current)", fmtINR(acct.portfolioOutstanding)],
      ["NPA Provisioning (current)", fmtINR(Math.round(acct.npaProvision))],
    ]};
  }
  if(reportId==="daily-collection"){
    const byDate = {};
    payments.forEach(p=>{ byDate[p.date] = (byDate[p.date]||0) + p.amount; });
    return { headers:["Date","Amount Collected"], rows: Object.entries(byDate).sort((a,b)=>a[0]<b[0]?1:-1).map(([k,v])=>[k,fmtINR(v)]) };
  }
  if(reportId==="income-report"){
    const acct = await computeAccountingSummary();
    return { headers:["Head","Amount"], rows: [
      ["Interest Income", fmtINR(Math.round(acct.interestIncome))],
      ["Processing Fee Income", fmtINR(Math.round(acct.processingFeeIncome))],
      ["Total Income", fmtINR(Math.round(acct.totalIncome))],
      ["NPA Provisioning", fmtINR(Math.round(acct.npaProvision))],
      ["Net Surplus", fmtINR(Math.round(acct.netSurplus))],
    ]};
  }
  if(reportId==="fund-liquidity"){
    const fundPos = await computeFundPosition();
    return { headers:["Fund Source","Type","Balance"], rows: fundPos.accounts.map(a=>[a.name, a.type, fmtINR(a.balance)]).concat([["Available Funds","—",fmtINR(fundPos.available)],["Committed Funds","—",fmtINR(fundPos.committed)]]) };
  }
  if(reportId==="vintage-analysis"){
    const byMonth = {};
    loanAccounts.forEach(a=>{
      const month = (a.disbursedDate||"").slice(0,7);
      if(!month) return;
      byMonth[month] = byMonth[month] || {count:0, disbursed:0, outstanding:0, npaAmount:0};
      byMonth[month].count++;
      byMonth[month].disbursed += a.principal;
      byMonth[month].outstanding += a.principalOutstanding;
      if(a.status==="Active" && NPA_CLASSES.includes(classifyDPD(computeDPD(a)))) byMonth[month].npaAmount += a.principalOutstanding;
    });
    return { headers:["Vintage (Disbursement Month)","Loans","Disbursed","Outstanding Today","NPA Amount","NPA % of Cohort"],
      rows: Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0])).map(([month,d])=>[
        month, d.count, fmtINR(d.disbursed), fmtINR(Math.round(d.outstanding)), fmtINR(Math.round(d.npaAmount)),
        d.disbursed>0 ? (d.npaAmount/d.disbursed*100).toFixed(1)+"%" : "0%"
      ]) };
  }
  if(reportId==="dpd-migration"){
    const snapshots = await db.getAll("dpdSnapshots");
    const months = [...new Set(snapshots.map(s=>s.snapshotMonth))].sort();
    if(months.length<2){
      return { headers:["Status"], rows: [[`Only ${months.length} snapshot(s) captured so far — need at least 2 different months to show migration. Use "Capture This Month's Snapshot" above, then check back next month.`]] };
    }
    const prevMonth = months[months.length-2], currMonth = months[months.length-1];
    const prevByAccount = Object.fromEntries(snapshots.filter(s=>s.snapshotMonth===prevMonth).map(s=>[s.loanAccountId, s.classification]));
    const currByAccount = Object.fromEntries(snapshots.filter(s=>s.snapshotMonth===currMonth).map(s=>[s.loanAccountId, s.classification]));
    const matrix = {};
    Object.keys(prevByAccount).forEach(accId=>{
      const from = prevByAccount[accId], to = currByAccount[accId];
      if(!to) return; // account closed/no longer active
      const key = `${from} → ${to}`;
      matrix[key] = (matrix[key]||0) + 1;
    });
    return { headers:[`${prevMonth} → ${currMonth}`,"Accounts"], rows: Object.entries(matrix).sort((a,b)=>b[1]-a[1]) };
  }
  if(reportId==="dro-statement"){
    const reportDate = session.droReportDate || todayStr();
    // Cumulative from inception — every installment (any account, active
    // or closed) that fell due on or before the report date, regardless
    // of when it was actually paid. Recovery = what's actually been
    // paid against those SAME installments as of today, even if paid
    // late — this naturally captures all pending demand without
    // needing a start date, since anything still unpaid from any
    // earlier period keeps showing up as overdue until it's cleared.
    const byProduct = {};
    let totalDemand = 0, totalRecovery = 0;
    loanAccounts.forEach(acc=>{
      (acc.schedule||[]).forEach(inst=>{
        if(inst.dueDate > reportDate) return;
        byProduct[acc.product] = byProduct[acc.product] || {demand:0, recovery:0};
        byProduct[acc.product].demand += inst.emiAmount;
        byProduct[acc.product].recovery += Math.min(inst.paidAmount||0, inst.emiAmount);
        totalDemand += inst.emiAmount;
        totalRecovery += Math.min(inst.paidAmount||0, inst.emiAmount);
      });
    });
    const totalOverdue = totalDemand - totalRecovery;
    const recoveryPct = totalDemand>0 ? (totalRecovery/totalDemand*100) : 0;
    const rows = [
      ["Demand (₹)", fmtINR(Math.round(totalDemand))],
      ["Recovery (₹)", fmtINR(Math.round(totalRecovery))],
      ["Overdue (₹)", fmtINR(Math.round(totalOverdue))],
      ["Recovery %", recoveryPct.toFixed(2)+"%"],
      ["— By Product —", ""],
      ...Object.entries(byProduct).map(([name,d])=>[
        name, `Demand ${fmtINR(Math.round(d.demand))} · Recovery ${fmtINR(Math.round(d.recovery))} · ${d.demand>0?((d.recovery/d.demand*100).toFixed(1)):'0'}%`
      ])
    ];
    return { headers:[`As of ${reportDate} (cumulative from inception)`,"Value"], rows };
  }
  return { headers:[], rows:[] };
}

async function renderStressTesting(loanAccounts, payments){
  const s = session.stressAssumptions || { slippagePct:10, rateShockPct:2, topExposureDefaultPct:0 };
  const active = loanAccounts.filter(a=>a.status==="Active");
  const totalOutstanding = active.reduce((sum,a)=>sum+a.principalOutstanding,0);
  const currentNpa = active.filter(a=>NPA_CLASSES.includes(classifyDPD(computeDPD(a)))).reduce((sum,a)=>sum+a.principalOutstanding,0);

  // Scenario: a share of currently-Standard/SMA accounts slip further,
  // becoming NPA — a simple, transparent stress on asset quality.
  const nonNpaAccounts = active.filter(a=>!NPA_CLASSES.includes(classifyDPD(computeDPD(a))));
  const nonNpaOutstanding = nonNpaAccounts.reduce((sum,a)=>sum+a.principalOutstanding,0);
  const stressedSlippage = nonNpaOutstanding * (s.slippagePct/100);
  const stressedNpa = currentNpa + stressedSlippage;
  const stressedNpaRatio = totalOutstanding>0 ? (stressedNpa/totalOutstanding)*100 : 0;
  const currentNpaRatio = totalOutstanding>0 ? (currentNpa/totalOutstanding)*100 : 0;

  const acct = await computeAccountingSummary();
  const stressedFinanceCosts = acct.fundAccounts.filter(a=>a.type==="Borrowing").reduce((sum,a)=>sum+a.balance,0) * (s.rateShockPct/100);

  const sortedByExposure = active.slice().sort((a,b)=>b.principalOutstanding-a.principalOutstanding);
  const topExposureCount = Math.ceil(sortedByExposure.length * (s.topExposureDefaultPct/100));
  const topExposureAmount = sortedByExposure.slice(0,topExposureCount).reduce((sum,a)=>sum+a.principalOutstanding,0);

  return `
    <div class="card">
      <h2 style="font-size:16px;">Portfolio Stress Testing</h2>
      <p class="sub">Simple, transparent scenario modeling — not a statistical model, just "what if X% of accounts slipped further" applied directly to your real current portfolio. Adjust the assumptions and recalculate.</p>
      <div class="grid grid-3">
        <div class="field"><label>% of non-NPA accounts slipping to NPA</label><input id="st-slippage" type="number" value="${s.slippagePct}"></div>
        <div class="field"><label>Interest rate shock on borrowings (+pp)</label><input id="st-rate-shock" type="number" value="${s.rateShockPct}"></div>
        <div class="field"><label>% of top exposures assumed to default</label><input id="st-top-default" type="number" value="${s.topExposureDefaultPct}"></div>
      </div>
      <button class="btn btn-gold btn-sm" id="btn-run-stress-test">Recalculate</button>

      <div class="grid grid-3" style="margin-top:14px;">
        <div class="kpi"><div class="lbl">Current NPA Ratio</div><div class="val" style="font-size:18px;">${currentNpaRatio.toFixed(2)}%</div></div>
        <div class="kpi"><div class="lbl">Stressed NPA Ratio</div><div class="val" style="font-size:18px; color:var(--danger);">${stressedNpaRatio.toFixed(2)}%</div></div>
        <div class="kpi"><div class="lbl">Additional NPA (₹)</div><div class="val" style="font-size:18px;">${fmtINR(Math.round(stressedSlippage))}</div></div>
        <div class="kpi"><div class="lbl">Added Finance Cost from Rate Shock</div><div class="val" style="font-size:18px;">${fmtINR(Math.round(stressedFinanceCosts))}/yr</div></div>
        <div class="kpi"><div class="lbl">Top-Exposure Default Scenario</div><div class="val" style="font-size:18px;">${fmtINR(Math.round(topExposureAmount))}</div></div>
        <div class="kpi"><div class="lbl">Accounts in Top-Exposure Scenario</div><div class="val" style="font-size:18px;">${topExposureCount}</div></div>
      </div>
    </div>
  `;
}

async function renderCrossSell(customers, loanAccounts, products){
  // Rule-based: a customer with at least one fully Closed loan and no
  // history of ever being NPA is a reasonable, explainable candidate
  // for a follow-up/top-up loan.
  const byCustomer = {};
  loanAccounts.forEach(a=>{
    byCustomer[a.customerId] = byCustomer[a.customerId] || [];
    byCustomer[a.customerId].push(a);
  });
  const candidates = [];
  Object.entries(byCustomer).forEach(([custId, accs])=>{
    const hasClosedClean = accs.some(a=>a.status==="Closed" && (a.schedule||[]).every(i=>i.status==="Paid"));
    const everNpa = accs.some(a=> NPA_CLASSES.includes(classifyDPD(computeDPD(a))));
    const hasActive = accs.some(a=>a.status==="Active");
    if(hasClosedClean && !everNpa && !hasActive){
      const cust = customers.find(c=>c.id===custId);
      if(cust) candidates.push({ cust, pastLoans: accs.length });
    }
  });
  return `
    <div class="card">
      <h2 style="font-size:16px;">Cross-sell Candidates</h2>
      <p class="sub">Customers who've fully repaid at least one loan with a clean history (never NPA) and currently have no active loan — a reasonable, explainable starting list for a follow-up or top-up offer.</p>
      <table>
        <thead><tr><th>Customer</th><th>Mobile</th><th>Past Loans With Us</th><th></th></tr></thead>
        <tbody>
        ${candidates.length===0 ? `<tr class="empty-row"><td colspan="4">No candidates right now.</td></tr>` :
          candidates.map(c=>`<tr><td>${esc(c.cust.personal.name)}</td><td class="mono">${esc(c.cust.personal.mobile)}</td><td>${c.pastLoans}</td><td><button class="btn btn-outline btn-sm view-customer-btn" data-customer="${c.cust.id}">View</button></td></tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function handleCalculateEmi(){
  const principal = Number(document.getElementById("emic-principal").value);
  const rate = Number(document.getElementById("emic-rate").value);
  const tenure = Number(document.getElementById("emic-tenure").value);
  const moratorium = Number(document.getElementById("emic-moratorium").value)||0;
  if(!principal || !rate || !tenure){ toast("Enter loan amount, rate, and tenure."); return; }
  session.emiCalcInputs = {principal, rate, tenure, moratorium};
  session.emiCalcResult = {
    without: calculateEmiWithMoratorium(principal, rate, tenure, 0),
    with: calculateEmiWithMoratorium(principal, rate, tenure, moratorium),
  };
  render();
}

/* ---------------------------------------------------------------------
   Borrower Eligibility Checker + In-Principle Indication
   ---------------------------------------------------------------------
   Runs a product's rule engine using only what a self-service applicant
   has entered (income, expenses, requested amount) — it can't evaluate
   rules needing credit score or risk category since no bureau check or
   appraisal has happened yet. Those show as "checked at appraisal."
   Never creates a real Sanction record — this is indicative only.
   --------------------------------------------------------------------- */
function evaluateProductRulesPartial(product, context){
  const rules = product.rules || [];
  const results = rules.map(r=>{
    const actual = context[r.field];
    if(actual===undefined || actual===null) return { field:r.field, operator:r.operator, value:r.value, actual:null, status:"Unknown — checked at appraisal" };
    return { field:r.field, operator:r.operator, value:r.value, actual, status: evaluateRule(actual, r.operator, r.value) ? "Pass" : "Fail" };
  });
  return { results, anyFail: results.some(r=>r.status==="Fail"), allKnownPass: !results.some(r=>r.status==="Fail"), fullyKnown: !results.some(r=>r.status.startsWith("Unknown")) };
}

async function handleCheckEligibility(){
  const productId = document.getElementById("el-product").value;
  const income = Number(document.getElementById("el-income").value);
  const expenses = Number(document.getElementById("el-expenses").value)||0;
  if(!income || income<=0){ toast("Enter your monthly income."); return; }
  const products = await db.getAll("products");
  const product = products.find(p=>p.id===productId);
  if(!product){ toast("Select a product."); return; }

  const disposable = Math.max(0, income - expenses);
  const maxEmi = disposable * 0.7; // serviceability cushion, leaves 30% of disposable as buffer
  const eligibleAmount = maxEmi>0 ? estimateEligiblePrincipal(maxEmi, product.interestRate, product.tenureMax) : 0;
  const cappedAmount = product.maxLoanAmount ? Math.min(eligibleAmount, product.maxLoanAmount) : eligibleAmount;
  const foirPct = income>0 ? (maxEmi/income*100) : null;

  // In-principle eligibility is judged against THIS product's own
  // staff-configured minimums — deliberately independent of whether
  // Straight-Through auto-sanction happens to be enabled for it, so
  // every product can give borrowers a genuine yes/no, not just the
  // handful with auto-sanction turned on.
  const minIncome = product.minMonthlyIncome || 0;
  const maxFoir = product.maxFoirPct || 60;
  const meetsIncome = income >= minIncome;
  const meetsFoir = foirPct===null || foirPct <= maxFoir;
  const inPrinciple = meetsIncome && meetsFoir && cappedAmount>0;
  const failReasons = [];
  if(!meetsIncome) failReasons.push(`monthly income below this product's minimum of ${fmtINR(minIncome)}`);
  if(!meetsFoir) failReasons.push(`total obligations would be ${foirPct.toFixed(0)}% of income, above this product's ${maxFoir}% limit`);
  if(cappedAmount<=0) failReasons.push("no serviceable amount could be computed from the income/expenses entered");

  session.eligibilityInputs = {productId, income, expenses};
  session.eligibilityResult = {
    productName: product.name, income, expenses, disposable, maxEmi,
    eligibleAmount: cappedAmount, inPrinciple, failReasons, fullyKnown: true
  };
  render();
}

/** Inverse of the EMI formula — the principal a given monthly payment can
 *  service over a tenure at a given rate. */
function estimateEligiblePrincipal(monthlyEmi, annualRatePct, tenureMonths){
  const r = (annualRatePct/100)/12;
  if(!tenureMonths) return 0;
  if(r===0) return monthlyEmi*tenureMonths;
  return monthlyEmi * (Math.pow(1+r,tenureMonths)-1) / (r*Math.pow(1+r,tenureMonths));
}

async function handleSaveProduct(){
  const existingId = document.getElementById("btn-save-product").dataset.product;
  const isSuperAdmin = session.user.role==="Super Admin";
  const activeEl = document.getElementById("pf-active");
  let rules = [];
  let autoSanctionEnabled = false;
  if(isSuperAdmin){
    document.querySelectorAll(".rule-field").forEach(sel=>{
      const idx = sel.dataset.idx;
      const field = sel.value;
      if(!field) return;
      const operator = document.querySelector(`.rule-operator[data-idx="${idx}"]`).value;
      const value = Number(document.querySelector(`.rule-value[data-idx="${idx}"]`).value);
      if(isNaN(value)) return;
      rules.push({field, operator, value});
    });
    const autoEl = document.getElementById("pf-auto-sanction");
    autoSanctionEnabled = autoEl ? autoEl.checked : false;
  }
  const dsaCommissionEl = document.getElementById("pf-dsa-commission");
  const dsaCommissionPct = isSuperAdmin && dsaCommissionEl ? (Number(dsaCommissionEl.value)||0) : undefined;
  const rec = {
    id: existingId || uid("prd"),
    name: document.getElementById("pf-name").value.trim(),
    interestRate: Number(document.getElementById("pf-rate").value)||0,
    emiFrequency: document.getElementById("pf-freq").value,
    tenureMin: Number(document.getElementById("pf-tenure-min").value)||0,
    tenureMax: Number(document.getElementById("pf-tenure-max").value)||0,
    maxLoanAmount: Number(document.getElementById("pf-max-amount").value)||0,
    moratoriumMonths: Number(document.getElementById("pf-moratorium").value)||0,
    processingFeePct: Number(document.getElementById("pf-processing").value)||0,
    insurancePct: Number(document.getElementById("pf-insurance").value)||0,
    penaltyRatePct: Number(document.getElementById("pf-penalty").value)||0,
    gstPct: Number(document.getElementById("pf-gst").value)||0,
    securityRequired: document.getElementById("pf-security").value,
    active: isSuperAdmin && activeEl ? (activeEl.value === "true") : false,
    rules: isSuperAdmin ? rules : (existingId ? undefined : []),
    autoSanctionEnabled: isSuperAdmin ? autoSanctionEnabled : undefined,
    dsaCommissionPct: dsaCommissionPct,
    requiredDocuments: document.getElementById("pf-required-docs").value.split("\n").map(s=>s.trim()).filter(Boolean),
    minMonthlyIncome: Number(document.getElementById("pf-min-income").value)||0,
    maxFoirPct: Number(document.getElementById("pf-max-foir").value)||60,
    createdAt: nowISO()
  };
  if(existingId && !isSuperAdmin){
    // Non-Super-Admin editors shouldn't blank out an existing rule config they can't see.
    const existing = await db.get("products", existingId);
    if(existing){ rec.rules = existing.rules; rec.autoSanctionEnabled = existing.autoSanctionEnabled; rec.dsaCommissionPct = existing.dsaCommissionPct; }
  }
  if(!rec.name){ toast("Product name is required."); return; }
  await db.put("products", rec);
  await logAudit(session.user.name, session.user.role, existingId?"Product Updated":"Product Created", `${rec.name} — ${rec.interestRate}% p.a. — Max ${fmtINR(rec.maxLoanAmount)}${!isSuperAdmin ? ' — saved as Draft, awaiting Super Admin activation' : ''}${rec.autoSanctionEnabled ? ' — Auto-sanction ENABLED' : ''}`);
  toast(isSuperAdmin ? "Product saved: "+rec.name : "Saved as Draft — a Super Admin needs to activate it.");
  session.productSubview = "list";
  render();
}

async function handleDedupeProducts(){
  const u = session.user;
  const products = await db.getAll("products");
  const groups = {};
  products.forEach(p=>{ groups[p.name] = groups[p.name]||[]; groups[p.name].push(p); });
  let removed = 0;
  for(const name in groups){
    const group = groups[name];
    if(group.length<=1) continue;
    // Keep whichever copy is Active; among those (or if none active), keep the earliest created.
    group.sort((a,b)=>{
      const activeDiff = (b.active?1:0) - (a.active?1:0);
      if(activeDiff!==0) return activeDiff;
      return new Date(a.createdAt) - new Date(b.createdAt);
    });
    const toRemove = group.slice(1);
    for(const dupe of toRemove){ await db.delete("products", dupe.id); removed++; }
  }
  await logAudit(u.name, u.role, "Duplicate Products Removed", `${removed} duplicate product(s) removed, keeping the active (or earliest) copy of each name`);
  toast(removed>0 ? `Removed ${removed} duplicate product(s).` : "No duplicates found.");
  render();
}

async function updateLtvCheck(){
  const box = document.getElementById("ltv-check-box");
  if(!box) return;
  const leadId = document.getElementById("af-lead").value;
  const collateral = Number(document.getElementById("af-collateral").value);
  if(!leadId || !collateral){ box.innerHTML=""; return; }
  const lead = await db.get("leads", leadId);
  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const rule = policy.ltv.find(l=>l.product===lead.product);
  if(!rule || !lead.amountRequested){ box.innerHTML=""; return; }
  const ltv = (lead.amountRequested / collateral) * 100;
  const pass = ltv <= rule.maxLtvPct;
  box.innerHTML = `<div class="warn-banner" style="background:${pass?'#E4F3E8':'#FBE7E8'};border-color:${pass?'var(--ok)':'var(--danger)'};color:${pass?'#1D4E33':'#7A1F27'};">
    ${pass?'✓':'⚠'} LTV for ${esc(lead.product)}: <b>${ltv.toFixed(1)}%</b> against policy cap of <b>${rule.maxLtvPct}%</b> — ${pass?'within limit':'exceeds limit, refer to sanctioning authority'}.
  </div>`;
}

  if(!customerId){ toast("Select a customer."); return; }

  const cma = {
