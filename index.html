<style>
  :root{
    --navy-900:#0E1A30;
    --navy-800:#152444;
    --navy-700:#1E3160;
    --gold:#C6992F;
    --gold-soft:#E7C878;
    --paper:#F6F4EF;
    --paper-2:#EDEAE1;
    --ink:#182238;
    --slate:#5C6579;
    --line:#DCD7CA;
    --ok:#2F7A4F;
    --warn:#B4552D;
    --danger:#A5323B;
    --radius:10px;
    --card-bg:#fff;
  }
  html[data-theme="dark"]{
    --paper:#12151C;
    --paper-2:#1B1F29;
    --ink:#E7E5DE;
    --slate:#98A0B3;
    --line:#2C313F;
    --card-bg:#1A1E28;
  }
  html[data-theme="dark"] .kpi .val{ color:var(--gold-soft); }
  html[data-theme="dark"] table{ color:var(--ink); }
  html[data-theme="dark"] .notif-dropdown{ background:var(--card-bg) !important; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:14.5px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif; margin:0; color:var(--navy-900); font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14.5px;}

  /* ---------- App chrome ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .topbar{
    background:var(--navy-900);
    color:var(--paper);
    padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--gold);
    flex-wrap:wrap; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:30px;height:30px;border-radius:6px;
    background:linear-gradient(155deg,var(--gold-soft),var(--gold));
    display:flex;align-items:center;justify-content:center;
    color:var(--navy-900); font-family:'Fraunces',serif; font-weight:700; font-size:15px;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.1;}
  .brand-text b{font-family:'Fraunces',serif; font-size:17px; letter-spacing:.2px;}
  .brand-text span{font-size:10.5px; letter-spacing:1.5px; color:var(--gold-soft); text-transform:uppercase;}
  .topbar-right{display:flex; align-items:center; gap:10px; font-size:13px; flex-wrap:wrap; row-gap:8px;}
  .pill{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
    padding:5px 12px; border-radius:20px; font-size:12.5px; color:var(--gold-soft);
  }
  .btn{
    border:none; border-radius:7px; padding:9px 16px; font-weight:600; font-size:13.5px;
    transition:.15s ease; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-gold{background:var(--gold); color:var(--navy-900);}
  .btn-gold:hover{background:var(--gold-soft);}
  .btn-ghost{background:transparent; color:var(--paper); border:1px solid rgba(255,255,255,.3);}
  .btn-ghost:hover{border-color:var(--gold-soft); color:var(--gold-soft);}
  .btn-outline{background:transparent; color:var(--navy-900); border:1px solid var(--navy-700);}
  .btn-outline:hover{background:var(--navy-900); color:#fff;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}

  .choice-card{

  }

  .flex-between{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}

  }
  .kyc-upload-box img{max-width:100%; max-height:90px; border-radius:4px; margin-top:8px; display:none; object-fit:cover;}

  .print-doc h2{font-size:15px; margin:18px 0 8px; border-bottom:1px solid #ccc; padding-bottom:4px;}

  @media print{

    .topbar, .pulse, .tabs, .footer-note, .no-print { display:none !important; }
    body{background:#fff;}
    main{padding:0; max-width:100%;}
    .card{border:none; box-shadow:none; padding:0;}

<body>
<div id="app"></div>
<div id="print-area" style="display:none;"></div>
<script>
/* =========================================================================
   LEDGER LMS — Phase 1 (shell) + Phase 2 (Lead detail, Customer Management,
   Digital KYC)
   Storage: Firebase/Firestore (cloud, shared across devices). View layer only ever calls db.* — the
   swap to Firebase/Firestore later touches nothing else.
   ========================================================================= */

/* =========================================================================
   LEDGER LMS — Cloud data layer (Firebase / Firestore)
   ---------------------------------------------------------------------
   This replaces the local IndexedDB layer used in Phases 1–8. The db.*
   interface (get / getAll / put) is kept identical on purpose, so none of
   the render/handler code elsewhere in this file needed to change — only
   this block, plus the boot() sequence, are new.

   SETUP REQUIRED — fill in FIREBASE_CONFIG below with your own Firebase
   project's config (Firebase Console → Project settings → Your apps →
   SDK setup and configuration). This file will not work until you do.
   ========================================================================= */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB7YzZW4SNbevNvDr8RDfw3yBVXr_q5X7Y",
  authDomain: "nbfc-lms.firebaseapp.com",
  projectId: "nbfc-lms",
  storageBucket: "nbfc-lms.firebasestorage.app",
  messagingSenderId: "543188585230",
  appId: "1:543188585230:web:6843eeb659be0f2b92a55f"
};

let firestoreDb = null;
// Apply any saved theme preference immediately, before Firebase or
// render() even start, so there's no flash of the wrong theme on load.
if(localStorage.getItem("nbfclms-theme")==="dark"){
  document.documentElement.setAttribute("data-theme","dark");
}

let firebaseReady = false;
// Cached once per session so pre-login/borrower screens (Forgot
// Password, etc.) can show real contact info synchronously without
// restructuring the toggle handlers that call these panels outside
// the main async render() chain.
let cachedNbfcContact = null;

async function initFirebase(){
  if(firebaseReady) return;
  if(FIREBASE_CONFIG.apiKey === "YOUR_API_KEY"){
    document.getElementById("app").innerHTML = `
      <div style="max-width:560px;margin:60px auto;padding:28px;font-family:sans-serif;line-height:1.6;">
        <h2 style="color:#A5323B;">Firebase not configured</h2>
        <p>This build talks to Firestore instead of local storage, but <code>FIREBASE_CONFIG</code> at the top of the script still has placeholder values.</p>
        <p>Open this file, find <code>FIREBASE_CONFIG</code>, and paste in your own Firebase project's config from
        Firebase Console → Project settings → Your apps → SDK setup and configuration.</p>
      </div>`;
    throw new Error("Firebase not configured");
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  firestoreDb = firebase.firestore();
  // Anonymous auth here is now ONLY a bootstrap step — it satisfies
  // "request.auth != null" so the app can read the single public
  // meta/setupStatus flag (used to decide whether to show first-run
  // setup or the login screen) before anyone has actually logged in.
  // It grants NO access to real data: the Firestore Security Rules
  // shipped alongside this file only grant access to collections once
  // the signed-in UID matches a real staff/{uid} or borrowers/{uid}
  // document — which an anonymous session never does. Real access
  // requires actual staff or borrower login (email/password against
  // Firebase Auth), handled in handleStaffLogin/handleBorrowerLogin.
  await firebase.auth().signInAnonymously();
  firebaseReady = true;
}

/** Two layers:
 *  1. renderCache — cleared at the start of every render() pass. Within
 *     one screen load, many different parts (dashboard, notifications,
 *     fund position, portfolio risk, etc.) independently ask for the
 *     same collections; this avoids re-fetching the same thing several
 *     times for a single page load.
 *  2. staleCache — survives ACROSS render() calls for a longer window.
 *     This is what actually fixes slow menu navigation: without it,
 *     every single tab click re-fetched every collection fresh from
 *     Firestore even though nothing had changed since the last click a
 *     moment ago. Bumped up further after moving to real Security Rules —
 *     every read now costs an extra staff/{uid} lookup for Firestore to
 *     evaluate isStaff()/isSuperAdmin(), which is real, unavoidable
 *     latency that real access control adds; caching more aggressively
 *     is the lever available to offset it. Any write immediately
 *     invalidates both layers for that collection, so you're never
 *     looking at stale data after an action — you just don't pay a
 *     fresh round-trip (rule evaluation and all) for rapid clicking. */
let renderCache = {};
let staleCache = {};
const STALE_CACHE_MS = 90000;
function clearRenderCache(){ renderCache = {}; }

const db = {
  async getAll(collectionName){
    await initFirebase();
    if(renderCache[collectionName]) return renderCache[collectionName];
    const cached = staleCache[collectionName];
    if(cached && (Date.now()-cached.at) < STALE_CACHE_MS){
      renderCache[collectionName] = cached.data;
      return cached.data;
    }
    const snap = await firestoreDb.collection(collectionName).get();
    const result = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    renderCache[collectionName] = result;
    staleCache[collectionName] = { data: result, at: Date.now() };
    return result;
  },
  /** For borrower-side reads where the security rule only allows
   *  seeing your OWN documents (e.g. leads filtered by borrowerId).
   *  This matters beyond just efficiency: Firestore validates a plain
   *  collection.get() against the worst case of what the rule allows,
   *  not per returned document — an unconstrained query against a rule
   *  like "resource.data.borrowerId == request.auth.uid" gets rejected
   *  outright with "Missing or insufficient permissions", even though
   *  every document that WOULD be returned satisfies the rule. Adding
   *  a matching .where() clause is what lets Firestore verify the
   *  query itself can't return anything outside what the rule allows. */
  async getWhere(collectionName, field, value){
    await initFirebase();
    const cacheKey = `${collectionName}:${field}:${value}`;
    if(renderCache[cacheKey]) return renderCache[cacheKey];
    const snap = await firestoreDb.collection(collectionName).where(field, "==", value).get();
    const result = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    renderCache[cacheKey] = result;
    return result;
  },
  async get(collectionName, id){
    await initFirebase();
    const doc = await firestoreDb.collection(collectionName).doc(id).get();
    return doc.exists ? { ...doc.data(), id: doc.id } : null;
  },
  async put(collectionName, obj){
    await initFirebase();
    await firestoreDb.collection(collectionName).doc(obj.id).set(obj);
    delete renderCache[collectionName]; // this collection just changed — don't serve a stale list
    delete staleCache[collectionName];
    return obj;
  },
  async delete(collectionName, id){
    await initFirebase();
    await firestoreDb.collection(collectionName).doc(id).delete();
    delete renderCache[collectionName];
    delete staleCache[collectionName];
  },
  /** Writes many documents to the same collection using Firestore's
   *  real batch API — one network round-trip per 500 documents
   *  (Firestore's own batch limit), run concurrently, instead of one
   *  round-trip per document awaited sequentially. This is the
   *  difference between a menu opening instantly and it taking minutes
   *  once a portfolio has any real size to it — a sequential loop of
   *  individually-awaited writes is the single most common cause of a
   *  screen that "won't open" when nothing is actually broken. */
  async putMany(collectionName, objects){
    await initFirebase();
    if(objects.length===0) return;
    const chunks = [];
    for(let i=0; i<objects.length; i+=500) chunks.push(objects.slice(i, i+500));
    await Promise.all(chunks.map(chunk=>{
      const batch = firestoreDb.batch();
      chunk.forEach(obj=> batch.set(firestoreDb.collection(collectionName).doc(obj.id), obj));
      return batch.commit();
    }));
    delete renderCache[collectionName];
    delete staleCache[collectionName];
  },
};

function uid(prefix){ return prefix+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/** Firebase Auth's Email/Password provider needs an email-shaped
 *  identifier even though staff and borrowers just enter a username or
 *  mobile number in the app UI — these build a synthetic, deterministic
 *  one from what they actually typed. Nothing is ever sent to these
 *  addresses; they're only used as Firebase Auth account identifiers. */
function staffAuthEmail(username){
  return username.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"") + "@staff.nbfclms.local";
}
function borrowerAuthEmail(mobile){
  return mobile.trim() + "@borrower.nbfclms.local";
}
function friendlyAuthError(err){
  const code = err && err.code || "";
  if(code.includes("wrong-password") || code.includes("user-not-found") || code.includes("invalid-credential")) return "Invalid username/mobile or password.";
  if(code.includes("email-already-in-use")) return "That username or mobile number is already registered.";
  if(code.includes("weak-password")) return "Password is too weak — use at least 6 characters.";
  if(code.includes("network-request-failed")) return "Network error — check your connection and try again.";
  return "Something went wrong: " + (err && err.message || err);
}

function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+" "+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function fmtINR(n){ if(n===null||n===undefined||isNaN(n)) return "—"; return "₹"+Number(n).toLocaleString('en-IN'); }
function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* =========================================================================
   Aadhaar/PAN encryption at rest — uses the browser's built-in Web
   Crypto API (AES-GCM). Honest about what this does and doesn't protect:
   staff using the app normally still see these values decrypted, exactly
   as before — that's the whole point, they need to for KYC work. What
   this DOES protect against: anyone who gets hold of a raw database
   export, a JSON backup file, or direct Firestore access without going
   through the app itself would see ciphertext, not a plain Aadhaar/PAN
   number. The encryption key itself is stored in Firestore (readable
   only by authenticated staff, same as everything else) since there's
   no separate backend/KMS to hold it more securely than that — this is
   the honest ceiling of what a client-only app can do without a real
   server component.
   ========================================================================= */
let cachedEncryptionKey = null;

async function getOrCreateEncryptionKey(){
  if(cachedEncryptionKey) return cachedEncryptionKey;
  let cfg = await db.get("apiConfig","security");
  if(!cfg || !cfg.encryptionKeyB64){
    const rawKey = await crypto.subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
    const exported = await crypto.subtle.exportKey("raw", rawKey);
    const keyB64 = btoa(String.fromCharCode(...new Uint8Array(exported)));
    // Merge into whatever's already there (e.g. sessionTimeoutMinutes)
    // rather than replacing the whole document — this config doc is
    // shared by more than one setting.
    cfg = { ...(cfg||{}), id:"security", encryptionKeyB64: keyB64, createdAt: nowISO() };
    await db.put("apiConfig", cfg);
  }
  const keyBytes = Uint8Array.from(atob(cfg.encryptionKeyB64), c=>c.charCodeAt(0));
  cachedEncryptionKey = await crypto.subtle.importKey("raw", keyBytes, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
  return cachedEncryptionKey;
}

async function encryptField(plaintext){
  if(!plaintext) return null;
  const key = await getOrCreateEncryptionKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(plaintext);
  const ciphertext = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, encoded);
  return {
    iv: btoa(String.fromCharCode(...iv)),
    data: btoa(String.fromCharCode(...new Uint8Array(ciphertext))),
    enc: true // marker distinguishing new encrypted objects from old plaintext strings
  };
}

async function decryptField(value){
  if(!value) return "";
  if(typeof value === "string") return value; // not yet migrated — still plaintext
  try{
    const key = await getOrCreateEncryptionKey();
    const iv = Uint8Array.from(atob(value.iv), c=>c.charCodeAt(0));
    const data = Uint8Array.from(atob(value.data), c=>c.charCodeAt(0));
    const decrypted = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
    return new TextDecoder().decode(decrypted);
  } catch(err){
    console.error("Decryption failed:", err);
    return "(decryption error)";
  }
}

/** One-way SHA-256 hash, used ONLY for exact-match duplicate detection
 *  (same Aadhaar/PAN already registered) — this lets that check keep
 *  working without ever decrypting existing customers just to compare. */
async function hashField(value){
  if(!value) return "";
  const encoded = new TextEncoder().encode(value.trim().toUpperCase());
  const hashBuffer = await crypto.subtle.digest("SHA-256", encoded);
  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function maskAadhaar(a){ if(!a) return "—"; const d=a.replace(/\D/g,''); return d.length>=4 ? "XXXX-XXXX-"+d.slice(-4) : a; }
function maskPAN(p){ if(!p) return "—"; return p.length>=4 ? p.slice(0,2)+"XXXXX"+p.slice(-2) : p; }


async function logAudit(actor, actorRole, action, details){
  // Audit logging is a secondary, best-effort concern — it must never
  // be able to break the primary action that called it. Concretely:
  // borrowers aren't staff, so a borrower-triggered audit write (e.g.
  // during self-registration) is correctly rejected by the security
  // rules — but that rejection shouldn't cascade into failing the
  // registration itself, which is what was happening before this guard.
  try{
    await db.put("auditLog", {
      id: uid("aud"), ts: nowISO(), actor, actorRole, action, details: details||""
    });
  } catch(err){
    console.error("Audit log write failed (non-fatal):", err);
  }
}

async function computeFundPosition(){
  const [accounts, sanctions] = await Promise.all([db.getAll("fundAccounts"), db.getAll("sanctions")]);
  const totalFunds = accounts.reduce((s,a)=>s+a.balance,0);
  const undisbursed = sanctions.filter(s=>s.status==="Approved" && !s.disbursementId);
  const committed = undisbursed.reduce((s,x)=>s+x.sanctionedAmount,0);
  const available = totalFunds - committed;
  const approvedTotal = sanctions.filter(s=>s.status==="Approved").reduce((s,x)=>s+x.sanctionedAmount,0);
  return { accounts, sanctions, totalFunds, committed, available, undisbursedCount: undisbursed.length, approvedTotal };
}

/** Day-by-day projection of available funds for the next N days, adding
 *  each day's scheduled EMI collections (assuming on-time payment) to
 *  today's Available Funds. Doesn't assume any future disbursements or
 *  expenses since neither is scheduled in advance anywhere in this app —
 *  this is a collections-side projection only, not a full cash forecast. */
async function computeFundsProjection(days){
  const fundPos = await computeFundPosition();
  const loanAccounts = await db.getAll("loanAccounts");
  const startDate = new Date(todayStr());
  let runningBalance = fundPos.available;
  const projection = [];
  for(let i=0; i<days; i++){
    const d = new Date(startDate);
    d.setDate(d.getDate()+i);
    const dateStr = d.toISOString().slice(0,10);
    let expectedCollection = 0;
    for(const acc of loanAccounts){
      if(acc.status!=="Active") continue;
      for(const inst of (acc.schedule||[])){
        if(inst.status==="Paid") continue;
        if(inst.dueDate===dateStr) expectedCollection += (inst.emiAmount - (inst.paidAmount||0));
      }
    }
    runningBalance += expectedCollection;
    projection.push({ date: dateStr, expectedCollection, projectedBalance: runningBalance });
  }
  return projection;
}

async function computeBorrowerExposure(customerId, excludeSanctionId){
  const sanctions = await db.getAll("sanctions");
  return sanctions.filter(s=> s.customerId===customerId && s.status==="Approved" && s.id!==excludeSanctionId)
    .reduce((sum,s)=>sum+s.sanctionedAmount,0);
}

async function computeSectorExposure(product, excludeSanctionId){
  const sanctions = (await db.getAll("sanctions")).filter(s=>s.status==="Approved" && s.id!==excludeSanctionId);
  const total = sanctions.reduce((s,x)=>s+x.sanctionedAmount,0);
  const inSector = sanctions.filter(s=>s.product===product).reduce((s,x)=>s+x.sanctionedAmount,0);
  return { pct: total>0 ? (inSector/total)*100 : 0, total, inSector };
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

async function computePortfolioRisk(loanAccounts, payments){
  const products = await db.getAll("products");
  const policy = (await db.get("policyConfig","default")) || defaultPolicyConfig();
  const productMap = {}; products.forEach(p=>productMap[p.name]=p);
  const active = loanAccounts.filter(a=>a.status==="Active");
  let totalOutstanding=0, atRiskOutstanding=0, npaAmount=0;
  const analyzed = active.map(acc=>{
    const a = analyzeLoanAccount(acc, productMap, policy);
    totalOutstanding += acc.principalOutstanding;
    if(a.dpd>0) atRiskOutstanding += acc.principalOutstanding;
    if(NPA_CLASSES.includes(a.classification)) npaAmount += acc.principalOutstanding;
    return { acc, ...a };
  });
  const par = totalOutstanding>0 ? (atRiskOutstanding/totalOutstanding)*100 : 0;
  const today = todayStr();
  let totalDemand=0;
  for(const acc of loanAccounts){
    for(const inst of (acc.schedule||[])){ if(inst.dueDate <= today) totalDemand += inst.emiAmount; }
  }
  const totalCollected = payments.reduce((s,p)=>s+p.amount,0);
  const collectionEfficiency = totalDemand>0 ? (totalCollected/totalDemand)*100 : 0;
  return { analyzed, totalOutstanding, atRiskOutstanding, npaAmount, par, collectionEfficiency, policy, productMap };
}

/* ---------------------------------------------------------------------
   Ratios & Compliance
   ---------------------------------------------------------------------
   Ratios are split into two honesty tiers:
   - "solid": computed directly and reliably from data already in the app.
   - "proxy": a labeled approximation of a real prudential ratio that this
     app's data model cannot fully support (e.g. true CRAR needs Tier I/II
     capital classification and risk-weighted assets per RBI's detailed
     matrix — well beyond what's tracked here). These are never presented
     without a warning, and must never be used for actual regulatory
     reporting or decisions — verify with your statutory auditor.
   --------------------------------------------------------------------- */
async function computeFinancialRatios(){
  const loanAccounts = await db.getAll("loanAccounts");
  const payments = await db.getAll("payments");
  const fundAccounts = await db.getAll("fundAccounts");
  const riskPos = await computePortfolioRisk(loanAccounts, payments);
  const acct = await computeAccountingSummary();

  const grossPortfolio = riskPos.totalOutstanding;
  const grossNpaRatio = grossPortfolio>0 ? (riskPos.npaAmount/grossPortfolio)*100 : 0;
  const netNpaAmount = Math.max(0, riskPos.npaAmount - acct.npaProvision);
  const netNpaRatio = grossPortfolio>0 ? (netNpaAmount/Math.max(1,(grossPortfolio-acct.npaProvision)))*100 : 0;
  const provisioningCoverageRatio = riskPos.npaAmount>0 ? (acct.npaProvision/riskPos.npaAmount)*100 : 0;

  const capital = fundAccounts.filter(a=>a.type==="Capital").reduce((s,a)=>s+a.balance,0);
  const borrowings = fundAccounts.filter(a=>a.type==="Borrowing").reduce((s,a)=>s+a.balance,0);
  const debtToEquity = capital>0 ? borrowings/capital : null;

  const totalAssets = acct.cashBankBalance + acct.portfolioOutstanding;
  const returnOnAssets = totalAssets>0 ? (acct.netSurplus/totalAssets)*100 : 0;
  const yieldOnAdvances = grossPortfolio>0 ? (acct.interestIncome/grossPortfolio)*100 : 0;

  // Capital Adequacy proxy — NOT statutory CRAR. Flat 100% risk-weight
  // assumption on the loan book, capital = fund accounts typed "Capital".
  const capitalAdequacyProxy = grossPortfolio>0 ? (capital/grossPortfolio)*100 : null;

  return {
    grossNpaRatio, netNpaRatio, provisioningCoverageRatio, par: riskPos.par,
    collectionEfficiency: riskPos.collectionEfficiency, debtToEquity, returnOnAssets,
    yieldOnAdvances, capitalAdequacyProxy, capital, borrowings, grossPortfolio, netNpaAmount
  };
}

/* ---------------------------------------------------------------------
   Phase 7: Accounting (simplified single-entry ledger for MIS purposes)
   --------------------------------------------------------------------- */
function installmentSplit(payment, loanAccount){
  if(!loanAccount || !loanAccount.schedule) return {principal:0, interest:0};
  const inst = loanAccount.schedule.find(i=>i.index===payment.installmentIndex);
  if(!inst) return {principal:0, interest:0};
  const ratio = inst.emiAmount>0 ? payment.amount/inst.emiAmount : 0;
  return { principal: inst.principalComponent*ratio, interest: inst.interestComponent*ratio };
}

async function computeAccountingSummary(){
  const disbursements = await db.getAll("disbursements");
  const payments = await db.getAll("payments");
  const loanAccounts = await db.getAll("loanAccounts");
  const products = await db.getAll("products");
  const journalEntries = await db.getAll("journalEntries");
  const productMap = {}; products.forEach(p=>productMap[p.name]=p);
  const loanMap = {}; loanAccounts.forEach(a=>loanMap[a.id]=a);

  let principalDisbursed=0, processingFeeIncome=0, gstOnFees=0;
  const disbursementEntries = disbursements.map(d=>{
    const acc = loanAccounts.find(a=>a.sanctionId===d.sanctionId);
    const prod = acc ? productMap[acc.product] : null;
    const fee = prod ? d.amount*(prod.processingFeePct/100) : 0;
    const gst = prod ? fee*(prod.gstPct/100) : 0;
    principalDisbursed += d.amount; processingFeeIncome += fee; gstOnFees += gst;
    return { date:d.date, particulars:"Loan Disbursed", ref:d.id, debit:d.amount, credit:0 };
  });

  let principalCollected=0, interestIncome=0;
  const collectionEntries = payments.map(p=>{
    const acc = loanMap[p.loanAccountId];
    const split = installmentSplit(p, acc);
    principalCollected += split.principal; interestIncome += split.interest;
    return { date:p.date, particulars:"EMI Collected ("+(acc?acc.product:"—")+")", ref:p.id, debit:0, credit:p.amount, principal:split.principal, interest:split.interest };
  });

  let otherIncome=0, operatingExpenses=0;
  const postedJournalEntries = journalEntries.filter(j=> !j.status || j.status==="Posted");
  const journalEntryRows = postedJournalEntries.map(j=>{
    if(j.type==="Income") otherIncome += j.amount; else operatingExpenses += j.amount;
    return {
      date:j.date, particulars:(j.type==="Income"?"Income: ":"Expense: ")+j.category+(j.description?" — "+j.description:""),
      ref:j.id, debit: j.type==="Expense"?j.amount:0, credit: j.type==="Income"?j.amount:0
    };
  });

  const riskPos = await computePortfolioRisk(loanAccounts, payments);
  const npaProvision = riskPos.analyzed.reduce((s,a)=>s+a.provisioningAmount,0);

  const totalIncome = interestIncome + processingFeeIncome + otherIncome;
  const netSurplus = totalIncome - npaProvision - operatingExpenses;

  const fundAccounts = await db.getAll("fundAccounts");
  const cashBankBalance = fundAccounts.reduce((s,a)=>s+a.balance,0);
  const portfolioOutstanding = loanAccounts.reduce((s,a)=>s+a.principalOutstanding,0);
  const capitalAndBorrowings = fundAccounts.filter(a=>["Capital","Borrowing"].includes(a.type)).reduce((s,a)=>s+a.balance,0);

  return {
    disbursementEntries, collectionEntries, journalEntryRows, journalEntries,
    principalDisbursed, principalCollected,
    processingFeeIncome, gstOnFees, interestIncome, otherIncome, operatingExpenses,
    totalIncome, npaProvision, netSurplus,
    cashBankBalance, portfolioOutstanding, capitalAndBorrowings, fundAccounts, riskPos
  };
}

/* =========================================================================
   Financial Statements — Schedule III, Division III format (the format
   Ind-AS-compliant NBFCs use under the Companies Act, distinct from a
   regular company's Division II format: assets/liabilities are split
   into Financial vs Non-Financial and presented in order of liquidity,
   not current/non-current). Built from the same figures already tracked
   elsewhere in the app, mapped onto the prescribed line items — this is
   a structural template to speed up your actual filing, not a
   substitute for your statutory auditor's sign-off. Verify every line
   against your books and current MCA/ICAI guidance before relying on it.
   ========================================================================= */
function sumJournalByCategory(journalEntries, categories){
  return journalEntries.filter(j=> (!j.status || j.status==="Posted") && j.type==="Expense" && categories.includes(j.category)).reduce((s,j)=>s+j.amount,0);
}

async function computeScheduleIIIFigures(){
  const [acct, fixedAssets, bankBorrowings] = await Promise.all([
    computeAccountingSummary(), db.getAll("fixedAssets"), db.getAll("bankBorrowings")
  ]);

  // --- Balance Sheet ---
  const cashAndEquivalents = acct.fundAccounts.filter(a=>a.type==="Cash").reduce((s,a)=>s+a.balance,0);
  const bankBalances = acct.fundAccounts.filter(a=>["Bank Account","UPI"].includes(a.type)).reduce((s,a)=>s+a.balance,0);
  const investments = acct.fundAccounts.filter(a=>a.type==="Investment").reduce((s,a)=>s+a.balance,0);
  const grossLoans = acct.portfolioOutstanding;
  const impairmentAllowance = acct.npaProvision;
  const netLoans = Math.max(0, grossLoans - impairmentAllowance);
  const totalFinancialAssets = cashAndEquivalents + bankBalances + investments + netLoans;

  const activeAssets = fixedAssets.filter(a=>a.status==="Active");
  let ppeBookValue = 0;
  activeAssets.forEach(a=>{ ppeBookValue += computeAssetBookValue(a).bookValue; });
  const totalNonFinancialAssets = ppeBookValue;

  const totalAssets = totalFinancialAssets + totalNonFinancialAssets;

  const termLoanBorrowings = acct.fundAccounts.filter(a=>a.type==="Borrowing").reduce((s,a)=>s+a.balance,0);
  const ccOdUtilized = bankBorrowings.filter(b=>!b.affectsFundBalance && b.status==="Active").reduce((s,b)=>s+(b.utilizedAmount||0),0);
  const totalBorrowings = termLoanBorrowings + ccOdUtilized;
  const totalFinancialLiabilities = totalBorrowings;
  const totalNonFinancialLiabilities = 0;

  const equityShareCapital = acct.fundAccounts.filter(a=>a.type==="Capital").reduce((s,a)=>s+a.balance,0);
  // Other Equity (retained earnings) is a balancing figure — same
  // reconciliation approach as the Trial Balance elsewhere in the app.
  const otherEquity = totalAssets - totalFinancialLiabilities - totalNonFinancialLiabilities - equityShareCapital;
  const totalEquity = equityShareCapital + otherEquity;
  const totalLiabilitiesAndEquity = totalFinancialLiabilities + totalNonFinancialLiabilities + totalEquity;

  // --- Statement of Profit & Loss ---
  const financeCosts = sumJournalByCategory(acct.journalEntries, ["Interest on Borrowings"]);
  const feesCommissionExpense = sumJournalByCategory(acct.journalEntries, ["DSA Commission"]);
  const employeeBenefits = sumJournalByCategory(acct.journalEntries, ["Salaries"]);
  let depreciation = 0;
  activeAssets.forEach(a=>{ depreciation += computeAssetBookValue(a).accumulatedDepreciation; });
  const otherExpenseCategories = (await getCategoryConfig()).expenseCategories.filter(c=>!["Interest on Borrowings","DSA Commission","Salaries"].includes(c));
  const otherExpenses = sumJournalByCategory(acct.journalEntries, otherExpenseCategories);

  const revenueFromOperations = acct.interestIncome + acct.processingFeeIncome;
  const totalIncome = revenueFromOperations + acct.otherIncome;
  const totalExpenses = financeCosts + feesCommissionExpense + acct.npaProvision + employeeBenefits + depreciation + otherExpenses;
  const profitBeforeTax = totalIncome - totalExpenses;

  return {
    balanceSheet: {
      cashAndEquivalents, bankBalances, investments, grossLoans, impairmentAllowance, netLoans, totalFinancialAssets,
      ppeBookValue, totalNonFinancialAssets, totalAssets,
      termLoanBorrowings, ccOdUtilized, totalBorrowings, totalFinancialLiabilities, totalNonFinancialLiabilities,
      equityShareCapital, otherEquity, totalEquity, totalLiabilitiesAndEquity
    },
    profitLoss: {
      interestIncome: acct.interestIncome, feesCommissionIncome: acct.processingFeeIncome, revenueFromOperations,
      otherIncome: acct.otherIncome, totalIncome,
      financeCosts, feesCommissionExpense, impairment: acct.npaProvision, employeeBenefits, depreciation, otherExpenses, totalExpenses,
      profitBeforeTax, profitAfterTax: profitBeforeTax
    }
  };
}

/* ---------------------------------------------------------------------
   Bank Reconciliation — upload a CSV of your NBFC's actual bank
   statement and auto-match it against transactions the app itself
   recorded against that fund account (disbursements, EMI collections,
   journal entries). There's no live bank-fetch here — that needs a real
   banking API/Account Aggregator connection on your bank's side — this
   is the practical upload-and-match version.
   --------------------------------------------------------------------- */
async function getReconcilableTransactions(fundAccountId){
  const disbursements = (await db.getAll("disbursements")).filter(d=>d.fundAccountId===fundAccountId);
  const payments = (await db.getAll("payments")).filter(p=>p.fundAccountId===fundAccountId);
  const journalEntries = (await db.getAll("journalEntries")).filter(j=>j.fundAccountId===fundAccountId && (!j.status || j.status==="Posted"));
  const txns = [];
  disbursements.forEach(d=> txns.push({ id:d.id, type:"Disbursement", date:d.date, amount:-d.amount, description:"Loan Disbursement — "+d.id }));
  payments.forEach(p=> txns.push({ id:p.id, type:"Payment", date:p.date, amount:p.amount, description:"EMI Collection — "+p.id }));
  journalEntries.forEach(j=> txns.push({ id:j.id, type:"Journal", date:j.date, amount: j.type==="Income"?j.amount:-j.amount, description:j.category+(j.description?" — "+j.description:"") }));
  return txns;
}

function parseGenericCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const headers = lines[0].split(",").map(h=>h.trim());
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const cols = lines[i].split(",").map(c=>c.trim());
    const row = {};
    headers.forEach((h,idx)=>{ row[h] = cols[idx]!==undefined ? cols[idx] : ""; });
    rows.push(row);
  }
  return rows;
}

function parseStatementCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const header = lines[0].split(",").map(h=>h.trim().toLowerCase());
  const idx = (names)=> header.findIndex(h=>names.includes(h));
  const dateIdx = idx(["date"]);
  const descIdx = idx(["description","narration","particulars"]);
  const debitIdx = idx(["debit","withdrawal","dr"]);
  const creditIdx = idx(["credit","deposit","cr"]);
  const amountIdx = idx(["amount"]);
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const cols = lines[i].split(",").map(c=>c.trim());
    const date = dateIdx>=0 ? cols[dateIdx] : "";
    const description = descIdx>=0 ? cols[descIdx] : "";
    let amount;
    if(debitIdx>=0 && creditIdx>=0){
      const debit = Number(cols[debitIdx])||0, credit = Number(cols[creditIdx])||0;
      amount = credit - debit;
    } else if(amountIdx>=0){
      amount = Number(cols[amountIdx])||0;
    } else continue;
    if(!date) continue;
    rows.push({ date, description, amount });
  }
  return rows;
}

async function reconcileStatementLines(fundAccountId, parsedRows, batchId){
  const txns = await getReconcilableTransactions(fundAccountId);
  const existingLines = await db.getAll("bankStatementLines");
  const alreadyMatchedIds = new Set(existingLines.filter(l=>l.matched).map(l=>l.matchedId));
  const lines = [];
  for(const row of parsedRows){
    const match = txns.find(t=>
      !alreadyMatchedIds.has(t.id) &&
      Math.abs(new Date(t.date)-new Date(row.date)) <= 2*24*60*60*1000 &&
      Math.abs(Math.abs(t.amount)-Math.abs(row.amount)) < 1
    );
    if(match) alreadyMatchedIds.add(match.id);
    lines.push({
      id: uid("bsl"), fundAccountId, date: row.date, description: row.description, amount: row.amount,
      matched: !!match, matchedType: match?match.type:null, matchedId: match?match.id:null,
      batchId, uploadedAt: nowISO()
    });
  }
  return lines;
}

function downloadCSV(filename, headers, rows){
  const esc2 = (v)=> { const s = (v===null||v===undefined) ? "" : String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [headers.map(esc2).join(","), ...rows.map(r=>r.map(esc2).join(","))];
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------------------
   Phase 8: AI Insights — rule-based, explainable scoring (no black-box
   model; every point is attributable, which matters for a regulated
   lender). Labelled "indicative" throughout — not a validated PD model.
   --------------------------------------------------------------------- */
function computeCreditRiskScore(customer, appraisals, loanAccounts, productMap, policy){
  let score = 50;
  const factors = [];
  if(customer.creditScore){
    if(customer.creditScore>=750){ score+=20; factors.push(`Bureau score ${customer.creditScore} (≥750) — +20`); }
    else if(customer.creditScore>=650){ score+=5; factors.push(`Bureau score ${customer.creditScore} (650–749) — +5`); }
    else { score-=15; factors.push(`Bureau score ${customer.creditScore} (<650) — −15`); }
  } else factors.push("No bureau score on file — neutral");

  const custAppraisals = appraisals.filter(a=>a.customerId===customer.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const latest = custAppraisals[0];
  if(latest){
    if(latest.riskRating==="Low"){ score+=15; factors.push("Latest appraisal risk rating: Low — +15"); }
    else if(latest.riskRating==="High"){ score-=20; factors.push("Latest appraisal risk rating: High — −20"); }
    else factors.push("Latest appraisal risk rating: Medium — neutral");
    if(latest.householdExpenses && customer.income.monthly){
      const disposable = customer.income.monthly - latest.householdExpenses;
      if(disposable < 0){ score-=10; factors.push("Household expenses exceed declared income — −10"); }
    }
  } else factors.push("No credit appraisal on file — neutral");

  const custLoans = loanAccounts.filter(l=>l.customerId===customer.id);
  let worstClass = "Standard Assets";
  custLoans.forEach(acc=>{
    if(acc.status!=="Active") return;
    const a = analyzeLoanAccount(acc, productMap, policy);
    if(DPD_BANDS.findIndex(b=>b.label===a.classification) > DPD_BANDS.findIndex(b=>b.label===worstClass)) worstClass = a.classification;
  });
  if(NPA_CLASSES.includes(worstClass)){ score-=30; factors.push(`Existing loan classified ${worstClass} — −30`); }
  else if(worstClass.startsWith("SMA")){ score-=10; factors.push(`Existing loan in ${worstClass} — −10`); }
  else if(custLoans.length>0) factors.push("Existing loan(s) standard/current — neutral");

  if(customer.duplicateFlag){ score-=15; factors.push("Duplicate Aadhaar/PAN flagged at KYC — −15"); }

  score = Math.max(0, Math.min(100, Math.round(score)));
  const band = score>=70 ? "Low Risk" : score>=45 ? "Medium Risk" : "High Risk";
  const pd = score>=70 ? "≈2–5%" : score>=45 ? "≈8–15%" : "≈20–35%+";
  return { score, band, pd, factors };
}

async function computeDelinquencyWatchlist(loanAccounts, customers, payments){
  const today = todayStr();
  const custName = (id)=>{ const c=customers.find(c=>c.id===id); return c?c.personal.name:"—"; };
  const watch = [];
  loanAccounts.filter(a=>a.status==="Active").forEach(acc=>{
    const dpd = computeDPD(acc);
    const partials = (acc.schedule||[]).filter(i=>i.status==="Partial").length;
    const accPayments = payments.filter(p=>p.loanAccountId===acc.id);
    const lateCount = (acc.schedule||[]).filter(i=>i.status==="Paid" && i.paidDate && i.paidDate > i.dueDate).length;
    const next = (acc.schedule||[]).find(i=>i.status!=="Paid");
    const reasons = [];
    if(dpd>0) reasons.push(`Currently ${dpd} days overdue`);
    if(partials>0) reasons.push(`${partials} partially-paid installment(s)`);
    if(lateCount>=2) reasons.push(`${lateCount} prior late payments`);
    if(acc.recoveryStatus==="Promise to Pay") reasons.push("Promise to Pay on record — verify follow-through");
    if(next){
      const daysToNext = (new Date(next.dueDate)-new Date(today))/(1000*60*60*24);
      if(daysToNext>=0 && daysToNext<=3 && (dpd>0 || partials>0 || lateCount>=2)) reasons.push(`Next EMI due in ${Math.round(daysToNext)} day(s)`);
    }
    if(reasons.length>0){
      watch.push({ acc, customerName: custName(acc.customerId), reasons, riskLevel: reasons.length>=3?"High":reasons.length===2?"Medium":"Low" });
    }
  });
  return watch.sort((a,b)=> (b.reasons.length - a.reasons.length));
}

async function computeFraudSignals(customers, appraisals){
  const signals = [];
  const byMobile = {}; const byBank = {};
  customers.forEach(c=>{
    const m = c.personal.mobile;
    if(m){ byMobile[m] = byMobile[m]||[]; byMobile[m].push(c); }
    const acct = c.bank.account;
    if(acct){ byBank[acct] = byBank[acct]||[]; byBank[acct].push(c); }
  });
  Object.entries(byMobile).forEach(([m,list])=>{ if(list.length>1) signals.push({type:"Duplicate mobile number", detail:`${m} used by: ${list.map(c=>c.personal.name).join(", ")}`}); });
  Object.entries(byBank).forEach(([a,list])=>{ if(list.length>1) signals.push({type:"Duplicate bank account", detail:`A/c ${a} used by: ${list.map(c=>c.personal.name).join(", ")}`}); });
  customers.filter(c=>c.duplicateFlag).forEach(c=>signals.push({type:"Duplicate Aadhaar/PAN (from KYC)", detail:`${c.personal.name}: ${c.duplicateReason}`}));

  const byGps = {};
  appraisals.filter(a=>a.gpsLat && a.gpsLng).forEach(a=>{
    const key = a.gpsLat.toFixed(4)+","+a.gpsLng.toFixed(4);
    byGps[key] = byGps[key]||[]; byGps[key].push(a);
  });
  Object.entries(byGps).forEach(([k,list])=>{
    const distinctCustomers = new Set(list.map(a=>a.customerId));
    if(distinctCustomers.size>1) signals.push({type:"Reused field-visit GPS location", detail:`${distinctCustomers.size} different customers' appraisals geo-tagged at the same coordinates (${k})`});
  });
  return signals;
}

function recommendLoan(customer, products, policy){
  const income = customer.income.monthly || 0;
  const riskCategory = customer.riskCategory || "Medium";
  const band = policy.pricing.find(p=>p.riskCategory===riskCategory) || policy.pricing[1];
  const maxEmi = income * 0.5; // simple FOIR cap at 50%
  const eligibleProducts = products.filter(p=>p.active).map(prod=>{
    const monthlyRate = prod.interestRate/100/12;
    const n = prod.tenureMax;
    const maxLoan = monthlyRate>0 ? maxEmi * (Math.pow(1+monthlyRate,n)-1) / (monthlyRate*Math.pow(1+monthlyRate,n)) : maxEmi*n;
    return { product: prod.name, indicativeMaxAmount: Math.round(maxLoan), rateBand: `${band.minRate}–${band.maxRate}%`, tenureMax: prod.tenureMax };
  }).sort((a,b)=>b.indicativeMaxAmount-a.indicativeMaxAmount);
  return eligibleProducts;
}

/** Simple keyword-overlap matching against the bilingual knowledge
 *  base above — works fully offline, no API call, so it's available
 *  as a fallback wherever the live AI isn't reachable (e.g. this app
 *  hosted standalone without a configured proxy). Not a substitute for
 *  a real conversational assistant — it can only answer questions
 *  close to what's written above — but it's honest and useful rather
 *  than a dead end. */
/** Bilingual text helpers for the Borrower Portal — English shown as
 *  the primary line, Hindi as a smaller line below (bt, for headings/
 *  labels/paragraphs) or inline after a slash (bts, for buttons and
 *  short controls where a line break would break layout). Centralizing
 *  this in two functions keeps the formatting consistent everywhere
 *  rather than hand-styled differently in each screen. */
function bt(en, hi){
  return `${esc(en)}<br><span style="font-size:0.82em; font-weight:400; color:var(--slate); text-transform:none; letter-spacing:0;">${esc(hi)}</span>`;
}
function bts(en, hi){
  return `${esc(en)} / ${esc(hi)}`;
}

function findOfflineAnswer(query, kb){
  const q = query.toLowerCase();
  const words = q.split(/\s+/).filter(w=>w.length>2);
  let best = null, bestScore = 0;
  kb.forEach(entry=>{
    const haystack = (entry.q+" "+(entry.qHi||"")).toLowerCase();
    let score = 0;
    words.forEach(w=>{ if(haystack.includes(w)) score++; });
    if(score>bestScore){ bestScore = score; best = entry; }
  });
  if(!best || bestScore===0) return null;
  return `${best.a}\n\n${best.aHi||""}`;
}

   AI Provider — lets AI features work outside Claude.ai's runtime.
   ---------------------------------------------------------------------
   Browsers can't call api.anthropic.com directly with an embedded key
   from a standalone-hosted page (no CORS allowance, and exposing a raw
   key in client code is unsafe regardless). The real fix is a small
   server-side proxy you control — a Cloudflare Worker, Firebase Cloud
   Function, or any tiny backend — that holds your Anthropic (or other
   LLM) API key and forwards requests. Point baseUrl at that proxy.
   If nothing is configured, this falls back to the direct Claude.ai
   artifact call, which only works while this file runs inside Claude.ai.
   --------------------------------------------------------------------- */
function defaultAiConfig(){
  return { id:"default", enabled:false, baseUrl:"", apiKey:"", model:"claude-sonnet-4-6", updatedAt:null, updatedBy:null };
}
async function getAiConfig(){

/** Sends a chat-style message list and returns {ok, text, source, error}.
 *  Tries the configured custom AI provider first (expects the same
 *  request/response shape as Anthropic's /v1/messages — your proxy
 *  should accept that shape and forward it), then falls back to the
 *  direct in-artifact Claude call. */
async function callAiChat(messages, maxTokens){
  const cfg = await getAiConfig();
  if(cfg.enabled && cfg.baseUrl){
    try{
      const response = await fetch(cfg.baseUrl.replace(/\/$/,""), {
        method:"POST",
        headers:{ "Content-Type":"application/json", ...(cfg.apiKey ? {"Authorization":"Bearer "+cfg.apiKey} : {}) },
        body: JSON.stringify({ model: cfg.model||"claude-sonnet-4-6", max_tokens: maxTokens||800, messages })
      });
      const data = await response.json();
      const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
      if(text) return { ok:true, text, source:"custom" };
      return { ok:false, text:"", source:"custom", error:"Custom AI provider returned no text." };
    } catch(err){
      return { ok:false, text:"", source:"custom", error:"Custom AI provider unreachable — check the URL under Integrations." };
    }
  }
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens: maxTokens||800, messages })
    });
    const data = await response.json();
    const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    if(text) return { ok:true, text, source:"claude-artifact" };
    return { ok:false, text:"", source:"claude-artifact", error:"No response — this only works inside Claude.ai's artifact runtime, or with a custom AI provider configured under Integrations." };
  } catch(err){
    return { ok:false, text:"", source:"claude-artifact", error:"Couldn't reach an AI service. Configure a custom provider under Integrations to use AI features outside Claude.ai." };
  }
}

/**
 * Generic caller. Payload keys are a best-effort common shape
 * (id_number, name, father_name, address) — most providers accept
 * something close to this; rename per your chosen vendor's docs.
 * Returns {ok, status, raw, error}. Never throws.
 */
async function callVerificationApi(serviceKey, payload){
  const cfg = await getApiConfig();
  if(!cfg.baseUrl || !cfg.apiKey || !cfg[serviceKey+"Enabled"]){
    return { ok:false, status:"Not Configured", raw:null, error:"No provider configured for this yet — set it up under Integrations (Super Admin)." };
  }
  try{
    const url = cfg.baseUrl.replace(/\/$/,"") + cfg[serviceKey+"Endpoint"];
    const response = await fetch(url, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.apiKey },
      body: JSON.stringify(payload)
    });
    const raw = await response.json().catch(()=>null);
    if(!response.ok) return { ok:false, status:"Failed ("+response.status+")", raw, error:"Provider returned an error status." };
    const status = parseVerifyResponse(raw);
    return { ok:true, status, raw, error:null };
  } catch(err){
    return { ok:false, status:"Error", raw:null, error: "Request failed — likely a CORS restriction (many provider APIs must be called from a backend, not a browser) or an unreachable endpoint. Network access from this environment may also be restricted." };
  }
}

/** Best-effort status extraction — every vendor's response shape differs.
 *  Update this once a vendor is chosen; until then it just surfaces
 *  whatever plausible status field it can find, or "Response Received —
 *  Review Manually" so nothing is silently mis-reported as verified. */
function parseVerifyResponse(raw){
  if(!raw) return "Response Received — Review Manually";
  const candidates = [raw.status, raw.data && raw.data.status, raw.verified, raw.valid, raw.success];
  for(const c of candidates){
    if(c===true || /^(success|verified|valid|active)$/i.test(String(c||""))) return "Verified";
    if(c===false || /^(failed|invalid|not_found|inactive)$/i.test(String(c||""))) return "Failed";
  }
  return "Response Received — Review Manually";
}

async function computeEmiPosition(loanAccounts, payments){
  const today = todayStr();
  let emiDueTodayAmount=0, emiDueTodayCount=0, overdueAmount=0, overdueCount=0;
  for(const acc of loanAccounts){
    if(!acc.schedule) continue;
    for(const inst of acc.schedule){
      if(inst.status==="Paid") continue;
      const remaining = inst.emiAmount - (inst.paidAmount||0);
      if(inst.dueDate === today){ emiDueTodayAmount += remaining; emiDueTodayCount++; }
      else if(inst.dueDate < today){ overdueAmount += remaining; overdueCount++; }
    }
  }
  const collectionsToday = payments.filter(p=>p.date===today).reduce((s,p)=>s+p.amount,0);
  return { emiDueTodayAmount, emiDueTodayCount, overdueAmount, overdueCount, collectionsToday };
}

function evaluateRule(actual, operator, target){
  const a = Number(actual), t = Number(target);
  if(isNaN(a) || isNaN(t)) return false;
  switch(operator){
    case ">=": return a >= t;
    case "<=": return a <= t;
    case "==": return a === t;
    case "!=": return a !== t;
    case ">": return a > t;
    case "<": return a < t;
    default: return false;
  }
}

function evaluateProductRules(product, context){
  const rules = product.rules || [];
  if(rules.length===0) return { passed:false, results:[], reason:"No rules configured — auto-sanction requires at least one rule." };
  const results = rules.map(r=>{
    const actual = context[r.field];
    const passed = actual!==undefined && actual!==null && evaluateRule(actual, r.operator, r.value);
    return { field:r.field, operator:r.operator, value:r.value, actual, passed };
  });
  return { passed: results.every(r=>r.passed), results };
}

function periodsPerYear(freq){
  return {Monthly:12, Weekly:52, Fortnightly:26, Quarterly:4}[freq] || 12;
}

/** APR (Annual Percentage Rate) — the all-in cost of borrowing RBI's
 *  Key Fact Statement mandate requires, factoring in every fee
 *  alongside the interest rate, not just the nominal rate. Found via
 *  bisection: the rate at which the present value of net proceeds
 *  actually received (principal minus upfront fees) equals the present
 *  value of all future EMI outflows. Uses the SAME nominal-rate-per-
 *  period discounting convention as generateEmiSchedule() itself —
 *  that match matters: get it wrong and even the zero-fee case won't
 *  correctly reduce to the nominal interest rate, which is the
 *  simplest possible check that this is actually correct. */
function computeAPR(netProceeds, schedule, periodsPerYear){
  if(netProceeds<=0 || schedule.length===0) return 0;
  const npv = (annualRate)=>{
    const periodRate = annualRate/periodsPerYear;
    let total = -netProceeds;
    schedule.forEach((inst,i)=>{ total += inst.emiAmount / Math.pow(1+periodRate, i+1); });
    return total;
  };
  let lo = 0.0001, hi = 3.0;
  for(let iter=0; iter<100; iter++){
    const mid = (lo+hi)/2;
    if(Math.abs(npv(mid)) < 0.01) return mid*100;
    if(npv(mid) > 0) lo = mid; else hi = mid;
  }
  return ((lo+hi)/2)*100;
}

function generateEmiSchedule(loanAccount){
  const ppy = periodsPerYear(loanAccount.emiFrequency);
  const totalInstallments = Math.max(1, Math.round(loanAccount.tenureMonths / 12 * ppy));
  const periodRate = (loanAccount.interestRate/100) / ppy;
  const P = loanAccount.principal;
  let emi;
  if(periodRate === 0){
    emi = P / totalInstallments;
  } else {
    emi = P * periodRate * Math.pow(1+periodRate, totalInstallments) / (Math.pow(1+periodRate, totalInstallments) - 1);
  }
  const dayStep = Math.round(365 / ppy);
  let balance = P;
  const schedule = [];
  const startDate = new Date(loanAccount.disbursedDate);
  for(let i=1; i<=totalInstallments; i++){
    const interestComp = balance * periodRate;
    let principalComp = emi - interestComp;
    if(i === totalInstallments){ principalComp = balance; emi = principalComp + interestComp; }
    balance = Math.max(0, balance - principalComp);
    const dueDate = new Date(startDate);
    dueDate.setDate(dueDate.getDate() + dayStep*i);
    schedule.push({
      index: i, dueDate: dueDate.toISOString().slice(0,10),
      emiAmount: Math.round(emi), principalComponent: Math.round(principalComp), interestComponent: Math.round(interestComp),
      outstandingAfter: Math.round(balance), status: "Pending", paidAmount: 0, paidDate: null
    });
  }
  return { schedule, emiAmount: schedule.length ? schedule[0].emiAmount : 0, totalInstallments };
}

function estimateMonthlyEmi(principal, annualRatePct, tenureMonths){
  const r = (annualRatePct/100)/12;
  if(!tenureMonths) return 0;
  if(r===0) return principal/tenureMonths;
  return principal * r * Math.pow(1+r, tenureMonths) / (Math.pow(1+r, tenureMonths) - 1);
}

/** EMI with an optional moratorium: interest accrues monthly during the
 *  moratorium and is capitalized (added to principal) at its end — the
 *  standard treatment — then EMI is computed on the increased principal
 *  over the remaining tenure. Pass moratoriumMonths=0 for a plain EMI. */
function calculateEmiWithMoratorium(principal, annualRatePct, tenureMonths, moratoriumMonths){
  const r = (annualRatePct/100)/12;
  moratoriumMonths = Math.min(moratoriumMonths||0, Math.max(0,tenureMonths-1));
  let effectivePrincipal = principal;
  let capitalizedInterest = 0;
  for(let m=0; m<moratoriumMonths; m++){
    const interest = effectivePrincipal*r;
    capitalizedInterest += interest;
    effectivePrincipal += interest;
  }
  const repaymentMonths = Math.max(1, tenureMonths - moratoriumMonths);
  const emi = estimateMonthlyEmi(effectivePrincipal, annualRatePct, repaymentMonths);
  const totalPayment = emi*repaymentMonths;
  const totalInterest = totalPayment - principal;
  return { principal, effectivePrincipal, capitalizedInterest, moratoriumMonths, repaymentMonths, emi, totalPayment, totalInterest };
}

const DEPRECIATION_METHODS = ["WDV (Written Down Value)","SLM (Straight Line)"];

/** Book value as of today, given purchase cost/date and an annual rate.
 *  WDV: value shrinks by rate% of the REMAINING balance each year (never
 *  quite hits zero). SLM: a flat rate% of original cost each year (can
 *  hit zero once fully depreciated). Both are illustrative — actual
 *  depreciation schedules should follow Schedule II of the Companies Act
 *  or your auditor's policy, not a simple annualized approximation. */
function computeAssetBookValue(asset){
  const purchaseDate = new Date(asset.purchaseDate);
  const today = new Date(todayStr());
  const elapsedYears = Math.max(0, (today - purchaseDate) / (1000*60*60*24*365.25));
  const rate = (asset.depreciationRatePct||0)/100;
  let bookValue;
  if(asset.depreciationMethod && asset.depreciationMethod.startsWith("SLM")){
    const annualDep = asset.cost * rate;
    bookValue = Math.max(0, asset.cost - annualDep*elapsedYears);
  } else {
    bookValue = asset.cost * Math.pow(1-rate, elapsedYears);
  }
  return { elapsedYears, bookValue, accumulatedDepreciation: asset.cost - bookValue };
}

/* ---------------------------------------------------------------------
   Applicant-level CMA calculator (FOIR / DSCR / Debt-Equity / Current
   Ratio / Net Worth) — standard banking ratios computed from figures
   the appraising officer enters. Flag bands below are common rule-of-
   thumb thresholds used in Indian bank/NBFC lending practice (Tandon
   Committee current-ratio benchmark, typical DSCR/FOIR comfort levels)
   — NOT a fixed regulatory standard. Your Credit Policy should set the
   final thresholds; treat these as a starting reference, not a verdict.
   --------------------------------------------------------------------- */
function computeCmaRatios(cma, monthlyIncome, proposedEmi){
  const netWorth = (cma.totalAssets||0) - (cma.totalLiabilities||0);
  const currentRatio = cma.currentLiabilities>0 ? cma.currentAssets/cma.currentLiabilities : null;
  const debtEquityRatio = netWorth>0 ? (cma.totalLiabilities||0)/netWorth : null;
  const totalMonthlyObligation = (cma.existingEmi||0) + (proposedEmi||0);
  // FOIR against take-home pay is more accurate for salaried applicants
  // than against gross income — use it when provided.
  const foirBase = (cma.takeHomePay && cma.takeHomePay>0) ? cma.takeHomePay : monthlyIncome;
  const foirPct = foirBase>0 ? (totalMonthlyObligation/foirBase*100) : null;
  const annualDebtService = totalMonthlyObligation*12;
  const dscr = annualDebtService>0 ? ((cma.netOperatingIncome||0)/annualDebtService) : null;

  const flag = (value, good, caution, higherIsBetter)=>{
    if(value===null) return null;
    if(higherIsBetter) return value>=good ? "Good" : value>=caution ? "Caution" : "High Risk";
    return value<=good ? "Good" : value<=caution ? "Caution" : "High Risk";
  };
  return {
    netWorth, currentRatio, debtEquityRatio, foirPct, dscr, proposedEmi, totalMonthlyObligation,
    takeHomePay: cma.takeHomePay || null,
    flags: {
      currentRatio: flag(currentRatio, 1.33, 1.0, true),
      debtEquityRatio: flag(debtEquityRatio, 2, 4, false),
      foirPct: flag(foirPct, 50, 65, false),
      dscr: flag(dscr, 1.5, 1.0, true),
    }
  };
}

async function generateLoanAccountNumber(){
  const existing = new Set((await db.getAll("loanAccounts")).map(a=>a.accountNumber).filter(Boolean));
  let candidate;
  do{
    const digits = Math.floor(10000000 + Math.random()*89999999);
    candidate = "LN"+new Date().getFullYear()+digits;
  } while(existing.has(candidate));
  return candidate;
}

/** Accrues a DSA commission (does not pay it — that's a separate "Pay
 *  Commissions" run) when a lead sourced via a DSA is disbursed and
 *  that product carries a commission %. Safe to call unconditionally;
 *  it's a no-op if there's no DSA on the lead or no commission % set. */
async function accrueDsaCommission(leadId, sanction, disbursedAmount, actorName){
  if(!leadId) return;
  const lead = await db.get("leads", leadId);
  if(!lead || !lead.dsaId) return;
  const dsa = await db.get("dsaAgents", lead.dsaId);
  if(!dsa) return;
  const products = await db.getAll("products");
  const product = products.find(p=>p.name===sanction.product);
  const pct = product ? (product.dsaCommissionPct||0) : 0;
  if(pct<=0) return;
  const commissionAmount = disbursedAmount * (pct/100);
  await db.put("dsaCommissions", {
    id: uid("dsc"), dsaId: dsa.id, dsaName: dsa.name, leadId, sanctionId: sanction.id,
    disbursedAmount, commissionPct: pct, commissionAmount: Math.round(commissionAmount),
    status:"Accrued", paidDate:null, createdAt: nowISO(), createdBy: actorName
  });
  await logAudit(actorName, "System", "DSA Commission Accrued", `${dsa.name} — ${fmtINR(Math.round(commissionAmount))} (${pct}% of ${fmtINR(disbursedAmount)})`);
}

/* ---------------------------------------------------------------------
   Phase 6: DPD classification, ageing, provisioning
   --------------------------------------------------------------------- */
const DPD_BANDS = [
  {min:0,   max:0,        label:"Standard Assets"},
  {min:1,   max:30,       label:"SMA-0 (0–30 DPD)"},
  {min:31,  max:60,       label:"SMA-1 (31–60 DPD)"},
  {min:61,  max:90,       label:"SMA-2 (61–90 DPD)"},
  {min:91,  max:455,      label:"Sub-standard NPA"},
  {min:456, max:1185,     label:"Doubtful NPA"},
  {min:1186,max:Infinity, label:"Loss Assets"},
];
const NPA_CLASSES = ["Sub-standard NPA","Doubtful NPA","Loss Assets"];
const RECOVERY_STATUSES = ["Not Started","In Progress","Promise to Pay","Settlement Proposed","Legal Action","Settled","Written Off"];

function computeDPD(acc){
  const today = todayStr();
  const overdue = (acc.schedule||[]).filter(i=>i.status!=="Paid" && i.dueDate < today);
  if(overdue.length===0) return 0;
  const oldest = overdue.reduce((a,b)=> a.dueDate < b.dueDate ? a : b);
  const diffMs = new Date(today) - new Date(oldest.dueDate);
  return Math.max(0, Math.round(diffMs/(1000*60*60*24)));
}
function classifyDPD(dpd){
  const band = DPD_BANDS.find(b=> dpd>=b.min && dpd<=b.max);
  return band ? band.label : "Standard Assets";
}

function analyzeLoanAccount(acc, productMap, policy){
  const dpd = computeDPD(acc);
  const classification = classifyDPD(dpd);
  const today = todayStr();
  const overdueInsts = (acc.schedule||[]).filter(i=>i.status!=="Paid" && i.dueDate < today);
  const overdueAmount = overdueInsts.reduce((s,i)=>s+(i.emiAmount-(i.paidAmount||0)),0);
  const interestDue = overdueInsts.reduce((s,i)=>s+i.interestComponent,0);
  const prod = productMap[acc.product];
  const penalRate = prod ? prod.penaltyRatePct : 2;
  const penalInterest = overdueAmount * (penalRate/100) * (dpd/365);
  const provRow = policy.provisioning.find(p=>p.classification===classification);
  const provisioningPct = provRow ? provRow.pct : 0;
  const provisioningAmount = acc.principalOutstanding * (provisioningPct/100);
  return { dpd, classification, overdueAmount, interestDue, penalInterest, provisioningPct, provisioningAmount };
}

/* =========================================================================
   General Ledger — Chart of Accounts, Journal Vouchers, Ledger Posting,
   Day Book, Cash Book, Bank Book, Trial Balance-from-GL.

   This is built as a genuine double-entry system: every voucher must
   balance (total debits = total credits) before it can be saved, and
   every account's balance is DERIVED by summing its posted lines —
   never adjusted directly. That's what makes Trial Balance-from-GL
   mathematically guaranteed to balance, unlike the earlier
   approximated Trial Balance elsewhere in Accounting, which infers
   figures from operational records rather than tracking real postings.

   Deliberately built as a self-contained module for now: existing
   flows (disbursement, EMI collection, the earlier Journal & Expenses
   feature) still work exactly as before and don't yet post here
   automatically. Wiring those together is real follow-on work, done
   once this foundation is proven correct on its own — not rushed into
   the same pass.
   ========================================================================= */
const GL_ACCOUNT_TYPES = ["Asset","Liability","Equity","Income","Expense"];
const VOUCHER_TYPES = ["Journal Voucher","Payment Voucher","Receipt Voucher","Contra Voucher"];

function normalBalanceFor(accountType){
  return (accountType==="Asset" || accountType==="Expense") ? "Debit" : "Credit";
}

    // behaves as CREDIT-normal (increases with credits) — the opposite
    // of a normal asset account, which is why it needs an explicit

    ["1031","Accumulated Depreciation","Asset","Fixed Asset","Credit"],

async function ensureChartOfAccountsSeeded(){

  for(const acc of missing){ await db.put("chartOfAccounts", acc); }

}

async function getNextVoucherNumber(voucherType){
  const vouchers = await db.getAll("journalVouchers");
  const year = todayStr().slice(0,4);
  const prefix = voucherType==="Payment Voucher" ? "PV" : voucherType==="Receipt Voucher" ? "RV" : voucherType==="Contra Voucher" ? "CV" : "JV";
  const thisYearCount = vouchers.filter(v=>v.voucherNumber && v.voucherNumber.startsWith(`${prefix}-${year}`)).length;
  return `${prefix}-${year}-${String(thisYearCount+1).padStart(4,"0")}`;
}

/** An account's balance is always DERIVED from its posted voucher
 *  lines — summed in the direction of its normal balance — never
 *  stored/adjusted directly. This is what guarantees correctness. */
function computeLedgerBalance(account, postedVouchers){
  let debitTotal = 0, creditTotal = 0;
  postedVouchers.forEach(v=>{
    (v.lines||[]).forEach(line=>{
      if(line.ledgerAccountId===account.id){ debitTotal += line.debit||0; creditTotal += line.credit||0; }
    });
  });
  const net = account.normalBalance==="Debit" ? (debitTotal-creditTotal) : (creditTotal-debitTotal);
  return { debitTotal, creditTotal, balance: net };
}

async function computeAllLedgerBalances(){
  const [accounts, vouchers] = await Promise.all([db.getAll("chartOfAccounts"), db.getAll("journalVouchers")]);
  const posted = vouchers.filter(v=>v.status==="Posted");
  return accounts.filter(a=>a.active).map(a=>({ account: a, ...computeLedgerBalance(a, posted) }));
}

/** True period P&L — every Income and Expense account's activity
 *  restricted to vouchers dated within [fromDate, toDate], not the
 *  cumulative-since-inception balance the live Financial Statements
 *  tab shows. This is what "P&L for Q1" or "P&L for FY 2025-26"
 *  actually means — income and expense recognized IN that period. */
async function computePeriodPL(fromDate, toDate){
  const [accounts, vouchers] = await Promise.all([db.getAll("chartOfAccounts"), db.getAll("journalVouchers")]);
  const posted = vouchers.filter(v=>v.status==="Posted" && v.date>=fromDate && v.date<=toDate);
  const income = accounts.filter(a=>a.active && a.accountType==="Income").map(a=>({ account:a, ...computeLedgerBalance(a, posted) }));
  const expense = accounts.filter(a=>a.active && a.accountType==="Expense").map(a=>({ account:a, ...computeLedgerBalance(a, posted) }));
  const totalIncome = income.reduce((s,x)=>s+x.balance,0);
  const totalExpense = expense.reduce((s,x)=>s+x.balance,0);
  return { income, expense, totalIncome, totalExpense, netProfit: totalIncome-totalExpense, fromDate, toDate };
}

/** True Balance Sheet as of a specific date — every Asset, Liability,
 *  and Equity account's cumulative balance from inception up to
 *  asOfDate, not "as of today" the way the live Financial Statements
 *  tab always shows. A balance sheet is inherently "as of a point in
 *  time," unlike a P&L which is "for a period" — so this only needs
 *  one date, not a range. */
async function computePeriodBalanceSheet(asOfDate){
  const [accounts, vouchers] = await Promise.all([db.getAll("chartOfAccounts"), db.getAll("journalVouchers")]);
  const posted = vouchers.filter(v=>v.status==="Posted" && v.date<=asOfDate);
  const assets = accounts.filter(a=>a.active && a.accountType==="Asset").map(a=>({ account:a, ...computeLedgerBalance(a, posted) }));
  const liabilities = accounts.filter(a=>a.active && a.accountType==="Liability").map(a=>({ account:a, ...computeLedgerBalance(a, posted) }));
  const equity = accounts.filter(a=>a.active && a.accountType==="Equity").map(a=>({ account:a, ...computeLedgerBalance(a, posted) }));
  const totalAssets = assets.reduce((s,x)=>s+x.balance,0);
  const totalLiabilities = liabilities.reduce((s,x)=>s+x.balance,0);
  const totalEquity = equity.reduce((s,x)=>s+x.balance,0);
  return { assets, liabilities, equity, totalAssets, totalLiabilities, totalEquity, asOfDate, balanced: Math.abs(totalAssets-(totalLiabilities+totalEquity))<1 };
}

/** Auto-posts a system-generated voucher to the General Ledger from an
 *  already-approved operational action (disbursement, collection, an
 *  existing Journal & Expenses entry). Deliberately posts immediately
 *  (no separate Maker-Checker here) since the action it mirrors was
 *  already authorized through its own approval path — this is just
 *  recording it in double-entry form, not a new financial decision.
 *
 *  Resilience is built in here, not left to each caller to remember:
 *  if anything about this fails (a system account renamed/deleted, a
 *  lookup miss, whatever), it logs to console and returns quietly —
 *  it must never be able to break the operational action that
 *  triggered it. That operational action already fully happened
 *  (money moved, a loan account exists) whether or not its GL mirror
 *  succeeds; treating a GL posting failure as a reason to undo a real
 *  disbursement or collection would be the wrong trade-off.
 */
async function postToGeneralLedger({date, voucherType, narration, lineDefs, actor, actorRole}){
  try{
    const accounts = await db.getAll("chartOfAccounts");
    const findAccount = (name)=> accounts.find(a=>a.active && a.name===name);
    const lines = [];
    for(const def of lineDefs){
      if(!def.amount || def.amount<=0) continue;
      const account = findAccount(def.accountName);
      if(!account){ console.error(`GL auto-post: account "${def.accountName}" not found — skipping this posting.`); return; }
      lines.push({
        ledgerAccountId: account.id, ledgerAccountName: account.name,
        debit: def.side==="debit" ? def.amount : 0, credit: def.side==="credit" ? def.amount : 0,
        lineNarration: def.note || ""
      });
    }
    if(lines.length<2) return;
    const totalDebit = lines.reduce((s,l)=>s+l.debit,0);
    const totalCredit = lines.reduce((s,l)=>s+l.credit,0);
    if(Math.round(totalDebit*100) !== Math.round(totalCredit*100)){
      console.error("GL auto-post: lines didn't balance, skipping.", lineDefs);
      return;
    }
    const voucherNumber = await getNextVoucherNumber(voucherType);
    await db.put("journalVouchers", {
      id: uid("jv"), voucherNumber, voucherType, date, narration, lines,
      totalDebit: Math.round(totalDebit*100)/100, totalCredit: Math.round(totalCredit*100)/100,
      status: "Posted", proposedBy: actor, proposedByRole: actorRole,
      approvedBy: actor, approvedAt: nowISO(), autoPosted: true,
      createdAt: nowISO(), createdBy: actor
    });
  } catch(err){
    console.error("GL auto-post failed (non-fatal):", err);
  }
}

/* ---------------------------------------------------------------------
   Session timeout — auto-logout after inactivity, a genuine security
   improvement for a device that might get left unattended while
   logged in. Shows a warning with time to react before actually
   signing out, since an abrupt logout on a slow mobile connection
   would just be frustrating rather than secure.
   --------------------------------------------------------------------- */
let lastActivityTime = Date.now();
const DEFAULT_SESSION_TIMEOUT_MINUTES = 15;
const TIMEOUT_WARNING_SECONDS = 60;

function recordActivity(){ lastActivityTime = Date.now(); }

/** Populates the hidden print-area with formatted document HTML, then
 *  triggers the browser's native print dialog — which on every modern
 *  phone/desktop offers "Save as PDF" as a print destination. No
 *  external PDF library, so nothing here depends on a CDN staying up. */
function printDocument(htmlContent){
  const area = document.getElementById("print-area");
  area.innerHTML = `<div class="print-doc">${htmlContent}</div>`;
  setTimeout(()=>{ window.print(); }, 50);

async function getSessionTimeoutMinutes(){
  // apiConfig is staff-only by design (it also holds AI provider keys) —
  // a borrower session can never read it, so this must fail quietly to
  // the default rather than throwing on every 15-second check.
  try{
    const cfg = await db.get("apiConfig","security");
    return (cfg && cfg.sessionTimeoutMinutes) || DEFAULT_SESSION_TIMEOUT_MINUTES;
  } catch(err){
    return DEFAULT_SESSION_TIMEOUT_MINUTES;
  }
}

async function checkSessionTimeout(){
  if(session.type!=="staff" && session.type!=="borrower") return;
  if(session.showChangePasswordModal) return; // don't time out mid-password-change
  try{
    const timeoutMs = (await getSessionTimeoutMinutes()) * 60 * 1000;
    const idleMs = Date.now() - lastActivityTime;
    const remainingMs = timeoutMs - idleMs;

    if(remainingMs <= 0){
      const wasType = session.type;
      session = {type:null, user:null};
      try{ await firebase.auth().signOut(); await firebase.auth().signInAnonymously(); } catch(e){ console.error(e); }
      toast("Signed out due to inactivity.");
      setRoute("landing");
      return;
    }
    if(remainingMs <= TIMEOUT_WARNING_SECONDS*1000 && !session.timeoutWarningShown){
      session.timeoutWarningShown = true;
      render();
    }
  } catch(err){
    // This runs unattended every 15 seconds — it must never surface an
    // uncaught error, since there's no user action to attach it to.
    console.error("Session timeout check failed (non-fatal):", err);
  }
}

function renderSessionTimeoutWarningModal(){

/** Voice-to-text for any text input, using the browser's built-in
 *  Web Speech API — no external dependency, but a real limit worth
 *  being upfront about: Apple has never shipped SpeechRecognition in
 *  Safari on iOS, so this genuinely does nothing on an iPhone. Rather
 *  than show a mic button that silently fails there, this checks
 *  support first and disables the button with an honest explanation
 *  when it isn't available — degrading gracefully instead of
 *  pretending the feature works everywhere. */
function isSpeechRecognitionSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

function attachVoiceInput(buttonId, targetInputId, options={}){
  const btn = document.getElementById(buttonId);
  const target = document.getElementById(targetInputId);
  if(!btn || !target) return;

  if(!isSpeechRecognitionSupported()){
    btn.disabled = true;
    btn.style.opacity = "0.35";
    btn.style.cursor = "not-allowed";
    btn.title = "Voice input isn't available in this browser — this is expected on iPhone Safari, which doesn't support it. Try the microphone key on your keyboard instead.";
    return;
  }

  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognitionCtor();
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let listening = false;

  btn.onclick = ()=>{
    if(listening){ recognition.stop(); return; }
    try{ recognition.start(); } catch(err){ console.error("Voice input failed to start:", err); }
  };
  recognition.onstart = ()=>{ listening = true; btn.textContent = "🔴"; btn.title = "Listening… tap to stop"; };
  recognition.onresult = (event)=>{
    const transcript = event.results[0][0].transcript;
    target.value = options.append && target.value ? `${target.value} ${transcript}` : transcript;
    target.dispatchEvent(new Event("input", {bubbles:true}));
  };
  recognition.onerror = (event)=>{
    if(event.error!=="no-speech" && event.error!=="aborted") toast("Voice input error: "+event.error);
  };
  recognition.onend = ()=>{ listening = false; btn.textContent = "🎤"; btn.title = "Tap to speak"; };
}

function toast(msg){
  const t = document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

async function render(){
  clearRenderCache();
  const app = document.getElementById("app");
  app.innerHTML = `<div style="padding:60px;text-align:center;color:#5C6579;">Loading…</div>`;

  try{
    // Only meta/setupStatus is readable pre-login (see Security Rules) —
    // the real staff collection is locked down and can't be enumerated
    // by anyone who hasn't actually authenticated as staff.
    const setupStatus = await db.get("meta","setupStatus");
    const firstRun = !setupStatus || !setupStatus.initialized;
    if(!cachedNbfcContact){
      try{ cachedNbfcContact = await db.get("nbfcProfile","default"); } catch(err){ /* non-fatal — falls back to generic wording */ }
    }

    let body = "";
    if(session.type === "staff"){
      body = await renderStaffShell();
    } else if(session.type === "borrower"){
      body = await renderBorrowerShell();
    } else if(route === "staff-login"){
      body = renderStaffLogin(firstRun);
    } else if(route === "borrower-auth"){
      body = renderBorrowerAuth();
    } else {
      body = renderLanding(firstRun);
    }
    app.innerHTML = body;
    bindEvents();
  } catch(err){
    // Never leave the screen stuck on "Loading…" — if anything in the
    // render chain throws, show it plainly with a way back, rather
    // than silently hanging with no way to recover except reloading
    // the page and hoping.
    console.error("Render failed:", err);
    app.innerHTML = `
      <div style="padding:40px 24px; text-align:center; max-width:480px; margin:0 auto;">
        <h2 style="font-family:'Fraunces',serif;">Something went wrong showing this screen</h2>
        <p style="color:#5C6579; font-size:13px; word-break:break-word;">${esc(err.message||String(err))}</p>
        <button class="btn btn-gold" id="btn-render-error-reload" style="margin-top:16px;">Reload</button>
      </div>`;
    const reloadBtn = document.getElementById("btn-render-error-reload");
    if(reloadBtn) reloadBtn.onclick = ()=> window.location.reload();
  }
}
