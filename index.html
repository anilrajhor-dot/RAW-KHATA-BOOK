/* ---------------------------------------------------------------------
   Full-Journey Test Batch — covers every active product/scheme with at
   least one application, split between direct and DSA-sourced leads,
   the whole journey (lead → appraisal → sanction → disbursement → EMI
   collection → recovery for overdue ones) backdated from 01/04/2025 so
   there's a realistic spread of DPD across every NPA band by "today".
   --------------------------------------------------------------------- */
function dateToIso(dateStr){ return new Date(dateStr+"T10:00:00").toISOString(); }
function addDays(dateStr, days){ const d = new Date(dateStr); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function shuffleArray(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function handleLoadBulkDemoData(){
  const u = session.user;
  toast("Loading full-journey test batch — this takes a minute or two, please wait…");
  try{
    const MALE_NAMES = ["Ramesh","Suresh","Ganesh","Prakash","Vijay","Anil","Sunil","Rajesh","Mahesh","Dinesh","Ashok","Vinod","Sanjay","Manoj","Deepak","Ravi","Santosh","Balaji","Gopal","Ramdas","Yogesh","Nitin","Pravin","Rahul","Amit"];
    const FEMALE_NAMES = ["Sunita","Meena","Kavita","Anita","Rekha","Pooja","Neha","Priya","Geeta","Radha","Savita","Lata","Usha","Shanti","Kiran","Vandana","Manisha","Sarika","Archana","Snehal","Jyoti","Nirmala","Sushila","Kalpana","Asha"];
    const LAST_NAMES = ["Patil","Sharma","Deshmukh","Kulkarni","Joshi","Pawar","Rao","Kumar","Singh","Yadav","Gupta","Mishra","Verma","Chauhan","Naik","Jadhav","More","Kale","Shinde","Bhosale"];
    const LOCATIONS = ["Wardha, Maharashtra","Nagpur, Maharashtra","Pune, Maharashtra","Nashik, Maharashtra","Aurangabad, Maharashtra","Amravati, Maharashtra","Akola, Maharashtra","Solapur, Maharashtra"];
    const OCCUPATIONS = ["Kirana store owner","Tailoring unit","Vegetable vendor","Dairy farmer","Poultry farmer","Beauty parlour owner","General trading","Food processing unit","Small manufacturing unit","Service provider"];
    const pick = (arr)=>arr[Math.floor(Math.random()*arr.length)];
    const rand = (min,max)=>Math.floor(min+Math.random()*(max-min));
    const START = "2025-04-01";
    const TODAY = todayStr();
    const clamp = (dateStr)=> dateStr<START ? START : (dateStr>TODAY ? TODAY : dateStr);

    const products = (await db.getAll("products")).filter(p=>p.active);
    if(products.length===0){ toast("No active products found — use \"Activate All\" on Loan Products first."); return; }
    const fundAccounts = await db.getAll("fundAccounts");
    const fundAccount = fundAccounts[0] || null;
    if(!fundAccount){ toast("No fund account found — add one under Fund Management first."); return; }
    const staffList = await db.getAll("staff");
    const recoveryOfficers = staffList.filter(s=>s.role==="Recovery Officer");
    const officerPool = recoveryOfficers.length>0 ? recoveryOfficers : staffList;

    // Ensure at least a few DSA agents exist so DSA-sourced leads have someone to attribute to.
    let dsaAgents = await db.getAll("dsaAgents");
    if(dsaAgents.length===0){
      const seedDsas = [
        {name:"Vikram Associates", mobile:"9822011223"}, {name:"Priya Financial Services", mobile:"9822033445"}, {name:"Suresh DSA Network", mobile:"9822055667"}
      ];
      for(const d of seedDsas){
        await db.put("dsaAgents", { id: uid("dsa"), name:d.name, mobile:d.mobile, email:"", bankAccount:String(rand(1000000000,9999999999)), bankIfsc:"BANK0009999", active:true, createdAt: nowISO(), createdBy:"System (Test Batch)" });
      }
      dsaAgents = await db.getAll("dsaAgents");
    }
    // Products need a commission % for DSA accrual to actually happen — default any unset ones.
    for(const p of products){
      if(p.dsaCommissionPct===undefined || p.dsaCommissionPct===null){
        p.dsaCommissionPct = 1.5;
        await db.put("products", p);
      }
    }

    const totalCount = Math.max(50, products.length + 10);
    const rejectedCount = 5;
    const sanctionedTarget = totalCount - rejectedCount;

    // Guarantee at least one application per product, then fill the rest randomly.
    let productAssignments = products.map(p=>p);
    while(productAssignments.length < sanctionedTarget) productAssignments.push(pick(products));
    productAssignments = shuffleArray(productAssignments).slice(0, sanctionedTarget);

    let sanctionedCount = 0, rejectedDone = 0;
    const usedMobiles = new Set();
    const genMobile = ()=>{ let m; do{ m = "9"+String(rand(100000000,999999999)); } while(usedMobiles.has(m)); usedMobiles.add(m); return m; };
    const productsCovered = new Set();

    for(let i=0; i<totalCount; i++){
      const isFemale = Math.random()<0.5;
      const name = `${pick(isFemale?FEMALE_NAMES:MALE_NAMES)} ${pick(LAST_NAMES)}`;
      const mobile = genMobile();
      const aadhaar = String(rand(100000000000,999999999999));
      const pan = String.fromCharCode(65+rand(0,26))+String.fromCharCode(65+rand(0,26))+String.fromCharCode(65+rand(0,26))+String.fromCharCode(65+rand(0,26))+String.fromCharCode(65+rand(0,26))+rand(1000,9999)+String.fromCharCode(65+rand(0,26));
      const location = pick(LOCATIONS);
      const occupation = pick(OCCUPATIONS);
      const monthlyIncome = rand(15000,42000);
      const creditScore = rand(600,800);
      const riskCategory = creditScore>=750 ? "Low" : creditScore>=680 ? "Medium" : "High";
      const rejectThis = i>=sanctionedTarget;
      const product = rejectThis ? pick(products) : productAssignments[i];

      const isDsaSourced = Math.random()<0.3;
      const dsa = isDsaSourced ? pick(dsaAgents) : null;
      const leadDate = clamp(addDays(TODAY, -rand(1, 480)));

      const lead = {
        id: uid("led"), applicantName:name, mobile, aadhaar, pan, location, borrowerId:null,
        product: product.name, amountRequested: Math.min(product.maxLoanAmount||150000, rand(40000,150000)),
        purpose:"Working capital / business expansion", occupation, monthlyIncome,
        existingLoan: Math.random()<0.2?"Yes":"No",
        source: isDsaSourced ? "DSA" : pick(["Walk-in","Referral","Field Officer"]),
        dsaId: dsa ? dsa.id : null,
        status: rejectThis ? "Rejected" : "New", createdAt: dateToIso(leadDate), customerId:null, sanctionId:null
      };
      const amountRequested = lead.amountRequested;

      if(rejectThis){
        await db.put("leads", lead);
        rejectedDone++;
        continue;
      }
      productsCovered.add(product.id);

      const customer = {
        id: uid("cus"), personal:{name, dob:"", gender:isFemale?"Female":"Male", maritalStatus:"Married", mobile, email:""},
        family:{name:"", dependents:String(rand(0,4))},
        address:{current:location, permanent:location},
        business:{name:name.split(" ")[0]+"'s "+occupation, type:occupation, years:String(rand(1,12))},
        income:{monthly:monthlyIncome, annual:monthlyIncome*12, monthlyExpenses: Math.round(monthlyIncome*0.4), source:occupation},
        bank:{name:"Local Bank", account:String(rand(1000000000,9999999999)), ifsc:"BANK000"+rand(1000,9999)},
        nominee:{name:"", relationship:"Spouse", mobile:""},
        references:[`Reference for ${name}, ${genMobile()}, Neighbour`, `Reference 2, ${genMobile()}, Relative`],
        existingLoans:"", previousLoans:"", creditScore, riskCategory,
        kyc:{aadhaar, pan, otherIdType:"", otherIdNumber:"", photoBase64:null, docImageBase64:null, signatureBase64:null, gpsLat:null, gpsLng:null},
        duplicateFlag:false, duplicateReason:"", leadId:lead.id, createdAt: dateToIso(leadDate), createdBy: u.name
      };
      await db.put("customers", customer);
      lead.customerId = customer.id;
      lead.status = "Converted into Loan Application";
      await db.put("leads", lead);

      // Spread disbursement dates within the 01/04/2025 → today window so
      // the schedule naturally produces every DPD band by "today".
      const bucket = sanctionedCount<sanctionedTarget*0.5 ? "current" : sanctionedCount<sanctionedTarget*0.75 ? "mild" : sanctionedCount<sanctionedTarget*0.9 ? "severe" : "loss";
      let disbursedDateStr;
      if(bucket==="current") disbursedDateStr = clamp(addDays(TODAY, -rand(30,90)));
      else if(bucket==="mild") disbursedDateStr = clamp(addDays(TODAY, -rand(120,180)));
      else if(bucket==="severe") disbursedDateStr = clamp(addDays(TODAY, -rand(240,365)));
      else disbursedDateStr = clamp(addDays(START, rand(0,60))); // deepest overdue, anchored near 01/04/2025

      const appraisalDate = clamp(addDays(disbursedDateStr, -rand(5,10)));
      const sanctionDate = clamp(addDays(disbursedDateStr, -rand(1,4)));

      await db.put("appraisals", {
        id: uid("apr"), customerId:customer.id, leadId:lead.id, collateralValue:null,
        businessVerification:"Field visit conducted — operation active and consistent with declared business.",
        residenceVerification:"Residence verified, stable.", neighbourVerification:"No adverse remarks.",
        creditBureauReport:`Bureau score ${creditScore}.`,
        incomeAssessment:"Income supported by observed business activity.", cashFlowAssessment:"Adequate for proposed EMI.",
        householdExpenses: Math.round(monthlyIncome*0.4), repaymentCapacity: Math.round(monthlyIncome*0.3),
        riskRating: riskCategory, recommendation:"Approve", photoBase64:null, gpsLat:null, gpsLng:null,
        officerName:u.name, appraisalDate, status:"Submitted", createdAt: dateToIso(appraisalDate), createdBy: u.name
      });

      const sanction = {
        id: uid("snc"), leadId:lead.id, customerId:customer.id, product: product.name,
        sanctionedAmount: amountRequested, interestRate: product.interestRate, tenureMonths: product.tenureMax,
        proposedBy: u.name, proposedByRole: u.role, createdAt: dateToIso(sanctionDate),
        status:"Approved", approvedBy: u.name, approvedByRole: u.role, approvedAt: dateToIso(sanctionDate),
        disbursementId:null, loanAccountId:null, overrideUsed:false, overrideReason:""
      };
      await db.put("sanctions", sanction);

      const loanAccount = {
        id: uid("loa"), sanctionId:sanction.id, customerId:customer.id, product: product.name,
        principal: amountRequested, interestRate: sanction.interestRate, tenureMonths: sanction.tenureMonths,
        emiFrequency: product.emiFrequency, disbursedDate: disbursedDateStr, status:"Active",
        createdAt: dateToIso(disbursedDateStr), createdBy: u.name, accountNumber: await generateLoanAccountNumber(),
        recoveryOfficer:null, recoveryStatus:null
      };
      const gen = generateEmiSchedule(loanAccount);
      loanAccount.schedule = gen.schedule; loanAccount.emiAmount = gen.emiAmount; loanAccount.totalInstallments = gen.totalInstallments;
      loanAccount.principalOutstanding = loanAccount.principal;

      const disbursement = {
        id: uid("dsb"), sanctionId:sanction.id, customerId:customer.id, amount:amountRequested,
        mode:"Bank", date: disbursedDateStr, utr:"BULK"+Date.now()+i,
        fundAccountId: fundAccount.id, fundAccountName: fundAccount.name, createdAt: dateToIso(disbursedDateStr), createdBy: u.name
      };
      await db.put("disbursements", disbursement);
      sanction.disbursementId = disbursement.id;
      sanction.loanAccountId = loanAccount.id;
      await db.put("sanctions", sanction);
      await accrueDsaCommission(lead.id, sanction, amountRequested, u.name);

      // Simulate repayment history per bucket.
      const dueSoFar = loanAccount.schedule.filter(inst=>inst.dueDate<=TODAY);
      let payThrough;
      if(bucket==="current") payThrough = dueSoFar.length;
      else if(bucket==="mild") payThrough = Math.max(0, dueSoFar.length-rand(1,2));
      else if(bucket==="severe") payThrough = Math.max(0, Math.min(dueSoFar.length, rand(1,3)));
      else payThrough = Math.max(0, Math.min(dueSoFar.length, rand(0,2))); // "loss" bucket — barely any payments

      for(let k=0; k<payThrough; k++){
        const inst = loanAccount.schedule[k];
        await db.put("payments", {
          id: uid("pay"), loanAccountId:loanAccount.id, customerId:customer.id, installmentIndex:inst.index,
          amount: inst.emiAmount, mode: pick(["Cash","UPI","Bank"]), date: inst.dueDate,
          referenceNumber:"BULKPAY"+i+"-"+k, collectedBy:u.name, createdAt: dateToIso(inst.dueDate),
          fundAccountId: fundAccount.id, fundAccountName: fundAccount.name
        });
        inst.status = "Paid"; inst.paidAmount = inst.emiAmount; inst.paidDate = inst.dueDate;
      }
      loanAccount.principalOutstanding = loanAccount.schedule.filter(i2=>i2.status!=="Paid").reduce((s,i2)=>s+i2.principalComponent,0);

      // Exercise the Recovery module for the two most-overdue buckets.
      if((bucket==="severe" || bucket==="loss") && officerPool.length>0){
        const officer = pick(officerPool);
        loanAccount.recoveryOfficer = officer.name;
        loanAccount.recoveryStatus = "In Progress";
      }
      await db.put("loanAccounts", loanAccount);

      if((bucket==="severe" || bucket==="loss") && officerPool.length>0){
        const visitDate = clamp(addDays(TODAY, -rand(3,25)));
        await db.put("recoveryVisits", {
          id: uid("rvi"), loanAccountId: loanAccount.id, customerId: customer.id,
          visitDate, officer: loanAccount.recoveryOfficer,
          nextVisitDate: addDays(TODAY, rand(3,14)),
          borrowerRemarks: pick(["Assured payment after harvest/festival season.","Requested part-payment plan.","Business slow this quarter, asked for more time.","Agreed to pay next week."]),
          promiseToPayAmount: Math.round(loanAccount.emiAmount * rand(1,3)),
          promiseToPayDate: addDays(TODAY, rand(5,20)),
          settlementProposal:"", progressNotes:"Field visit conducted as part of full-journey test batch.",
          photoBase64:null, gpsLat:null, gpsLng:null, createdAt: dateToIso(visitDate), createdBy: u.name
        });
      }

      sanctionedCount++;
    }

    // A handful of journal expense entries for Accounting accuracy-checking.
    const expenseCategories = [["Rent",15000],["Electricity",4000],["Office Supplies",2500],["Salaries",60000],["Travel",3000]];
    for(const [category, amount] of expenseCategories){
      await db.put("journalEntries", {
        id: uid("jnl"), type:"Expense", category, date: todayStr(), amount,
        description:"Full-journey test batch entry", fundAccountId: fundAccount.id, fundAccountName: fundAccount.name,
        createdAt: nowISO(), createdBy: u.name, proposedBy: u.name, proposedByRole: u.role,
        status:"Posted", approvedBy: u.name, approvedAt: nowISO()
      });
    }
    const totalExpense = expenseCategories.reduce((s,[,a])=>s+a,0);
    const freshFund = await db.get("fundAccounts", fundAccount.id);
    freshFund.balance -= totalExpense;
    await db.put("fundAccounts", freshFund);

    const uncovered = products.filter(p=>!productsCovered.has(p.id));
    await logAudit(u.name, u.role, "Full-Journey Test Batch Loaded", `${sanctionedCount} sanctioned/disbursed (backdated from ${START}) across ${productsCovered.size}/${products.length} products, ${rejectedDone} rejected, DSA-sourced and direct leads, recovery visits logged for overdue accounts`);
    toast(`Done — ${sanctionedCount} sanctioned across ${productsCovered.size}/${products.length} products, ${rejectedDone} rejected.${uncovered.length>0?' Not covered: '+uncovered.map(p=>p.name).join(', '):''}`);
    render();
  } catch(err){
    console.error(err);
    toast("Bulk load failed: "+(err.message||err));
  }
}

async function handleSubmitApplication(){
  const u = session.user;
  const product = document.getElementById("ap-product").value;
  const amountRequested = Number(document.getElementById("ap-amount").value);
  const purpose = document.getElementById("ap-purpose").value.trim();
  const occupation = document.getElementById("ap-occupation").value.trim();
  const income = Number(document.getElementById("ap-income").value);
  const existingLoan = document.getElementById("ap-existing").value;
  const referralCodeInput = document.getElementById("ap-referral-code").value.trim().toUpperCase();
  if(!amountRequested || amountRequested<=0){ toast("Enter a valid loan amount."); return; }

  let dsaId = null, source = "Mobile App / Website — Self Applied";
  if(referralCodeInput){
    const matchedDsa = (await db.getAll("dsaAgents")).find(d=>d.referralCode===referralCodeInput && d.active);
    if(matchedDsa){ dsaId = matchedDsa.id; source = "DSA"; }
  }

  const lead = {
    id: uid("led"), applicantName: u.name, mobile: u.mobile, aadhaar:"", pan:"", location: u.location||"", borrowerId: u.id,
    product, amountRequested, purpose, occupation, monthlyIncome: income||null,
    existingLoan, source, dsaId, status:"New", createdAt: nowISO(), customerId:null
  };
  await db.put("leads", lead);
  await logAudit(u.name, "Borrower", "Loan Application Submitted", `${product} — ${fmtINR(amountRequested)}${dsaId?" — via DSA referral":""}`);
  toast(referralCodeInput && !dsaId ? "Application submitted — that referral code wasn't recognized, so it was submitted without one." : "Application submitted. You can track its status under My Applications.");
  session.borrowerTab = "status";
  render();
}

  render();
}

function handleStartConvert(leadId){
  db.get("leads", leadId).then(lead=>{
    if(!lead) return;
    session.staffTab = "customers";
    session.custSubview = "new";
    session.convertLeadId = leadId;
    session.leadPrefill = lead;
    resetCustomerDraft();
    render();
  });
}

async function checkDuplicateID(aadhaar, pan, excludeId){
  const customers = await db.getAll("customers");
  const aClean = (aadhaar||"").replace(/\D/g,'');
  const pClean = (pan||"").trim().toUpperCase();
  const aHash = aClean ? await hashField(aClean) : "";
  const pHash = pClean ? await hashField(pClean) : "";
  // aadhaarHash/panHash are populated for every customer going forward
  // (see handleSaveCustomer); older not-yet-migrated records fall back
  // to a direct plaintext compare so duplicate detection never silently
  // stops working mid-migration.
  const dupAadhaar = aClean && customers.find(c=> c.id!==excludeId && (
    c.kyc.aadhaarHash ? c.kyc.aadhaarHash===aHash : (typeof c.kyc.aadhaar==="string" && c.kyc.aadhaar.replace(/\D/g,'')===aClean)
  ));
  const dupPan = pClean && customers.find(c=> c.id!==excludeId && (
    c.kyc.panHash ? c.kyc.panHash===pHash : (typeof c.kyc.pan==="string" && c.kyc.pan.trim().toUpperCase()===pClean)
  ));
  const dupCustomer = dupAadhaar || dupPan;
  if(!dupCustomer) return null;
  const matchedOn = dupAadhaar ? "Aadhaar" : "PAN";
  const theirLoans = (await db.getAll("loanAccounts")).filter(a=>a.customerId===dupCustomer.id);
  const theirActive = theirLoans.filter(a=>a.status==="Active");
  const theirOutstanding = theirActive.reduce((s,a)=>s+a.principalOutstanding,0);
  const loanNote = theirActive.length>0
    ? ` This customer already has ${theirActive.length} active loan account(s) with us totaling ${fmtINR(theirOutstanding)} outstanding.`
    : ` No active loan accounts found for them yet.`;
  return `${matchedOn} already registered against customer "${dupCustomer.personal.name}".${loanNote}`;
}

async function handleSaveCustomer(){
  const val = (id)=> { const el=document.getElementById(id); return el ? el.value.trim() : ""; };
  const name = val("c-name");
  const mobile = val("c-mobile");
  if(!name){ toast("Customer name is required."); return; }

  const existingId = document.getElementById("btn-save-customer").dataset.customer;
  const existing = existingId ? await db.get("customers", existingId) : null;

  const aadhaar = val("c-aadhaar");
  const pan = val("c-pan").toUpperCase();
  const duplicateReason = await checkDuplicateID(aadhaar, pan, existingId||null);
  const [aadhaarEnc, panEnc, aadhaarHash, panHash] = await Promise.all([
    encryptField(aadhaar), encryptField(pan), hashField(aadhaar), hashField(pan)
  ]);

  const customer = {
    id: existingId || uid("cus"),
    personal: { name, dob: val("c-dob"), gender: val("c-gender"), maritalStatus: val("c-marital"), mobile, email: val("c-email") },
    family: { name: val("c-family-name"), dependents: val("c-dependents") },
    address: { current: val("c-addr-current"), permanent: val("c-addr-permanent") },
    business: { name: val("c-biz-name"), type: val("c-biz-type"), years: val("c-biz-years") },
    income: { monthly: Number(val("c-income-monthly"))||null, annual: Number(val("c-income-annual"))||null, monthlyExpenses: Number(val("c-expenses-monthly"))||null, source: val("c-income-source") },
    bank: { name: val("c-bank-name"), account: val("c-bank-account"), ifsc: val("c-bank-ifsc").toUpperCase() },
    nominee: { name: val("c-nom-name"), relationship: val("c-nom-relation"), mobile: val("c-nom-mobile") },
    references: [ val("c-ref1"), val("c-ref2") ],
    existingLoans: val("c-existing-loans"),
    previousLoans: val("c-previous-loans"),
    creditScore: Number(val("c-credit-score"))||null,
    riskCategory: val("c-risk"),
    kyc: {
      aadhaar: aadhaar ? aadhaarEnc : null, pan: pan ? panEnc : null,
      aadhaarHash, panHash,
      otherIdType: val("c-other-id-type"), otherIdNumber: val("c-other-id-number"),
      // Preserve existing KYC images/signature/GPS unless a new one was
      // actively captured during this edit session.
      photoBase64: customerDraft.photoBase64 || (existing ? existing.kyc.photoBase64 : null),
      docImageBase64: customerDraft.docImageBase64 || (existing ? existing.kyc.docImageBase64 : null),
      signatureBase64: existing ? existing.kyc.signatureBase64 : (sigPadCtx ? document.getElementById("sig-pad").toDataURL() : null),
      gpsLat: customerDraft.gpsLat || (existing ? existing.kyc.gpsLat : null),
      gpsLng: customerDraft.gpsLng || (existing ? existing.kyc.gpsLng : null)
    },
    duplicateFlag: !!duplicateReason,
    duplicateReason: duplicateReason || "",
    leadId: existing ? existing.leadId : (session.convertLeadId || null),
    createdAt: existing ? existing.createdAt : nowISO(),
    createdBy: existing ? existing.createdBy : session.user.name,
    updatedAt: existing ? nowISO() : null,
    updatedBy: existing ? session.user.name : null
  };

  await db.put("customers", customer);
  await logAudit(session.user.name, session.user.role, existing ? "Customer Updated" : "Customer Created", `${name}${session.convertLeadId && !existing ? " (converted from lead)" : ""}`);
  if(duplicateReason){
    await logAudit(session.user.name, session.user.role, "Duplicate ID Flagged", `${name}: ${duplicateReason}`);
  }

  if(session.convertLeadId && !existing){
    const lead = await db.get("leads", session.convertLeadId);
    if(lead){
      lead.status = "Converted into Loan Application";
      lead.customerId = customer.id;
      await db.put("leads", lead);
      await logAudit(session.user.name, session.user.role, "Lead Converted to Customer", `${lead.applicantName} → ${name}`);
    }
  }

  toast(duplicateReason ? "Customer saved — duplicate ID flagged for review." : (existing ? "Changes saved." : "Customer saved."));
  session.custSubview = existing ? "view" : "list";
  session.viewingCustomerId = existing ? existing.id : session.viewingCustomerId;
  session.editingCustomer = null;
  session.convertLeadId = null;
  session.leadPrefill = null;
  resetCustomerDraft();
  render();
}

/* =========================================================================
   Floating Help Widget — persistent across every screen (staff + borrower),
   separate from the Help tab and AI Assistant/Advisor tabs. Same
   Claude-via-artifact caveat: only sends while running inside Claude.ai.
   ========================================================================= */
function initFloatingHelp(){
  if(document.getElementById("floating-help-btn")) return;
  const btn = document.createElement("button");
  btn.id = "floating-help-btn";
  btn.innerHTML = "💬";
  btn.title = "Quick Help";
  btn.style.cssText = "position:fixed; bottom:20px; right:20px; width:56px; height:56px; border-radius:50%; background:#C6992F; color:#0E1A30; border:none; font-size:24px; box-shadow:0 4px 14px rgba(0,0,0,.28); z-index:998; cursor:pointer;";
  btn.onclick = toggleFloatingHelp;
  document.body.appendChild(btn);

  const panel = document.createElement("div");
  panel.id = "floating-help-panel";
  panel.style.cssText = "position:fixed; bottom:86px; right:20px; width:320px; max-width:90vw; max-height:60vh; background:#fff; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.3); z-index:999; display:none; flex-direction:column; overflow:hidden; border:1px solid #DCD7CA; font-family:'Inter',system-ui,sans-serif;";
  document.body.appendChild(panel);
}

function toggleFloatingHelp(){
  const panel = document.getElementById("floating-help-panel");
  if(!panel) return;
  const isHidden = panel.style.display==="none" || !panel.style.display;
  panel.style.display = isHidden ? "flex" : "none";
  if(isHidden) renderFloatingHelpPanel();
}

function renderFloatingHelpPanel(){
  const panel = document.getElementById("floating-help-panel");
  if(!panel) return;
  const messages = session.floatingHelpMessages || (session.floatingHelpMessages = []);
  panel.innerHTML = `
    <div style="background:#0E1A30; color:#fff; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #C6992F;">
      <b style="font-family:'Fraunces',serif; font-size:15px;">Quick Help</b>
      <button id="btn-close-floating-help" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1;">×</button>
    </div>
    <div id="floating-chat-messages" style="flex:1; overflow-y:auto; padding:12px; font-size:13px; background:#F6F4EF; min-height:120px;">
      ${messages.length===0 ? `<p style="color:#5C6579; font-size:12.5px; font-style:italic;">Ask about any screen, a term you don't recognize, or how to do something — from anywhere in the app.</p>` :
        messages.map(m=>`<div style="margin-bottom:10px;"><b>${m.role==='user'?'You':'Help'}:</b> ${esc(m.content)}</div>`).join("")}
    </div>
    <div style="background:#FBF1DC; color:#5C4200; font-size:11px; padding:6px 12px;">Works while this runs inside Claude.ai — needs your own key once hosted standalone.</div>
    <div style="display:flex; gap:6px; padding:10px; border-top:1px solid #DCD7CA;">
      <input id="floating-chat-input" placeholder="Ask a question…" style="flex:1; padding:8px 10px; border:1px solid #DCD7CA; border-radius:6px; font-size:13px;">
      <button id="btn-voice-floating-help" style="background:#fff; color:#0E1A30; border:1px solid #DCD7CA; border-radius:7px; padding:8px 10px; font-size:14px; cursor:pointer;" title="Tap to speak">🎤</button>
      <button id="btn-floating-send" style="background:#C6992F; color:#0E1A30; border:none; border-radius:7px; padding:8px 14px; font-weight:600; font-size:13px; cursor:pointer;">Send</button>
    </div>
  `;
  const closeBtn = document.getElementById("btn-close-floating-help");
  if(closeBtn) closeBtn.onclick = toggleFloatingHelp;
  const sendBtn = document.getElementById("btn-floating-send");
  if(sendBtn) sendBtn.onclick = handleSendFloatingHelp;
  const input = document.getElementById("floating-chat-input");
  if(input) input.onkeydown = (e)=>{ if(e.key==="Enter") handleSendFloatingHelp(); };
  attachVoiceInput("btn-voice-floating-help", "floating-chat-input");
  const msgBox = document.getElementById("floating-chat-messages");
  if(msgBox) msgBox.scrollTop = msgBox.scrollHeight;
}

async function handleSendFloatingHelp(){
  const input = document.getElementById("floating-chat-input");
  const text = input.value.trim();
  if(!text) return;
  const messages = session.floatingHelpMessages || (session.floatingHelpMessages = []);
  messages.push({role:"user", content:text});
  input.value = "";
  renderFloatingHelpPanel();

  const isBorrower = session.type==="borrower";
  const systemContext = isBorrower
    ? "You are a friendly loan advisor for NBFC LMS, a borrower-facing loan application portal. Explain loan products, documents needed, and the application process in plain language. Never invent specific approval decisions, interest rates, or amounts — direct the person to their branch for anything specific to their own application."
    : "You are a helpful assistant embedded in NBFC LMS, an NBFC Loan Management System, answering a staff member's quick question from wherever they are in the app. Be concise and practical for a banking/NBFC operations audience.";
  const apiMessages = messages.map(m=>({role:m.role, content:m.content}));
  apiMessages.unshift({role:"user", content: systemContext});
  apiMessages.splice(1,0,{role:"assistant", content:"Understood."});

  const result = await callAiChat(apiMessages, 800);
  let replyText;
  if(result.ok){
    replyText = result.text;
  } else {
    const kb = isBorrower ? BORROWER_HELP : STAFF_HELP.flatMap(section=>section.items);
    const offlineAnswer = findOfflineAnswer(text, kb);
    replyText = offlineAnswer
      ? `[Offline mode — matched from Help, not a live AI response]\n\n${offlineAnswer}`
      : `${result.error}\n\nI couldn't find a close match in Help either — try rephrasing, or check the Help tab directly.`;
  }
  messages.push({role:"assistant", content: replyText});
  renderFloatingHelpPanel();
}

/** Runs every product/policy/fund/compliance/etc. seed. Safe to call
 *  repeatedly — each seed function guards itself with its own meta
 *  flag. Called after a real staff login (or right after Setup Admin
 *  creates the account) rather than on boot, because these seeds write
 *  to collections the new Security Rules correctly restrict to
 *  authenticated staff — an anonymous pre-login session can no longer
 *  write them, which is the whole point of the rules. */
async function ensureAadhaarPanEncrypted(){
  const flag = await db.get("meta","aadhaarPanEncrypted");
  if(flag && flag.value) return;
  const customers = await db.getAll("customers");
  let migrated = 0;
  for(const c of customers){
    const needsAadhaar = typeof c.kyc.aadhaar === "string" && c.kyc.aadhaar;
    const needsPan = typeof c.kyc.pan === "string" && c.kyc.pan;
    if(!needsAadhaar && !needsPan && c.kyc.aadhaarHash!==undefined) continue; // already migrated
    const aadhaarRaw = needsAadhaar ? c.kyc.aadhaar : "";
    const panRaw = needsPan ? c.kyc.pan : "";
    const [aadhaarEnc, panEnc, aadhaarHash, panHash] = await Promise.all([
      needsAadhaar ? encryptField(aadhaarRaw) : Promise.resolve(c.kyc.aadhaar||null),
      needsPan ? encryptField(panRaw) : Promise.resolve(c.kyc.pan||null),
      hashField(aadhaarRaw), hashField(panRaw)
    ]);
    c.kyc.aadhaar = aadhaarEnc;
    c.kyc.pan = panEnc;
    c.kyc.aadhaarHash = aadhaarHash;
    c.kyc.panHash = panHash;
    await db.put("customers", c);
    migrated++;
  }
  await db.put("meta", {id:"aadhaarPanEncrypted", key:"aadhaarPanEncrypted", value:true, migratedCount:migrated, migratedAt:nowISO()});
}

async function ensureAllSeeds(){
  await ensureSeedPhase3();
  await ensureSeedPhase4();
  await ensureSeedCompliance();
  await ensureSeedYearEndClosing();
  await ensureSeedMicroEnterpriseTemplates();
  await backfillLoanSchedules();
  await ensureAadhaarPanEncrypted();
}

(async function boot(){
  try{
    await initFirebase();
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(()=>{ /* fine if unavailable, e.g. opened via file:// */ });
    }
    render();
    initFloatingHelp();
    ["mousemove","mousedown","keydown","touchstart","scroll"].forEach(evt=>{
      document.addEventListener(evt, recordActivity, {passive:true});
    });
    setInterval(checkSessionTimeout, 15000);
  } catch(err){
    console.error("NBFC LMS failed to start:", err);
    // initFirebase() already rendered a setup message if config is missing.
  }
})();
